<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Timer</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;font-family:"Segoe Print","Comic Sans MS",cursive;color:#1a1a5c}
.app{width:min(92vw,380px);border:3px solid #222;border-radius:6px;padding:20px;text-align:center;background:#fffdf8}
h1{margin:0 0 10px;font-size:1.8rem;letter-spacing:2px}
.ring{position:relative;width:260px;height:260px;margin:10px auto}
svg{width:100%;height:100%;transform:rotate(-90deg)}
#t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.2rem;font-weight:bold}
.row{display:flex;gap:12px;margin:16px 0}
button{flex:1;padding:16px;font:inherit;font-size:1.3rem;border:3px solid #222;background:#fff;border-radius:6px;cursor:pointer;color:#1a1a5c}
button:active{background:#dde}
p{font-size:1.2rem;margin:6px}
small{display:block;min-height:1.2em}
</style>
</head>
<body>
<div class="app">
<h1>STUDY TIMER</h1>
<div class="ring">
<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#ddd" stroke-width="4"/><circle id="p" cx="50" cy="50" r="46" fill="none" stroke="#1a1a5c" stroke-width="4" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"/></svg>
<div id="t">25:00</div>
</div>
<div class="row"><button id="s">START</button><button id="r">RESET</button></div>
<p>Sessions done: <span id="n">0</span></p>
<small id="m"></small>
</div>
<script>
const T=1500;let left=T,iv=null,n=0,ac;
const t=document.getElementById('t'),p=document.getElementById('p'),s=document.getElementById('s'),m=document.getElementById('m');
function show(){const a=Math.floor(left/60),b=left%60;t.textContent=String(a).padStart(2,'0')+':'+String(b).padStart(2,'0');p.style.strokeDashoffset=289*(1-left/T);document.title=t.textContent+' - Study Timer'}
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);const st=ac.currentTime+i*.25;g.gain.setValueAtTime(.2,st);g.gain.exponentialRampToValueAtTime(.001,st+.24);o.start(st);o.stop(st+.25)})}catch(e){}}
function stop(){clearInterval(iv);iv=null;s.textContent='START'}
s.onclick=()=>{
if(iv){stop();s.textContent='RESUME';return}
if(left<=0)left=T;
m.textContent='Focus time! 📚';s.textContent='PAUSE';
try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
iv=setInterval(()=>{left--;show();if(left<=0){stop();n++;document.getElementById('n').textContent=n;m.textContent='Great job! Take a break 🎉';beep();left=T;show()}},1000)};
document.getElementById('r').onclick=()=>{stop();left=T;show();m.textContent=''};
show();
</script>
</body>
</html>
