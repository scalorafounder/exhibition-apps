<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do List</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#bfe3ff;font-family:"Segoe Print","Comic Sans MS",cursive,sans-serif;color:#1a1a5e}
.app{width:min(94vw,440px);min-height:520px;background:#fff;border:3px solid #222;border-radius:6px;padding:22px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #8fc3ec}
h1{margin:0 0 16px;text-align:center;font-size:1.8rem;letter-spacing:1px}
form{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:10px;border:3px solid #222;border-radius:4px;color:#1a1a5e}
button.add{font:inherit;font-size:1.1rem;font-weight:bold;padding:10px 14px;border:3px solid #1d6b34;background:#2fb457;color:#fff;border-radius:4px;cursor:pointer;min-height:48px}
button.add:hover{background:#28a04d}
button.add:active{background:#1f8a3d}
ul{list-style:none;padding:0;margin:18px 0;flex:1}
li{display:flex;align-items:center;gap:14px;padding:8px 0;font-size:1.3rem}
.box{width:38px;height:38px;flex:none;border:3px solid #222;border-radius:4px;background:#fff;cursor:pointer;font-size:1.5rem;line-height:1;color:#2a9d4a;display:flex;align-items:center;justify-content:center}
.t{flex:1;word-break:break-word;cursor:pointer}
li.done .t{text-decoration:line-through;opacity:.5}
.x{width:44px;height:44px;border:none;background:none;font-size:2rem;color:#222;cursor:pointer;border-radius:50%}
.x:hover{background:#fde0e0;color:#c00}
.empty{text-align:center;opacity:.6;margin-top:30px}
#count{font-size:1.1rem}
</style>
</head>
<body>
<div class="app">
<h1>MY TO-DO LIST</h1>
<form id="f"><input id="in" type="text" placeholder="add a task..." maxlength="60" autocomplete="off"><button class="add" type="submit">ADD</button></form>
<ul id="list"></ul>
<div id="count"></div>
</div>
<script>
let tasks=[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
const list=document.getElementById("list"),count=document.getElementById("count"),inp=document.getElementById("in");
function render(){
list.innerHTML="";
tasks.forEach((k,i)=>{
const li=document.createElement("li");if(k.d)li.className="done";
const b=document.createElement("div");b.className="box";b.textContent=k.d?"✔":"";
const s=document.createElement("span");s.className="t";s.textContent=k.t;
const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","delete");
const tog=()=>{k.d=!k.d;render()};
b.onclick=tog;s.onclick=tog;
x.onclick=()=>{tasks.splice(i,1);render()};
li.append(b,s,x);list.appendChild(li);
});
if(!tasks.length){const e=document.createElement("div");e.className="empty";e.textContent="All done! 🎉";list.appendChild(e)}
const n=tasks.filter(k=>!k.d).length;
count.textContent=n+" task"+(n==1?"":"s")+" left";
}
document.getElementById("f").onsubmit=e=>{
e.preventDefault();
const v=inp.value.trim();
if(v){tasks.push({t:v,d:false});inp.value="";render()}
inp.focus();
};
render();
</script>
</body>
</html>
