<title>Beat Pad Rush</title>
<style>
:root{--bg:#120d2b;--bg2:#2a1450;--a:#ff4d8d;--b:#ffc933;--c:#2ee6c5;--d:#6c7bff;--l:#fff8ee;--r:16px}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0;height:100dvh;overflow:hidden;font-family:system-ui,sans-serif;color:var(--l);background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg))}
#app{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:auto;padding:8px;gap:8px}
header{display:flex;justify-content:space-between;align-items:center;font-weight:800}

.st{display:flex;gap:12px;font-size:15px;align-items:center}
#snd{min-height:44px;min-width:44px;border-radius:12px;border:0;background:#ffffff22;color:var(--l);font-size:20px}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#120d2bcc;border-radius:var(--r);text-align:center;padding:16px;transition:opacity .3s}
.ov.h{opacity:0;pointer-events:none}
.ov h2{font-size:clamp(32px,8vw,56px);margin:0;color:var(--b)}
.big{min-height:64px;padding:0 40px;font-size:24px;font-weight:800;border:0;border-radius:var(--r);background:var(--a);color:#fff;transition:transform .1s;box-shadow:0 6px 0 #a02359}
.big:active{transform:scale(.94)}

</style></head><body>
<div id="app">
<header><h1>🥁 BEAT PAD RUSH</h1><div class="st"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">0</b></span><span>❤️<b id="lv">3</b></span><button id="snd">🔇</button></div></header>
<div id="wrap"><canvas id="cv"></canvas>
<div class="ov" id="t"><h2>BEAT PAD RUSH</h2><div>Tap the pad matching each falling note!<br>Keys: Q W E R / A S D F / Z X C V</div><button class="big" id="go">Play</button></div>
<div class="ov h" id="o"><h2>Game Over</h2><div id="fs" style="font-size:22px"></div><button class="big" id="ag">Play again</button></div></div>
<div id="pads"></div>
</div>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),$=i=>document.getElementById(i);
const cols=['#ff4d8d','#ffc933','#2ee6c5','#6c7bff'],keys='qwerasdfzxcv',N=12;

const pe=[];
for(let i=0;i<N;i++){const b=document.createElement('button');b.className='p';b.style.background=cols[i%4];b.textContent=keys[i].toUpperCase();b.addEventListener('pointerdown',e=>{e.preventDefault();hit(i)});$('pads').appendChild(b);pe.push(b)}
addEventListener('contextmenu',e=>e.preventDefault());

function lose(){lives--;$('lv').textContent=Math.max(0,lives);if(lives<=0)end()}
function end(){run=false;best=Math.max(best,score);$('bs').textContent=best;$('fs').innerHTML='Score '+score+' · Best '+best;$('o').classList.remove('h');beep(150,.5,'square')}
function start(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();score=0;lives=3;notes=[];parts=[];sp=1;spawn=0;$('sc').textContent=0;$('lv').textContent=3;$('t').classList.add('h');$('o').classList.add('h');run=true;beep(500)}
$('go').onclick=start;$('ag').onclick=start;
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;

</script></body></html>
