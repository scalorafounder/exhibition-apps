<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tony's Pizza Rush</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Comic Sans MS,Segoe Print,cursive;background:#faf6ee;color:#1a1a5e;min-height:100vh}
.app{max-width:900px;margin:auto;border:4px solid #222;min-height:100vh;display:flex;flex-direction:column}
h1{margin:0;padding:14px 18px;border-bottom:4px solid #222;font-size:2rem}
.info{display:flex;justify-content:space-between;padding:8px 18px;font-size:1.1rem;font-weight:bold}
.cards{display:flex;gap:10px;padding:10px;flex-wrap:wrap}
.card{flex:1;min-width:200px;border:3px solid #222;padding:10px;text-align:center;background:#fff}
.pz{font-size:70px;line-height:1.1;user-select:none}
.order{font:inherit;font-size:1.2rem;border:3px solid #222;background:#ffd34d;padding:12px 20px;margin-top:6px;cursor:pointer;width:100%}
.order:active{transform:scale(.95)}
#want{margin:6px 10px;padding:12px;border:3px dashed #c33;background:#fff3f0;font-size:1.3rem;text-align:center}
.cart{margin:10px;border:3px solid #222;padding:12px;background:#fff;font-size:1.2rem;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.cart button{font:inherit;border:3px solid #222;background:#7ddc7d;padding:12px 20px;cursor:pointer}
#bar{height:14px;background:#ddd;margin:0 10px;border:2px solid #222}#fill{height:100%;background:#e44;width:100%}
#msg{text-align:center;font-size:1.3rem;padding:6px;min-height:40px}
</style></head><body><div class="app">
<h1>🍕 TONY'S PIZZA RUSH</h1>
<div class="info"><span>Score: <span id="sc">0</span></span><span>Time: <span id="tm">45</span>s</span><span>Served: <span id="sv">0</span>/8</span></div>
<div id="want"></div><div id="bar"><div id="fill"></div></div>
<div class="cards" id="cards"></div>
<div id="msg">Match the customer's order! Keys 1, 2, 3 work too.</div>
<div class="cart"><span>YOUR CART: <b id="ci">0 items</b> &nbsp; TOTAL <b id="ct">$0</b></span><button id="ck">CHECKOUT</button></div>
</div>
<script>
const P=[{n:"Margherita",p:10,e:"🍕"},{n:"Pepperoni",p:12,e:"🍖"},{n:"Veggie",p:11,e:"🥦"}];
let cart,score,time,served,want,over,iv,pat;
const $=id=>document.getElementById(id);
$("cards").innerHTML=P.map((x,i)=>`<div class="card"><div class="pz">${x.e}</div><div>${x.n} $${x.p}</div><button class="order" data-i="${i}">ORDER (${i+1})</button></div>`).join("");
function newWant(){const n=1+Math.floor(Math.random()*3);want=[];for(let i=0;i<n;i++)want.push(Math.floor(Math.random()*3));want.sort();pat=10;
$("want").innerHTML="🧑 Customer wants: "+want.map(i=>P[i].e+P[i].n).join(" + ")}
function show(){const t=cart.reduce((a,i)=>a+P[i].p,0);$("ci").textContent=cart.length+" item"+(cart.length==1?"":"s");$("ct").textContent="$"+t;$("sc").textContent=score;$("sv").textContent=served;$("tm").textContent=time;$("fill").style.width=pat*10+"%"}
function add(i){if(over)return;cart.push(i);show()}
function checkout(){if(over)return;const a=[...cart].sort().join(),b=want.join();
if(a==b){const bonus=Math.ceil(pat)*2;score+=cart.reduce((s,i)=>s+P[i].p,0)+bonus;served++;time+=3;$("msg").textContent="🎉 Perfect! +bonus "+bonus;cart=[];if(served>=8)return end(true);newWant()}
else{score=Math.max(0,score-5);time=Math.max(0,time-3);$("msg").textContent="❌ Wrong order! Cart cleared, -5 points.";cart=[]}
show()}
function end(w){over=true;clearInterval(iv);$("msg").innerHTML=(w?"🏆 You win! All served! ":"⏰ Time's up! ")+"Score "+score+" <button class='order' style='width:auto' onclick='start()'>PLAY AGAIN</button>"}
function start(){cart=[];score=0;time=45;served=0;over=false;newWant();show();$("msg").textContent="Match the customer's order, then CHECKOUT!";clearInterval(iv);
iv=setInterval(()=>{time--;pat=Math.max(0,pat-1);if(pat==0){pat=10;newWant();score=Math.max(0,score-3);$("msg").textContent="😠 Customer left! New one arrives."}show();if(time<=0)end(false)},1000)}
document.querySelectorAll(".order[data-i]").forEach(b=>b.onclick=()=>add(+b.dataset.i));
$("ck").onclick=checkout;
addEventListener("keydown",e=>{if("123".includes(e.key))add(+e.key-1);if(e.key=="Enter")checkout()});
start();
</script></body></html>
