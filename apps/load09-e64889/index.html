<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Timer</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;font-family:"Segoe UI",system-ui,sans-serif;color:#1a1a5e}
.app{width:min(92vw,380px);border:3px solid #222;border-radius:12px;padding:20px;background:#fffdf8;text-align:center;box-shadow:6px 6px 0 #dcdcf0}
h1{margin:0 0 14px;font-size:1.8rem;letter-spacing:2px}
.ring{position:relative;width:260px;height:260px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.4rem;font-weight:700}
.btns{display:flex;gap:12px;margin:20px 0 14px}
button{flex:1;padding:16px;font-size:1.2rem;font-weight:700;border:3px solid #222;background:#fff;color:#1a1a5e;border-radius:6px;cursor:pointer}
button:active{transform:scale(.96)}
#start{background:#c9f2d0}
#msg{min-height:1.4em;color:#2a7a3a;font-weight:600}
.s{font-size:1.2rem}
</style>
</head>
<body>
<div class="app">
<h1>STUDY TIMER</h1>
<div class="ring">
<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#e3e3f2" stroke-width="4"/><circle id="p" cx="50" cy="50" r="46" fill="none" stroke="#3b3bb0" stroke-width="4" stroke-linecap="round" stroke-dasharray="289.03" stroke-dashoffset="0"/></svg>
<div class="time" id="t">25:00</div>
</div>
<div class="btns"><button id="start">START</button><button id="reset">RESET</button></div>
<div id="msg"></div>
<div class="s">Sessions done: <span id="n">0</span></div>
</div>
<script>
const TOTAL=1500;let left=TOTAL,timer=null,done=0;
const t=document.getElementById('t'),p=document.getElementById('p'),n=document.getElementById('n'),msg=document.getElementById('msg'),st=document.getElementById('start');
function draw(){
const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');
t.textContent=m+':'+s;document.title=m+':'+s+' Study Timer';
p.style.strokeDashoffset=289.03*(1-left/TOTAL);}
function stop(){clearInterval(timer);timer=null;st.textContent='START';}
st.onclick=()=>{
if(timer){stop();st.textContent='RESUME';return;}
if(left===0)left=TOTAL;
msg.textContent='Focus time! 📚';st.textContent='PAUSE';
timer=setInterval(()=>{
left--;draw();
if(left<=0){stop();done++;n.textContent=done;msg.textContent='🎉 Session complete! Take a break.';left=0;draw();}
},1000);};
document.getElementById('reset').onclick=()=>{stop();left=TOTAL;msg.textContent='';draw();};
draw();
</script>
</body>
</html>
