<title>My To-Do List</title>
<style>
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
input{-webkit-user-select:text;user-select:text}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0}
:root{--d:#1b1b4b;--l:#fffaf0;--a:#ff6b6b;--b:#4ecdc4;--c:#ffd166;--r:18px}
body{height:100dvh;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--d);background:radial-gradient(circle at 15% 10%,#ffe3a8 0,transparent 40%),radial-gradient(circle at 90% 90%,#a8efe8 0,transparent 45%),var(--l);display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.app{width:100%;max-width:460px;height:100%;max-height:760px;background:#fff;border:3px solid var(--d);border-radius:24px;box-shadow:8px 8px 0 var(--d);display:flex;flex-direction:column;padding:18px;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.6rem;letter-spacing:1px}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s,background .2s}
button:active{transform:scale(.93)}
.snd{background:var(--c);border:2px solid var(--d);border-radius:12px;min-width:56px;height:44px;font-size:1.2rem}
form{display:flex;gap:10px}
input{flex:1;min-width:0;height:56px;border:2px solid var(--d);border-radius:var(--r);padding:0 14px;font-size:1.05rem;background:var(--l);color:var(--d)}
input:focus{outline:3px solid var(--b)}
.add{height:56px;padding:0 20px;background:var(--a);color:#fff;font-weight:800;border:2px solid var(--d);border-radius:var(--r);font-size:1rem}
ul{list-style:none;margin:0;padding:0;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}

@keyframes in{from{opacity:0;transform:translateY(10px) scale(.96)}}
li.out{opacity:0;transform:translateX(60px);transition:.25s}
.box{width:44px;height:44px;flex:none;border:2.5px solid var(--d);border-radius:12px;background:#fff;font-size:1.5rem;color:#fff}

.t{flex:1;font-size:1.15rem;word-break:break-word;transition:.2s}
li.done .t{text-decoration:line-through;opacity:.5}
.x{width:44px;height:44px;flex:none;border:0;background:none;font-size:1.6rem;color:var(--a);font-weight:800}

</style></head><body>
<div class="app">
<div class="top"><h1>MY TO-DO LIST</h1><button class="snd" id="s" aria-label="sound">🔇</button></div>
<form id="f"><input id="i" placeholder="add a task..." maxlength="60" autocomplete="off"><button class="add">ADD</button></form>
<ul id="l"></ul>
<div class="foot"><span id="n"></span><button class="clr" id="c">Clear done</button></div>
</div>
<script>
