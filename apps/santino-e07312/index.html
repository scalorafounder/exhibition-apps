<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stickman Sword Warrior</title>
<style>
body{margin:0;background:#1d2230;color:#fff;font-family:system-ui,sans-serif;text-align:center;user-select:none;touch-action:manipulation}
h1{font-size:20px;margin:8px}
#wrap{max-width:640px;margin:auto;padding:0 8px}
canvas{width:100%;background:linear-gradient(#fff,#f4d9ea);border-radius:12px;display:block}
.bar{display:flex;justify-content:space-between;font-weight:bold;margin:6px 2px}
.ctl{display:flex;gap:8px;margin-top:8px}
button{flex:1;padding:18px 4px;font-size:18px;border:0;border-radius:24px;background:#5b7fb0;color:#fff;font-weight:bold}
button:active{background:#86a6d6}
#msg{min-height:22px;color:#ffd36b}
</style></head><body>
<div id="wrap">
<h1>⚔️ Stickman Sword Warrior</h1>
<div class="bar"><span>Score: <span id="sc">0</span></span><span>Best wave: <span id="wv">1</span></span><span>HP: <span id="hp">❤❤❤❤❤</span></span></div>
<canvas id="c" width="640" height="360"></canvas>
<div id="msg">Arrows/A D move, Space/Z attack, W jump</div>
<div class="ctl"><button id="l">◀</button><button id="j">⤒</button><button id="a">⚔️ Slash</button><button id="r">▶</button></div>
<div class="ctl"><button id="rs">🔄 Restart</button></div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),G=300;
let p,es,score,wave,over,keys={},msg=document.getElementById('msg');
function init(){p={x:200,y:G,vy:0,f:1,hp:5,at:0,cd:0,hit:0};es=[];score=0;wave=1;over=false;spawn();msg.textContent="Defeat the enemies!";}
function spawn(){for(let i=0;i<wave+1;i++)es.push({x:Math.random()<.5?-30-i*80:670+i*80,y:G,hp:2,f:1,cd:0,hurt:0,s:.8+Math.random()*.5+wave*.1})}
function attack(){if(p.cd<=0&&!over){p.at=12;p.cd=22}}
function jump(){if(p.y>=G&&!over)p.vy=-12}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==' '||e.key=='z')attack();if(e.key=='ArrowUp'||e.key=='w')jump();if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function hold(id,k){const b=document.getElementById(id);b.onpointerdown=e=>{keys[k]=1};b.onpointerup=b.onpointerleave=()=>keys[k]=0}
hold('l','arrowleft');hold('r','arrowright');
document.getElementById('a').onpointerdown=attack;
document.getElementById('j').onpointerdown=jump;
document.getElementById('rs').onclick=init;
function man(m,col,sw){x.strokeStyle=col;x.fillStyle=col;x.lineWidth=7;x.lineCap='round';
const ly=m.y,f=m.f,w=Math.sin(Date.now()/100)*(m.moving?8:0);
x.beginPath();x.arc(m.x,ly-62,10,0,7);x.fill();
x.beginPath();x.moveTo(m.x,ly-50);x.lineTo(m.x,ly-22);
x.moveTo(m.x,ly-22);x.lineTo(m.x-10+w,ly);x.moveTo(m.x,ly-22);x.lineTo(m.x+10-w,ly);
x.moveTo(m.x,ly-44);x.lineTo(m.x+f*16,ly-34);x.stroke();
if(sw){const a=m.at>0?-0.2+(12-m.at)*.12:-1;x.lineWidth=3;x.beginPath();x.moveTo(m.x+f*16,ly-34);
x.lineTo(m.x+f*(16+Math.cos(a)*45),ly-34+Math.sin(a)*45+ (m.at>0?20:0));x.stroke()}}
function step(){
if(!over){
p.moving=false;
if(keys.arrowleft||keys.a){p.x-=4;p.f=-1;p.moving=true}
if(keys.arrowright||keys.d){p.x+=4;p.f=1;p.moving=true}
p.x=Math.max(15,Math.min(625,p.x));
p.vy+=.7;p.y+=p.vy;if(p.y>G){p.y=G;p.vy=0}
if(p.at>0){p.at--;if(p.at==6)es.forEach(e=>{const d=(e.x-p.x)*p.f;if(d>-10&&d<70&&Math.abs(e.y-p.y)<50){e.hp--;e.hurt=8;e.x+=p.f*30;if(e.hp<=0){e.dead=1;score+=10}}})}
p.cd--;if(p.hit>0)p.hit--;
es=es.filter(e=>!e.dead);
es.forEach(e=>{e.moving=true;e.f=p.x>e.x?1:-1;if(Math.abs(p.x-e.x)>38)e.x+=e.f*e.s;else if(e.cd--<=0&&p.hit<=0&&p.y>G-30){p.hp--;p.hit=40;e.cd=50;p.x+=e.f*20}if(e.hurt>0)e.hurt--});
if(!es.length){wave++;score+=20;document.getElementById('wv').textContent=wave;spawn();msg.textContent="Wave "+wave+"!"}
if(p.hp<=0){over=true;msg.textContent="💀 Defeated! Score "+score+". Press Restart."}
}
document.getElementById('sc').textContent=score;
document.getElementById('hp').textContent="❤".repeat(Math.max(0,p.hp));
x.clearRect(0,0,640,360);x.fillStyle='#ddd';x.fillRect(0,G+2,640,60);
man(p,p.hit%6>2?'#e33':'#1c2a2e',true);
es.forEach(e=>man(e,e.hurt?'#e33':'#7a2a6a',false));
requestAnimationFrame(step)}
init();step();
</script></body></html>
