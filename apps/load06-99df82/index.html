<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tony's Pizza Rush</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS",cursive,sans-serif;background:#faf6ee;color:#1a1a5e;display:flex;justify-content:center}
#app{width:100%;max-width:820px;border:4px solid #222;margin:10px;background:#fffdf7;display:flex;flex-direction:column}
header{border-bottom:4px solid #222;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
h1{margin:0;font-size:2rem}
#stats{font-size:1.1rem;font-weight:bold}
#orderbar{padding:8px 16px;background:#fff3cf;border-bottom:3px dashed #222;font-size:1.1rem;min-height:48px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#timebar{height:10px;background:#4caf50;width:100%;transition:width .1s linear}
.cards{display:flex;gap:12px;padding:14px;flex-wrap:wrap}
.card{flex:1;min-width:150px;border:3px solid #222;padding:10px;text-align:center;background:#fff}
.pz{font-size:4.5rem;line-height:1.1;user-select:none}
.card p{margin:6px 0;font-size:1.1rem}
button{font:inherit;font-weight:bold;color:#1a1a5e;background:#ffd34d;border:3px solid #222;padding:12px 18px;min-height:48px;cursor:pointer;border-radius:6px}
button:active{transform:scale(.95)}
.card button{width:100%}
#cart{margin:0 14px 14px;border:3px solid #222;padding:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:1.2rem}
#msg{text-align:center;padding:0 14px 12px;min-height:30px;font-weight:bold}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.2)}}
</style>
</head>
<body>
<div id="app">
<header><h1>🍕 TONY'S PIZZA</h1><div id="stats">Score: <span id="score">0</span> · Time: <span id="time">45</span>s</div></header>
<div id="timebar"></div>
<div id="orderbar"></div>
<div class="cards" id="cards"></div>
<div id="msg">Tap ORDER (or keys 1 · 2 · 3) to match the customer's order!</div>
<div id="cart"><span>YOUR CART: <b id="cnt">0</b> items &nbsp; TOTAL <b id="tot">$0</b></span><button id="co">CHECKOUT</button></div>
</div>
<script>
const P=[{n:"Margherita",p:10,e:"🍕"},{n:"Pepperoni",p:12,e:"🍖"},{n:"Veggie",p:11,e:"🥦"}];
let cart=[0,0,0],score=0,time=45,want=[],timer=null,over=false,started=false;
const $=id=>document.getElementById(id);
$("cards").innerHTML=P.map((x,i)=>`<div class="card"><div class="pz" id="pz${i}">${x.e}</div><p>${x.n} $${x.p}</p><button onclick="order(${i})">ORDER (${i+1})</button></div>`).join("");
function newOrder(){
  want=[0,0,0];
  const k=2+Math.floor(Math.random()*3);
  for(let i=0;i<k;i++)want[Math.floor(Math.random()*3)]++;
  showWant();
}
function showWant(){
  $("orderbar").innerHTML="🧑‍🍳 Customer wants: "+want.map((c,i)=>c?`<b>${c}× ${P[i].n}</b>`:"").filter(x=>x).join(", ");
}
function start(){
  if(started)return;started=true;
  timer=setInterval(()=>{
    time-=0.1;
    if(time<=0){time=0;end()}
    $("time").textContent=Math.ceil(time);
    $("timebar").style.width=(time/45*100)+"%";
  },100);
}
function upd(){
  const c=cart.reduce((a,b)=>a+b,0);
  $("cnt").textContent=c;
  $("tot").textContent="$"+cart.reduce((a,b,i)=>a+b*P[i].p,0);
  $("score").textContent=score;
}
function order(i){
  if(over)return;
  start();
  cart[i]++;
  const el=$("pz"+i);el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");
  upd();
}
function checkout(){
  if(over)return;
  start();
  const c=cart.reduce((a,b)=>a+b,0);
  if(!c){$("msg").textContent="Your cart is empty!";return}
  if(cart.every((v,i)=>v===want[i])){
    const bonus=want.reduce((a,b,i)=>a+b*P[i].p,0);
    score+=bonus;time=Math.min(45,time+5);
    $("msg").textContent="✅ Perfect order! +$"+bonus+" and +5 seconds!";
    cart=[0,0,0];newOrder();
  }else{
    score=Math.max(0,score-5);time=Math.max(0,time-3);
    $("msg").textContent="❌ Wrong order! -5 points, -3 seconds. Cart cleared.";
    cart=[0,0,0];
  }
  upd();
}
function end(){
  over=true;clearInterval(timer);
  $("orderbar").innerHTML=score>=60?"🏆 You win! Tony is proud!":"⏰ Time's up! Need $60 to win.";
  $("msg").innerHTML=`Final score: ${score} <button onclick="restart()">RESTART</button>`;
}
function restart(){
  clearInterval(timer);
  cart=[0,0,0];score=0;time=45;over=false;started=false;
  $("time").textContent=45;$("timebar").style.width="100%";
  $("msg").textContent="Tap ORDER (or keys 1 · 2 · 3) to match the customer's order!";
  newOrder();upd();
}
$("co").onclick=checkout;
document.addEventListener("keydown",e=>{
  if(e.key>="1"&&e.key<="3")order(+e.key-1);
  else if(e.key==="Enter")checkout();
  else if(e.key==="Backspace"){cart=[0,0,0];upd()}
});
newOrder();upd();
</script>
</body>
</html>
