<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;background-image:repeating-linear-gradient(#faf7f0 0 31px,#dfe3f3 31px 32px);font-family:"Segoe Print","Comic Sans MS",cursive,sans-serif;color:#1a1a5e;padding:12px}
.card{width:100%;max-width:440px;min-height:560px;background:#fffdf8;border:3px solid #222;border-radius:6px;padding:20px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #0002}
h1{text-align:center;font-size:1.6rem;margin:6px 0 18px;letter-spacing:1px}
form{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px;border:3px solid #222;border-radius:4px;background:#fff;color:#1a1a5e}
button.add{font:inherit;font-size:1.1rem;padding:0 16px;border:3px solid #222;background:#ffe27a;color:#1a1a5e;border-radius:4px;cursor:pointer;min-height:48px}
button.add:active{transform:scale(.95)}
ul{list-style:none;padding:0;margin:18px 0;flex:1}
li{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:1.25rem}
li .box{width:40px;height:40px;flex:none;border:3px solid #222;border-radius:4px;background:#fff;cursor:pointer;font-size:1.6rem;line-height:1;color:#2a9d4a;display:flex;align-items:center;justify-content:center}
li .t{flex:1;word-break:break-word;cursor:pointer}
li.done .t{text-decoration:line-through;opacity:.5}
li .x{width:44px;height:44px;flex:none;border:none;background:none;font-size:1.8rem;cursor:pointer;color:#222}
li .x:hover{color:#d33}
.empty{text-align:center;opacity:.6;padding:30px 0}
.foot{font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.clear{font:inherit;font-size:.9rem;background:none;border:2px solid #1a1a5e;border-radius:4px;color:#1a1a5e;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>MY TO-DO LIST</h1>
<form id="f"><input id="in" type="text" placeholder="add a task..." maxlength="60" autocomplete="off"><button class="add" type="submit">ADD</button></form>
<ul id="list"></ul>
<div class="foot"><span id="left"></span><button class="clear" id="clr">clear done</button></div>
</div>
<script>
let tasks=[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
const list=document.getElementById("list"),left=document.getElementById("left"),inp=document.getElementById("in");
function render(){
list.innerHTML="";
if(!tasks.length){list.innerHTML='<div class="empty">All done! 🎉 Add a new task.</div>'}
tasks.forEach((k,i)=>{
const li=document.createElement("li");if(k.d)li.className="done";
const b=document.createElement("div");b.className="box";b.textContent=k.d?"✔":"";
const s=document.createElement("span");s.className="t";s.textContent=k.t;
const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","delete");
const tog=()=>{k.d=!k.d;render()};
b.onclick=tog;s.onclick=tog;
x.onclick=()=>{tasks.splice(i,1);render()};
li.append(b,s,x);list.append(li);
});
const n=tasks.filter(k=>!k.d).length;
left.textContent=n+(n==1?" task left":" tasks left");
}
document.getElementById("f").onsubmit=e=>{
e.preventDefault();
const v=inp.value.trim();
if(v){tasks.push({t:v,d:false});inp.value="";render()}
inp.focus();
};
document.getElementById("clr").onclick=()=>{tasks=tasks.filter(k=>!k.d);render()};
render();
</script>
</body>
</html>
