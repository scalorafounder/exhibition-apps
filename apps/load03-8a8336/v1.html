<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tic Tac Toe</title>
<style>
body{margin:0;min-height:100vh;background:#faf7f0;background-image:repeating-linear-gradient(#faf7f0 0 46px,#dde1f3 46px 48px);font-family:"Comic Sans MS","Segoe Print",cursive;color:#1a1a5e;display:flex;flex-direction:column;align-items:center;padding:16px;box-sizing:border-box}
h1{font-size:clamp(28px,8vw,52px);margin:10px 0 20px;letter-spacing:2px}
#board{display:grid;grid-template-columns:repeat(3,1fr);width:min(86vw,420px);aspect-ratio:1}
.c{background:none;border:none;font:inherit;font-size:min(20vw,100px);color:#1a1a5e;cursor:pointer;border-right:5px solid #222;border-bottom:5px solid #222;padding:0}
.c:nth-child(3n){border-right:none}
.c:nth-child(n+7){border-bottom:none}
.c:hover:not(:disabled){background:#e9ecfa}
.c.w{background:#ffe9a8}
.c:disabled{cursor:default}
#bar{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;justify-content:center}
#status,#r{border:3px solid #222;background:#faf7f0;font:inherit;font-size:20px;color:#1a1a5e;padding:14px 18px;min-height:52px}
#r{cursor:pointer}
#r:hover{background:#dfe4fa}
</style>
</head>
<body>
<h1>TIC TAC TOE</h1>
<div id="board"></div>
<div id="bar"><div id="status"></div><button id="r">RESTART</button></div>
<script>
const b=document.getElementById('board'),st=document.getElementById('status');
let g,t,over,cells=[];
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
for(let i=0;i<9;i++){const c=document.createElement('button');c.className='c';c.onclick=()=>play(i);b.appendChild(c);cells.push(c)}
function start(){g=Array(9).fill('');t='X';over=false;cells.forEach(c=>{c.textContent='';c.disabled=false;c.classList.remove('w')});st.textContent='Your turn: X'}
function play(i){
if(over||g[i])return;
g[i]=t;cells[i].textContent=t;cells[i].disabled=true;
const w=L.find(l=>l.every(k=>g[k]===t));
if(w){over=true;w.forEach(k=>cells[k].classList.add('w'));st.textContent='🎉 '+t+' wins!';cells.forEach(c=>c.disabled=true);return}
if(g.every(x=>x)){over=true;st.textContent="It's a tie! 🤝";return}
t=t==='X'?'O':'X';st.textContent='Your turn: '+t}
document.getElementById('r').onclick=start;
start();
</script>
</body>
</html>
