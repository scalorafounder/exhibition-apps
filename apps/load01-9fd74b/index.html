<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tony's Pizza</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#2b2b3a;min-height:100vh;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:420px;height:100vh;max-height:820px;background:#fff8ee;display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:0}
@media(min-width:500px){#app{border-radius:28px;box-shadow:0 10px 40px #0008}}
header{background:#c62828;color:#fff;padding:18px;font-size:24px;font-weight:800;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:2px solid #222;border-radius:16px;padding:14px;display:flex;align-items:center;gap:14px}
.pz{width:80px;height:80px;border-radius:50%;border:3px solid #222;display:flex;align-items:center;justify-content:center;font-size:44px;background:#ffe0a3;flex:none}
.info{flex:1}.info b{font-size:19px;display:block}.info span{color:#555}
button{font:inherit;cursor:pointer;border:2px solid #222;border-radius:12px;background:#ffb300;font-weight:700;padding:12px 16px;min-height:48px;transition:transform .1s}
button:active{transform:scale(.93)}
#cart{background:#fff;border-top:2px solid #222;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#cart div{font-weight:700}
#co{background:#2e7d32;color:#fff}
.sheet{position:absolute;inset:0;background:#fff8eecc;backdrop-filter:blur(4px);display:flex;align-items:flex-end;transform:translateY(100%);transition:transform .35s}
.sheet.on{transform:none}
.panel{background:#fff;width:100%;border-radius:24px 24px 0 0;border:2px solid #222;padding:20px;display:flex;flex-direction:column;gap:10px;max-height:80%;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #aaa}
.row button{padding:4px 12px;min-height:36px;margin-left:6px}
</style>
</head>
<body>
<div id="app">
<header>🍕 TONY'S PIZZA</header>
<main id="menu"></main>
<div id="cart"><div id="sum">YOUR CART: 0 items<br>TOTAL $0</div><button id="co">CHECKOUT</button></div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
</div>
<script>
const pizzas=[{n:"Margherita",p:10,e:"🍅"},{n:"Pepperoni",p:12,e:"🍕"},{n:"Veggie",p:11,e:"🥦"}];
const cart=[0,0,0];
const $=id=>document.getElementById(id);
$("menu").innerHTML=pizzas.map((z,i)=>`<div class="card"><div class="pz">${z.e}</div><div class="info"><b>${z.n}</b><span>$${z.p}</span></div><button onclick="add(${i})">ORDER</button></div>`).join("");
function totals(){let c=0,t=0;cart.forEach((q,i)=>{c+=q;t+=q*pizzas[i].p});return[c,t]}
function upd(){const[c,t]=totals();$("sum").innerHTML=`YOUR CART: ${c} item${c==1?"":"s"}<br>TOTAL $${t}`}
function add(i){cart[i]++;upd()}
function chg(i,d){cart[i]=Math.max(0,cart[i]+d);upd();show()}
function show(){
const[c,t]=totals();
let h="<h2>Your Order</h2>";
if(!c)h+="<p>Your cart is empty. Add a pizza! 🍕</p>";
cart.forEach((q,i)=>{if(q)h+=`<div class="row"><span>${pizzas[i].e} ${pizzas[i].n} ×${q}</span><span>$${q*pizzas[i].p}<button onclick="chg(${i},-1)">−</button><button onclick="chg(${i},1)">+</button></span></div>`});
h+=`<div class="row"><b>Total</b><b>$${t}</b></div>`;
if(c)h+=`<button id="pl" style="background:#2e7d32;color:#fff" onclick="place()">Place Order</button>`;
h+=`<button onclick="closeS()">Back to menu</button>`;
$("panel").innerHTML=h;$("sheet").classList.add("on")}
function closeS(){$("sheet").classList.remove("on")}
function place(){cart.fill(0);upd();$("panel").innerHTML=`<h2>🎉 Thank you!</h2><p>Your pizza is in the oven. Tony says grazie!</p><button onclick="closeS()">OK</button>`}
$("co").onclick=show;
</script>
</body>
</html>
