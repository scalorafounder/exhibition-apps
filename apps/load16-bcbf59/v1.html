<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony's Pizza</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS","Segoe Print",cursive,sans-serif;background:#faf7f0;color:#1a1f5c}
.wrap{max-width:900px;margin:0 auto;min-height:100vh;border:3px solid #222;display:flex;flex-direction:column;background:#fffdf8}
header{border-bottom:3px solid #222;padding:16px 20px}
h1{margin:0;font-size:2.2rem;letter-spacing:2px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:20px;flex:1}
.card{display:flex;flex-direction:column;align-items:center;gap:12px}
.pic{width:100%;border:3px solid #222;padding:16px 10px 10px;text-align:center;border-radius:4px}
.circle{width:130px;height:130px;margin:0 auto 12px;border:3px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4rem;background:#fff3d6}
.name{text-align:left;font-size:1.15rem}
button{font:inherit;color:#1a1f5c;background:#fff;border:3px solid #222;padding:12px 22px;min-height:48px;cursor:pointer;font-size:1.1rem;border-radius:3px}
button:hover{background:#ffe9a8}
button:active{transform:scale(.96)}
.cart{margin:20px;border:3px solid #222;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.info{font-size:1.3rem}
#list{width:100%;font-size:1rem;color:#444}
#msg{width:100%;font-weight:bold;color:#2a7a2a;min-height:1.2em}
.clear{border-width:2px;font-size:.9rem;padding:8px 14px;min-height:40px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>TONY'S PIZZA</h1></header>
<main id="menu"></main>
<section class="cart">
<div class="info">YOUR CART: <span id="count">0 items</span> &nbsp; TOTAL <span id="total">$0</span></div>
<div id="list">Nothing yet — pick a pizza! 🍕</div>
<div id="msg"></div>
<div><button class="clear" id="clear">Empty cart</button> <button id="checkout">CHECKOUT</button></div>
</section>
</div>
<script>
const pizzas=[{n:"Margherita",p:10,e:"🍕"},{n:"Pepperoni",p:12,e:"🌶️"},{n:"Veggie",p:11,e:"🥬"}];
const cart=[0,0,0];
const menu=document.getElementById("menu");
pizzas.forEach((z,i)=>{
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<div class="pic"><div class="circle">${z.e}</div><div class="name">${z.n} $${z.p}</div></div><button>ORDER</button>`;
  d.querySelector("button").onclick=()=>{cart[i]++;document.getElementById("msg").textContent="";render()};
  menu.appendChild(d);
});
function render(){
  let c=0,t=0,parts=[];
  cart.forEach((q,i)=>{c+=q;t+=q*pizzas[i].p;if(q)parts.push(q+" × "+pizzas[i].n)});
  document.getElementById("count").textContent=c+(c===1?" item":" items");
  document.getElementById("total").textContent="$"+t;
  document.getElementById("list").textContent=parts.length?parts.join(", "):"Nothing yet — pick a pizza! 🍕";
}
document.getElementById("clear").onclick=()=>{cart.fill(0);document.getElementById("msg").textContent="";render()};
document.getElementById("checkout").onclick=()=>{
  const t=cart.reduce((s,q,i)=>s+q*pizzas[i].p,0);
  const m=document.getElementById("msg");
  if(!t){m.style.color="#b33";m.textContent="Your cart is empty. Add a pizza first!";return}
  m.style.color="#2a7a2a";m.textContent="Thanks! Your order of $"+t+" is being baked. 🎉";
  cart.fill(0);render();
};
render();
</script>
</body>
</html>
