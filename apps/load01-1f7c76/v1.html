<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tony's Pizza</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#e9e4da;display:flex;justify-content:center;align-items:center;min-height:100vh}
#phone{width:100%;max-width:420px;height:100vh;max-height:800px;background:#fffaf0;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 8px 30px #0004}
@media(min-width:500px){#phone{border-radius:28px;border:8px solid #222}}
header{background:#c0392b;color:#fff;padding:16px;font-size:22px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.screen{flex:1;overflow:auto;padding:14px;display:none;animation:in .3s}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px #0002}
.pz{font-size:56px;width:76px;text-align:center}
.info{flex:1}.info b{font-size:18px}.info small{display:block;color:#777}
button{border:0;border-radius:12px;background:#27ae60;color:#fff;font-size:16px;font-weight:700;padding:14px 16px;min-height:48px;cursor:pointer}
button:active{transform:scale(.95)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.sm{padding:6px 12px;min-height:36px;background:#c0392b;margin-left:6px}
#cart{background:#fff;border-top:2px solid #ddd;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#cart div{font-weight:700}
nav{display:flex;background:#222}
nav button{flex:1;background:none;border-radius:0;font-size:15px;color:#aaa;padding:14px}
nav button.on{color:#fff;border-top:3px solid #f39c12}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}
</style>
</head>
<body>
<div id="phone">
<header>🍕 Tony's Pizza <span id="badge">🛒 0</span></header>
<div id="toast"></div>
<div class="screen on" id="menu"></div>
<div class="screen" id="cartScreen"></div>
<div id="cart"><div id="sum">YOUR CART: 0 items<br>TOTAL $0</div><button onclick="checkout()">CHECKOUT</button></div>
<nav><button class="on" id="t1" onclick="show('menu')">🍕 Menu</button><button id="t2" onclick="show('cartScreen')">🛒 Cart</button></nav>
</div>
<script>
const pizzas=[{n:"Margherita",p:10,e:"🍕",d:"Tomato, mozzarella, basil"},{n:"Pepperoni",p:12,e:"🌶️",d:"Spicy pepperoni & cheese"},{n:"Veggie",p:11,e:"🥬",d:"Peppers, olives, mushrooms"}];
let cart=[0,0,0];
function show(id){
 for(const s of document.querySelectorAll('.screen'))s.classList.toggle('on',s.id==id);
 t1.className=id=='menu'?'on':'';t2.className=id=='menu'?'':'on';
}
function toast(m){toast_.textContent=m;toast_.style.opacity=1;setTimeout(()=>toast_.style.opacity=0,1200)}
const toast_=document.getElementById('toast');
function add(i,d){cart[i]=Math.max(0,cart[i]+d);if(d>0)toast(pizzas[i].n+" added!");render()}
function render(){
 menu.innerHTML=pizzas.map((p,i)=>`<div class="card"><div class="pz">${p.e}</div><div class="info"><b>${p.n} $${p.p}</b><small>${p.d}</small></div><button onclick="add(${i},1)">ORDER</button></div>`).join('');
 let c=0,t=0;cart.forEach((q,i)=>{c+=q;t+=q*pizzas[i].p});
 sum.innerHTML=`YOUR CART: ${c} item${c==1?'':'s'}<br>TOTAL $${t}`;
 badge.textContent="🛒 "+c;
 cartScreen.innerHTML=c?pizzas.map((p,i)=>cart[i]?`<div class="row"><span>${p.e} ${p.n} × ${cart[i]}</span><span>$${cart[i]*p.p}<button class="sm" onclick="add(${i},-1)">−</button><button class="sm" style="background:#27ae60" onclick="add(${i},1)">+</button></span></div>`:'').join('')+`<h3 style="margin-top:14px">Total: $${t}</h3>`:'<p style="text-align:center;margin-top:60px;color:#777">Your cart is empty 🍕<br>Go order something yummy!</p>';
}
function checkout(){
 const c=cart.reduce((a,b)=>a+b,0);
 if(!c){toast("Add a pizza first!");show('menu');return}
 cart=[0,0,0];render();show('cartScreen');
 cartScreen.innerHTML='<p style="text-align:center;margin-top:60px;font-size:22px">🎉 Thank you!<br>Your pizza is in the oven! 🔥</p>';
}
render();
</script>
</body>
</html>
