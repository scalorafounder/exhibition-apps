<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Calculator</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;font-family:"Comic Sans MS","Segoe Print",cursive,sans-serif;color:#1b1b5e;padding:16px}
  .card{width:100%;max-width:420px;background:#fff;border:3px solid #222;border-radius:14px;padding:22px;box-shadow:6px 6px 0 #c9d0f0}
  h1{margin:0 0 18px;font-size:1.7rem;letter-spacing:1px}
  .box{border:3px solid #222;border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:1.3rem;display:flex;align-items:center;gap:8px}
  input{flex:1;min-width:0;border:none;border-bottom:3px solid #1b1b5e;font:inherit;font-size:1.4rem;color:inherit;outline:none;background:transparent}
  label{font-size:1.2rem}
  .tips{display:flex;gap:10px;margin:6px 0 18px}
  button{font:inherit;color:inherit;cursor:pointer}
  .tip{flex:1;min-height:56px;font-size:1.3rem;border:3px solid #222;border-radius:8px;background:#fff}
  .tip.on{background:#1b1b5e;color:#fff}
  .people{justify-content:space-between}
  .rnd{width:52px;height:52px;border-radius:50%;border:3px solid #222;background:#eef;font-size:1.8rem;line-height:1}
  .n{font-size:1.8rem;min-width:40px;text-align:center}
  .res{border:3px solid #222;border-radius:8px;padding:14px;font-size:1.3rem;line-height:2}
  .res b{font-size:1.5rem}
</style>
</head>
<body>
<div class="card">
  <h1>TIP CALCULATOR</h1>
  <div class="box"><label for="bill">Bill: $</label><input id="bill" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>
  <label>Tip:</label>
  <div class="tips">
    <button class="tip" data-p="10">10%</button>
    <button class="tip on" data-p="15">15%</button>
    <button class="tip" data-p="20">20%</button>
  </div>
  <div class="box people">
    <span>People:</span>
    <span style="display:flex;align-items:center;gap:10px">
      <button class="rnd" id="minus" aria-label="fewer">−</button>
      <span class="n" id="n">2</span>
      <button class="rnd" id="plus" aria-label="more">+</button>
    </span>
  </div>
  <div class="res">
    TIP: <b id="tip">$0.00</b><br>
    EACH PAYS: <b id="each">$0.00</b>
  </div>
</div>
<script>
  let pct=15,people=2;
  const bill=document.getElementById('bill');
  function calc(){
    const b=Math.max(0,parseFloat(bill.value)||0);
    const t=b*pct/100;
    document.getElementById('tip').textContent='$'+t.toFixed(2);
    document.getElementById('each').textContent='$'+((b+t)/people).toFixed(2);
    document.getElementById('n').textContent=people;
  }
  document.querySelectorAll('.tip').forEach(btn=>btn.onclick=()=>{
    document.querySelectorAll('.tip').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on');pct=+btn.dataset.p;calc();
  });
  document.getElementById('minus').onclick=()=>{if(people>1)people--;calc()};
  document.getElementById('plus').onclick=()=>{if(people<50)people++;calc()};
  bill.addEventListener('input',calc);
  calc();
</script>
</body>
</html>
