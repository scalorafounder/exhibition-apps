<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;font-family:"Comic Sans MS","Segoe Print",cursive,sans-serif;color:#1a1a5e}
.card{width:100%;max-width:420px;margin:16px;padding:20px;background:#fff;border:3px solid #222;border-radius:14px;box-shadow:6px 6px 0 #c9d0ee}
h1{margin:0 0 16px;font-size:1.8rem;letter-spacing:1px}
.box{border:3px solid #222;border-radius:8px;padding:12px;margin-bottom:16px}
label{font-size:1.2rem;display:flex;align-items:center;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:1.3rem;border:none;border-bottom:3px solid #1a1a5e;outline:none;padding:6px;color:inherit;background:transparent}
.tl{font-size:1.2rem;margin-bottom:6px}
.tips{display:flex;gap:10px;margin-bottom:16px}
.tips button{flex:1;padding:16px 0;font:inherit;font-size:1.3rem;border:3px solid #222;border-radius:8px;background:#fff;color:inherit;cursor:pointer}
.tips button.on{background:#1a1a5e;color:#fff}
.ppl{display:flex;align-items:center;justify-content:space-between;font-size:1.2rem}
.ppl div{display:flex;align-items:center;gap:14px}
.ppl button{width:48px;height:48px;font-size:1.6rem;border:3px solid #222;border-radius:50%;background:#eef;cursor:pointer;font-family:inherit;color:inherit}
#n{font-size:1.6rem;min-width:30px;text-align:center}
.res{font-size:1.3rem;line-height:2;margin:0}
.res b{font-size:1.5rem}
</style>
</head>
<body>
<div class="card">
<h1>TIP CALCULATOR</h1>
<div class="box"><label>Bill: $ <input id="bill" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label></div>
<div class="tl">Tip:</div>
<div class="tips">
<button data-p="10">10%</button><button data-p="15" class="on">15%</button><button data-p="20">20%</button>
</div>
<div class="box ppl"><span>People:</span><div><button id="minus" aria-label="fewer">−</button><span id="n">2</span><button id="plus" aria-label="more">+</button></div></div>
<div class="box res">
TIP: <b id="tip">$0.00</b><br>
EACH PAYS: <b id="each">$0.00</b>
</div>
</div>
<script>
let pct=15,people=2;
const $=id=>document.getElementById(id);
function calc(){
const bill=Math.max(0,parseFloat($("bill").value)||0);
const tip=bill*pct/100;
$("tip").textContent="$"+tip.toFixed(2);
$("each").textContent="$"+((bill+tip)/people).toFixed(2);
$("n").textContent=people;
}
document.querySelectorAll(".tips button").forEach(b=>b.onclick=()=>{
document.querySelectorAll(".tips button").forEach(x=>x.classList.remove("on"));
b.classList.add("on");pct=+b.dataset.p;calc();
});
$("minus").onclick=()=>{if(people>1)people--;calc()};
$("plus").onclick=()=>{if(people<50)people++;calc()};
$("bill").oninput=calc;
calc();
</script>
</body>
</html>
