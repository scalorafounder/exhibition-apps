<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do List</title>
<style>
body{margin:0;min-height:100vh;background:#faf7f0;background-image:repeating-linear-gradient(transparent 0 38px,#dde3f2 38px 40px);font-family:"Segoe Print","Comic Sans MS",cursive;color:#1a1a5e;display:flex;justify-content:center;align-items:flex-start;padding:20px;box-sizing:border-box}
.card{width:100%;max-width:480px;min-height:560px;background:#faf7f0;border:3px solid #222;border-radius:6px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;box-shadow:4px 4px 0 #2224}
h1{text-align:center;font-size:1.7rem;margin:6px 0 18px}
.add{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px;border:3px solid #222;background:#fff;color:#1a1a5e;border-radius:4px}
button.addb{font:inherit;font-size:1.1rem;padding:0 16px;border:3px solid #222;background:#ffe9a8;color:#1a1a5e;cursor:pointer;border-radius:4px;min-height:48px}
ul{list-style:none;padding:0;margin:20px 0;flex:1}
li{display:flex;align-items:center;gap:14px;padding:8px 0;font-size:1.3rem}
li .box{width:36px;height:36px;border:3px solid #222;background:#fff;border-radius:4px;cursor:pointer;flex:none;font-size:1.4rem;line-height:30px;text-align:center;padding:0;color:#2a9d4a}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;opacity:.5}
.x{background:none;border:none;font-size:2rem;cursor:pointer;color:#222;width:48px;height:48px}
.empty{opacity:.6;text-align:center}
#left{font-size:1.2rem}
</style>
</head>
<body>
<div class="card">
<h1>MY TO-DO LIST</h1>
<form class="add" id="f">
<input type="text" id="t" placeholder="add a task..." maxlength="60" autocomplete="off">
<button class="addb" type="submit">ADD</button>
</form>
<ul id="list"></ul>
<div id="left"></div>
</div>
<script>
let tasks=[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
const list=document.getElementById("list"),left=document.getElementById("left"),inp=document.getElementById("t");
function render(){
list.innerHTML="";
if(!tasks.length){list.innerHTML='<li class="empty">Nothing to do! 🎉</li>'}
tasks.forEach((k,i)=>{
const li=document.createElement("li");if(k.d)li.className="done";
const b=document.createElement("button");b.className="box";b.textContent=k.d?"✓":"";b.setAttribute("aria-label","toggle");
b.onclick=()=>{k.d=!k.d;render()};
const s=document.createElement("span");s.textContent=k.t;
const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","delete");
x.onclick=()=>{tasks.splice(i,1);render()};
li.append(b,s,x);list.append(li);
});
const n=tasks.filter(k=>!k.d).length;
left.textContent=n+(n==1?" task left":" tasks left");
}
document.getElementById("f").onsubmit=e=>{
e.preventDefault();
const v=inp.value.trim();
if(v){tasks.push({t:v,d:false});inp.value="";render()}
inp.focus();
};
render();
</script>
</body>
</html>
