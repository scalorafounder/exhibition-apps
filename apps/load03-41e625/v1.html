<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    background:#faf7f0 repeating-linear-gradient(#faf7f0 0 31px,#dde2f3 31px 32px);
    font-family:"Comic Sans MS","Segoe Print",cursive;color:#1a1a5e}
  h1{margin:0;font-size:clamp(28px,8vw,52px);letter-spacing:2px}
  #board{display:grid;grid-template-columns:repeat(3,1fr);width:min(80vw,380px);aspect-ratio:1}
  .cell{background:none;border:0;font:inherit;font-size:clamp(48px,16vw,96px);color:#1a1a5e;cursor:pointer;
    border-right:5px solid #222;border-bottom:5px solid #222;padding:0}
  .cell:nth-child(3n){border-right:0}
  .cell:nth-child(n+7){border-bottom:0}
  .cell:hover:not(:disabled){background:#e9ecfb}
  .cell.win{background:#c8f2c8}
  .cell:disabled{cursor:default}
  #bar{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  #status,button#re{border:3px solid #222;background:#fff8;padding:12px 18px;font:inherit;font-size:20px;color:#1a1a5e;min-height:52px;box-sizing:border-box}
  button#re{cursor:pointer;background:#fff}
  button#re:active{transform:scale(.96)}
</style>
</head>
<body>
<h1>TIC TAC TOE</h1>
<div id="board"></div>
<div id="bar"><div id="status"></div><button id="re">RESTART</button></div>
<script>
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let b,turn,over;
const board=document.getElementById('board'),st=document.getElementById('status');
const cells=[];
for(let i=0;i<9;i++){const c=document.createElement('button');c.className='cell';c.setAttribute('aria-label','square '+(i+1));
  c.onclick=()=>play(i);board.appendChild(c);cells.push(c);}
function reset(){b=Array(9).fill('');turn='X';over=false;
  cells.forEach(c=>{c.textContent='';c.disabled=false;c.classList.remove('win')});
  st.textContent='Your turn: X';}
function play(i){
  if(over||b[i])return;
  b[i]=turn;cells[i].textContent=turn;cells[i].disabled=true;
  const w=L.find(l=>l.every(k=>b[k]===turn));
  if(w){over=true;w.forEach(k=>cells[k].classList.add('win'));st.textContent='🎉 '+turn+' wins!';cells.forEach(c=>c.disabled=true);return;}
  if(b.every(x=>x)){over=true;st.textContent="🤝 It's a tie!";return;}
  turn=turn==='X'?'O':'X';
  st.textContent='Your turn: '+turn;
}
document.getElementById('re').onclick=reset;
reset();
</script>
</body>
</html>
