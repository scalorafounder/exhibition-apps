<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List Game</title>
<style>
body{margin:0;min-height:100vh;background:#bfe3ff;font-family:"Comic Sans MS",cursive,sans-serif;color:#1a1a5e;display:flex;justify-content:center;align-items:center}
.app{width:min(420px,94vw);background:#fff;border:3px solid #222;border-radius:6px;padding:18px;box-shadow:6px 6px 0 #1a1a5e55}
h1{margin:0 0 12px;text-align:center;font-size:28px}
.row{display:flex;gap:8px}
input{flex:1;font:inherit;font-size:18px;padding:10px;border:3px solid #222;border-radius:4px;min-width:0}
button{font:inherit;cursor:pointer}
.add{border:3px solid #222;background:#3cb94a;color:#fff;font-weight:bold;font-size:18px;padding:0 14px;min-height:48px}
.add:active{background:#2a8f37}
ul{list-style:none;padding:0;margin:14px 0;min-height:150px}
li{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:22px}
li.done span{text-decoration:line-through;opacity:.5}
.box{width:36px;height:36px;border:3px solid #222;background:#fff;border-radius:4px;font-size:24px;line-height:1;flex:none}
span{flex:1}
.x{background:none;border:0;font-size:30px;width:48px;height:48px;color:#222}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.msg{text-align:center;font-size:18px;min-height:24px;color:#a33}
.reset{border:2px solid #222;background:#ffe27a;padding:8px 12px;border-radius:6px}
.pop{animation:p .3s}
@keyframes p{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="app">
<h1>MY TO-DO LIST</h1>
<form class="row" id="f"><input id="in" placeholder="add a task..." maxlength="40" autocomplete="off"><button class="add" type="submit">ADD</button></form>
<ul id="list"></ul>
<div class="msg" id="msg"></div>
<div class="foot"><div id="left"></div><div>⭐ <b id="score">0</b></div><button class="reset" id="reset">Restart</button></div>
</div>
<script>
let id=0,tasks,score;
const $=s=>document.getElementById(s);
function init(){
tasks=[];score=0;
["buy milk","math homework","call grandma"].forEach(t=>tasks.push({id:id++,t,d:false}));
$("msg").textContent="";render();
}
function render(){
const l=$("list");l.innerHTML="";
tasks.forEach(k=>{
const li=document.createElement("li");li.className="pop"+(k.d?" done":"");
const b=document.createElement("button");b.className="box";b.textContent=k.d?"✔":"";
b.onclick=()=>{k.d=!k.d;score+=k.d?10:-10;check();};
const s=document.createElement("span");s.textContent=k.t;
const x=document.createElement("button");x.className="x";x.textContent="✕";
x.onclick=()=>{tasks=tasks.filter(z=>z!==k);check();};
li.append(b,s,x);l.append(li);
});
const n=tasks.filter(k=>!k.d).length;
$("left").textContent=n+(n==1?" task left":" tasks left");
$("score").textContent=score;
}
function check(){
render();
if(tasks.length&&tasks.every(k=>k.d))$("msg").textContent="🎉 You win! All tasks done! Score "+score;
else if(!tasks.length)$("msg").textContent="Empty list! Add a task to play 😊";
else $("msg").textContent="";
}
$("f").onsubmit=e=>{
e.preventDefault();
const v=$("in").value.trim();if(!v)return;
tasks.push({id:id++,t:v,d:false});$("in").value="";check();
};
$("reset").onclick=init;
init();
</script>
</body>
</html>
