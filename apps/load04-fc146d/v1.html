<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Timer</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;font-family:"Segoe Print","Comic Sans MS",cursive,sans-serif;color:#1a1a5e}
  .card{width:min(92vw,380px);border:3px solid #222;border-radius:8px;padding:24px 20px;text-align:center;background:#fffdf8;box-shadow:6px 6px 0 #d9dcf0}
  h1{margin:0 0 20px;font-size:1.8rem;letter-spacing:1px}
  .ring{position:relative;width:min(70vw,260px);height:min(70vw,260px);margin:0 auto 24px}
  svg{width:100%;height:100%;transform:rotate(-90deg)}
  circle{fill:none;stroke-width:6}
  .bg{stroke:#222}
  .fg{stroke:#4f8cff;stroke-linecap:round;transition:stroke-dashoffset .4s linear}
  #time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.2rem;font-weight:bold}
  .btns{display:flex;gap:12px}
  button{flex:1;padding:16px 0;font:inherit;font-size:1.3rem;color:#1a1a5e;background:#fff;border:3px solid #222;border-radius:6px;cursor:pointer}
  button:active{transform:translateY(2px);background:#e8ecff}
  #msg{min-height:1.4em;margin:16px 0 0;color:#2a7a3b}
  #sess{margin:8px 0 0;font-size:1.2rem}
</style>
</head>
<body>
<div class="card">
  <h1>STUDY TIMER</h1>
  <div class="ring">
    <svg viewBox="0 0 100 100">
      <circle class="bg" cx="50" cy="50" r="46" style="stroke-width:2"/>
      <circle class="fg" id="fg" cx="50" cy="50" r="46" stroke-dasharray="289.03" stroke-dashoffset="0" style="stroke-width:3"/>
    </svg>
    <div id="time">25:00</div>
  </div>
  <div class="btns">
    <button id="start">START</button>
    <button id="reset">RESET</button>
  </div>
  <p id="msg"></p>
  <p id="sess">Sessions done: 0</p>
</div>
<script>
const TOTAL=25*60;
let left=TOTAL,timer=null,sessions=0;
const $=id=>document.getElementById(id);
function draw(){
  const m=String(Math.floor(left/60)).padStart(2,"0"),s=String(left%60).padStart(2,"0");
  $("time").textContent=m+":"+s;
  $("fg").style.strokeDashoffset=289.03*(1-left/TOTAL);
  document.title=(timer?m+":"+s+" - ":"")+"Study Timer";
}
function stop(){clearInterval(timer);timer=null;$("start").textContent="START"}
function tick(){
  left--;
  if(left<=0){
    left=0;stop();sessions++;
    $("sess").textContent="Sessions done: "+sessions;
    $("msg").textContent="🎉 Great job! Session complete. Take a break!";
    try{
      const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();
      o.connect(a.destination);o.frequency.value=660;o.start();o.stop(a.currentTime+0.4);
    }catch(e){}
  }
  draw();
}
$("start").onclick=()=>{
  if(timer){stop();$("start").textContent="RESUME";return}
  if(left===0)left=TOTAL;
  $("msg").textContent="Focus time! 📚";
  $("start").textContent="PAUSE";
  timer=setInterval(tick,1000);
  draw();
};
$("reset").onclick=()=>{
  stop();left=TOTAL;$("msg").textContent="";draw();
};
draw();
</script>
</body>
</html>
