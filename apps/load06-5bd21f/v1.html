<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tony's Pizza - Order Rush</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS",cursive,sans-serif;background:#faf6ee;color:#1a1a5c;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:900px;border:4px solid #222;margin:10px;background:#fffaf0;display:flex;flex-direction:column}
h1{margin:0;padding:14px 18px;border-bottom:4px solid #222;font-size:2rem;letter-spacing:2px}
.bar{display:flex;justify-content:space-between;padding:8px 18px;font-weight:bold;background:#fde9c8;border-bottom:3px solid #222}
.ticket{padding:8px 18px;font-size:1.1rem;min-height:44px}
.menu{display:flex;gap:10px;padding:10px;flex-wrap:wrap}
.card{flex:1;min-width:130px;border:3px solid #222;padding:10px;text-align:center;background:#fff}
.pz{font-size:3.5rem;line-height:1.2}
.card button,.cart button{font:inherit;font-weight:bold;border:3px solid #222;background:#ffd24d;padding:12px;margin-top:8px;width:100%;cursor:pointer;color:#1a1a5c}
.card button:active,.cart button:active{transform:scale(.95)}
.cart{margin:10px;border:3px solid #222;padding:12px;font-size:1.2rem}
.cart button{width:auto;float:right;background:#7bd88f}
#msg{text-align:center;font-size:1.3rem;padding:6px;min-height:40px;font-weight:bold}
#restart{display:none;margin:0 auto 10px;font:inherit;padding:12px 24px;font-weight:bold;border:3px solid #222;background:#ff8a80;cursor:pointer}
</style></head><body>
<div class="app">
<h1>🍕 TONY'S PIZZA</h1>
<div class="bar"><span>⭐ Score: <b id="sc">0</b></span><span>⏱ <b id="tm">30</b>s</span><span>🏆 Best: <b id="bs">0</b></span></div>
<div class="ticket" id="tk">Press a number key 1-3 or tap ORDER!</div>
<div class="menu" id="menu"></div>
<div id="msg">Match the customer's order before time runs out!</div>
<div class="cart"><span id="ct">YOUR CART: 0 items &nbsp; TOTAL $0</span><button id="co">CHECKOUT</button><div style="clear:both"></div></div>
<button id="restart">🔄 Play again</button>
</div>
<script>
const P=[{n:"Margherita",p:10,e:"🍕"},{n:"Pepperoni",p:12,e:"🍖"},{n:"Veggie",p:11,e:"🥦"}];
let cart=[0,0,0],score=0,best=0,time=30,want=[],over=false,timer;
const $=id=>document.getElementById(id);
$("menu").innerHTML=P.map((x,i)=>`<div class="card"><div class="pz">${x.e}</div><div>${x.n} $${x.p}</div><button onclick="add(${i})">ORDER (${i+1})</button></div>`).join("");
function newTicket(){want=[0,0,0];const k=2+Math.floor(Math.random()*3);for(let i=0;i<k;i++)want[Math.floor(Math.random()*3)]++;
$("tk").innerHTML="📝 Customer wants: "+want.map((c,i)=>c?`<b>${c}× ${P[i].n}</b>`:"").filter(Boolean).join(", ")+" — then CHECKOUT!";}
function draw(){const n=cart.reduce((a,b)=>a+b,0),t=cart.reduce((a,c,i)=>a+c*P[i].p,0);
$("ct").innerHTML=`YOUR CART: ${n} items &nbsp; TOTAL $${t}`;$("sc").textContent=score;$("tm").textContent=time;$("bs").textContent=best;}
function add(i){if(over)return;cart[i]++;$("msg").textContent=`Added ${P[i].n}!`;draw();}
function checkout(){if(over)return;
if(cart.every((c,i)=>c===want[i])){score+=10;time+=4;$("msg").textContent="✅ Perfect order! +10 points, +4 seconds";}
else{score=Math.max(0,score-5);time=Math.max(0,time-3);$("msg").textContent="❌ Wrong order! -5 points, -3 seconds";}
cart=[0,0,0];newTicket();draw();}
function end(){over=true;clearInterval(timer);best=Math.max(best,score);
$("msg").textContent=score>=50?`🎉 You win! Final score ${score}`:`⏰ Time's up! Score ${score} (get 50 to win)`;
$("restart").style.display="block";draw();}
function start(){cart=[0,0,0];score=0;time=30;over=false;$("restart").style.display="none";
$("msg").textContent="Go go go!";newTicket();draw();clearInterval(timer);
timer=setInterval(()=>{time--;if(time<=0){time=0;end();}draw();},1000);}
$("co").onclick=checkout;$("restart").onclick=start;
document.addEventListener("keydown",e=>{if(e.key>="1"&&e.key<="3")add(+e.key-1);
else if(e.key==="Enter")checkout();else if(e.key==="ArrowLeft")add(0);else if(e.key==="ArrowDown")add(1);else if(e.key==="ArrowRight")add(2);});
start();
</script></body></html>
