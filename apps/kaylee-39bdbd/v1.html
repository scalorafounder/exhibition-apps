<title>Guess the Song</title>
<style>

*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}

.row{display:flex;gap:10px}

<header><h1>🎵 Guess the Song?</h1><div><button class="pill" id="snd">🔇 Sound off</button></div></header>
<header><span class="pill" id="sc">Score 0</span><span class="pill" id="rd">Round 1/8</span><span class="pill" id="bs">Best 0</span></header>
<main>
<div class="box"><canvas id="cv"></canvas><div id="q">?</div></div>
<div id="msg">Press Play to hear a tune!</div>
<div class="row"><button class="go" id="play">▶ Play song</button></div>

<div id="end"><div style="font-size:4rem">🏆</div><h1 id="et"></h1><div id="es"></div><button class="go" id="again">Play again</button></div>
<script>
const N={C:261.6,D:293.7,E:329.6,F:349.2,G:392,A:440,B:493.9,c:523.3,d:587.3,e:659.3,g:784,f:698.5};

["Happy Birthday","G G A G c B-G G A G d c-",.4],
["Ode to Joy","E E F G G F E D C C D E E D D-",.35],
["Mary Had a Little Lamb","E D C D E E E-D D D-E G G-",.4],
["Jingle Bells","E E E-E E E-E G C D E-",.3],
["Frère Jacques","C D E C C D E C E F G-E F G-",.35],
["Row Row Row Your Boat","C C C D E-E D E F G-",.4],
["Careless Whisper Riff","A G E D E-A G E D E G-",.4],
["Fur Elise","e d e d e B d c A-",.3],
["Amazing Grace","G c e c e d c A G-",.4],
["Old MacDonald","G G G D E E D-B B A A G-",.35],
["Silent Night","G A G E-G A G E-d d B-c c G-",.5]];
