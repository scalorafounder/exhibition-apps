<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;font-family:"Comic Sans MS","Segoe Print",cursive,sans-serif;color:#1c1c5a;padding:16px}
.card{width:100%;max-width:420px;background:#fff;border:3px solid #222;border-radius:14px;padding:22px;box-shadow:6px 6px 0 #c9d0f0}
h1{margin:0 0 18px;font-size:1.7rem;letter-spacing:1px}
.box{border:3px solid #222;border-radius:8px;padding:12px;margin-bottom:18px;font-size:1.25rem}
.bill{display:flex;align-items:center;gap:8px}
.bill input{flex:1;min-width:0;font:inherit;font-size:1.4rem;border:none;border-bottom:3px solid #1c1c5a;background:transparent;color:inherit;outline:none;padding:4px}
.lbl{font-size:1.2rem;margin-bottom:6px}
.tips{display:flex;gap:10px;margin-bottom:18px}
.tips button{flex:1;min-height:56px;font:inherit;font-size:1.3rem;border:3px solid #222;border-radius:8px;background:#fff;color:inherit;cursor:pointer}
.tips button.on{background:#1c1c5a;color:#fff}
.ppl{display:flex;align-items:center;justify-content:space-between}
.ppl button{width:52px;height:52px;font:inherit;font-size:1.8rem;border:3px solid #222;border-radius:50%;background:#eef;cursor:pointer;color:inherit}
.ppl b{font-size:1.6rem;min-width:40px;text-align:center}
.res{margin:0;line-height:1.9;font-size:1.3rem}
.res span{font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>TIP CALCULATOR</h1>
<div class="box bill">Bill: $ <input id="bill" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>
<div class="lbl">Tip:</div>
<div class="tips" id="tips">
<button data-p="10">10%</button><button data-p="15" class="on">15%</button><button data-p="20">20%</button>
</div>
<div class="box ppl"><span>People:</span><button id="minus" aria-label="fewer">−</button><b id="n">2</b><button id="plus" aria-label="more">+</button></div>
<div class="box">
<p class="res">TIP: <span id="tip">$0.00</span></p>
<p class="res">EACH PAYS: <span id="each">$0.00</span></p>
</div>
</div>
<script>
let pct=15,people=2;
const $=id=>document.getElementById(id);
function calc(){
const bill=Math.max(0,parseFloat($("bill").value)||0);
const tip=bill*pct/100;
$("tip").textContent="$"+tip.toFixed(2);
$("each").textContent="$"+((bill+tip)/people).toFixed(2);
$("n").textContent=people;
}
$("bill").addEventListener("input",calc);
$("tips").addEventListener("click",e=>{
const b=e.target.closest("button");if(!b)return;
pct=+b.dataset.p;
[...$("tips").children].forEach(x=>x.classList.toggle("on",x===b));
calc();
});
$("minus").onclick=()=>{if(people>1){people--;calc()}};
$("plus").onclick=()=>{if(people<50){people++;calc()}};
calc();
</script>
</body>
</html>
