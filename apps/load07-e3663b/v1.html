<style>
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
input{-webkit-user-select:text;user-select:text}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0;height:100%}
:root{--ink:#1c1a4a;--bg:#faf6ee;--a:#5b5bd6;--b:#ff8a5c;--c:#2fb98a;--card:#fff;--mut:#7a7897;--r:18px}
body{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#e9e7ff,#fff1e6);display:flex;align-items:center;justify-content:center;overflow:hidden}
#ph{width:100%;max-width:440px;height:100dvh;max-height:860px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;background-image:repeating-linear-gradient(transparent 0 47px,#dfe3f5 47px 48px)}
@media(min-width:480px){#ph{border-radius:36px;box-shadow:0 20px 60px #1c1a4a44;border:8px solid var(--ink)}}
header{background:var(--a);color:#fff;padding:18px 16px;display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px;letter-spacing:1px}
button{font:inherit;cursor:pointer;border:0;transition:transform .12s,background .2s}
button:active{transform:scale(.93)}
#snd{background:#ffffff33;color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px}
.scr{flex:1;display:none;flex-direction:column;min-height:0;animation:in .3s}
.scr.on{display:flex}
@keyframes in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
form{display:flex;gap:8px;padding:14px}
input{flex:1;min-width:0;height:56px;border:2.5px solid var(--ink);border-radius:var(--r);padding:0 14px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid #5b5bd655}
#add{height:56px;padding:0 20px;background:var(--b);color:#fff;border-radius:var(--r);font-size:17px;font-weight:700}
ul{list-style:none;margin:0;padding:0 14px;overflow:auto;flex:1}
li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:6px 8px;margin-bottom:10px;min-height:60px;box-shadow:0 2px 8px #1c1a4a14;animation:pop .3s}
li.out{transform:translateX(100%);opacity:0;transition:.25s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.bx{width:44px;height:44px;flex:none;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-size:24px;color:#fff}
li.d .bx{background:var(--c);border-color:var(--c)}
.t{flex:1;font-size:18px;word-break:break-word}
li.d .t{text-decoration:line-through;color:var(--mut)}
.x{width:44px;height:44px;flex:none;background:none;font-size:22px;color:var(--ink)}
.em{text-align:center;color:var(--mut);padding:40px 20px;font-size:18px}
.em b{display:block;font-size:56px}

.st{padding:20px;display:grid;gap:12px}
.cd{background:#fff;border-radius:var(--r);padding:18px;text-align:center;box-shadow:0 2px 8px #1c1a4a14}
.cd b{display:block;font-size:44px;color:var(--a)}

</style></head><body>
<div id="ph">
<header><h1 id="ttl">MY TO-DO LIST</h1><button id="snd" aria-label="sound">🔇</button></header>
<section class="scr on" id="s1">
<form id="f"><input id="in" placeholder="add a task..." maxlength="60" autocomplete="off"><button id="add" type="submit">ADD</button></form>
<ul id="ul"></ul>
<footer id="left"></footer>
</section>
<section class="scr" id="s2"><div class="st">
<div class="cd"><b id="n1">0</b>tasks done</div>
<div class="cd"><b id="n2">0</b>tasks left</div>
<div class="bar"><i id="pb"></i></div>
<button id="clr">🧹 Clear finished tasks</button>
</div></section>
<nav><button class="on" data-s="s1">📝 Tasks</button><button data-s="s2">📊 Progress</button></nav>
</div>
<script>

l.querySelector(".bx").onclick=()=>{k.d=!k.d;beep(k.d?880:440);R()};
l.querySelector(".x").onclick=()=>{l.classList.add("out");beep(260);setTimeout(()=>{T.splice(T.indexOf(k),1);R()},230)};
u.appendChild(l)});

$("f").onsubmit=e=>{e.preventDefault();const v=$("in").value.trim();if(!v){$("in").focus();return}T.push({t:v,d:0});$("in").value="";beep(660);R();$("ul").scrollTop=1e5};
$("clr").onclick=()=>{T=T.filter(k=>!k.d);beep(300);R()};
$("snd").onclick=()=>{on=!on;$("snd").textContent=on?"🔊":"🔇";beep(600)};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button,.scr").forEach(e=>e.classList.remove("on"));b.classList.add("on");$(b.dataset.s).classList.add("on");$("ttl").textContent=b.dataset.s=="s1"?"MY TO-DO LIST":"MY PROGRESS";beep(520)});

</script></body></html>
