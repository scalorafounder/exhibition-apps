<style>

*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}

.pill{background:#ffffff1a;padding:6px 12px;border-radius:99px}
#snd{background:#ffffff1a;color:var(--l);border:0;border-radius:99px;padding:8px 12px;font-size:14px;min-height:36px}

</style></head><body>
<div id="app">
<header><h1>STICKMAN RUN</h1><div class="hud"><span class="pill">Score: <span id="sc">0</span></span><span class="pill">🪙 <span id="co">0</span></span><button id="snd">🔇 Sound off</button></div></header>
<div id="stage"><canvas id="cv"></canvas>
<div class="ov" id="ti"><h2>🏃 Stickman Run</h2><p>Jump over the blocks and grab the coins!</p><p>Keys: ← → or A D to move, Space or ↑ to jump</p><button class="big" id="pl">Play</button></div>
<div class="ov hide" id="go"><h2>Game Over</h2><p>Score: <b id="fs">0</b> · Coins: <b id="fc">0</b></p><p>Best: <b id="bs">0</b></p><button class="big" id="pa">Play again</button></div>
</div>
<div id="ctl"><button id="l">⬅ LEFT</button><button id="r">RIGHT ➡</button><button id="j">JUMP ⬆</button></div>

<script>

function rel(){held.l=held.r=held.j=0;['l','r','j'].forEach(k=>$(k).classList.remove('on'))}

['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{held[k]=0;b.classList.remove('on')}))});

addEventListener('keyup',e=>{const k=km(e.code);if(k)held[k]=0});

$('pl').onclick=start;$('pa').onclick=start;
function boom(a,b,c,n){for(let i=0;i<n;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*300,vy:-Math.random()*300,l:.6,c})}

let ns=0;
function upd(dt){t+=dt;spd=240+t*6;ns-=dt;if(ns<=0){spawn();ns=(.9+Math.random()*.9)*Math.max(.55,1-t/120)*(260/spd)*1.6}

last=performance.now();px=W*.2;blocks=[];coins=[];parts=[];pops=[];py=0;t=0;requestAnimationFrame(loop);
</script></body></html>
