<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#faf7f0;background-image:repeating-linear-gradient(#faf7f0 0 31px,#dde2f3 32px);font-family:"Comic Sans MS","Segoe Print",cursive;color:#1a1a5e}
  h1{margin:0;font-size:clamp(28px,8vw,52px);letter-spacing:2px}
  #board{display:grid;grid-template-columns:repeat(3,1fr);width:min(86vw,420px);aspect-ratio:1}
  .c{background:none;border:none;font:inherit;font-size:clamp(50px,18vw,100px);color:#1a1a5e;cursor:pointer;border-right:5px solid #222;border-bottom:5px solid #222;padding:0}
  .c:nth-child(3n){border-right:none}
  .c:nth-child(n+7){border-bottom:none}
  .c:hover:not(:disabled){background:#e9ecfa}
  .c.win{background:#ffe9a8}
  .c:disabled{cursor:default}
  #bar{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  #status,#restart{font:inherit;font-size:20px;color:#1a1a5e;background:#fff;border:3px solid #222;padding:14px 18px;min-height:52px}
  #restart{cursor:pointer}
  #restart:hover{background:#e9ecfa}
</style>
</head>
<body>
<h1>TIC TAC TOE</h1>
<div id="board"></div>
<div id="bar">
  <div id="status" aria-live="polite"></div>
  <button id="restart">RESTART</button>
</div>
<script>
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const bd=document.getElementById('board'),st=document.getElementById('status');
let b,turn,over,cells=[];
for(let i=0;i<9;i++){const c=document.createElement('button');c.className='c';c.setAttribute('aria-label','square '+(i+1));c.onclick=()=>play(i);bd.appendChild(c);cells.push(c)}
function render(){cells.forEach((c,i)=>{c.textContent=b[i]||'';c.disabled=over||!!b[i]})}
function play(i){
  if(over||b[i])return;
  b[i]=turn;
  const w=L.find(l=>l.every(k=>b[k]===turn));
  if(w){over=true;st.textContent='🎉 '+turn+' wins!';render();w.forEach(k=>cells[k].classList.add('win'));return}
  if(b.every(Boolean)){over=true;st.textContent="It's a tie! 🤝";render();return}
  turn=turn==='X'?'O':'X';
  st.textContent='Your turn: '+turn;
  render();
}
function reset(){b=Array(9).fill('');turn='X';over=false;st.textContent='Your turn: X';cells.forEach(c=>c.classList.remove('win'));render();
  b[0]='X';b[4]='O';turn='X';render();b[0]='';b[4]='';render()}
document.getElementById('restart').onclick=reset;
reset();
</script>
</body>
</html>
