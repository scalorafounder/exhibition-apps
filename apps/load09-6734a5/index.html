<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Timer & Shop</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe Print","Comic Sans MS",cursive,sans-serif;background:#faf7f0;color:#1a1a5e;padding:16px}
.wrap{max-width:980px;margin:auto;display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:800px){.wrap{grid-template-columns:340px 1fr;align-items:start}}
.card{background:#fff;border:3px solid #222;border-radius:12px;padding:18px}
h1{font-size:1.5rem;margin:0 0 10px;text-align:right}h2{margin-top:0}
.ring{width:240px;height:240px;border:5px solid #222;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:3.3rem;font-weight:bold;background:conic-gradient(#c9d4ff var(--p,0%),#fff 0)}
.ring span{background:#fff;border-radius:50%;padding:30px 12px}
.row{display:flex;gap:12px}button{font:inherit;color:#1a1a5e;background:#fff;border:3px solid #222;border-radius:6px;padding:12px;min-height:48px;cursor:pointer;flex:1;font-size:1.1rem}
button:active{background:#dfe5ff}.sess{margin-top:14px;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.p{border:2px solid #222;border-radius:10px;padding:10px;text-align:center}.p .e{font-size:2.6rem}.p button{font-size:.9rem;padding:8px;width:100%}
.ci{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed #aaa}.ci b{flex:1}.ci button{flex:none;width:38px;min-height:38px;padding:0}
#msg{color:#0a7a3a;font-weight:bold;margin-top:8px}
</style></head><body><div class="wrap">
<div class="card"><h1>STUDY TIMER</h1>
<div class="ring" id="ring"><span id="t">25:00</span></div>
<div class="row"><button id="go">START</button><button id="rs">RESET</button></div>
<div class="sess">Sessions done: <b id="n">0</b></div><div id="tm" style="margin-top:8px"></div></div>
<div class="card"><h2>📚 Study Shop</h2><div class="grid" id="grid"></div>
<h2 style="margin-top:20px">🛒 Cart (<span id="cnt">0</span>)</h2><div id="cart"></div>
<p><b>Total: $<span id="tot">0.00</span></b></p><button id="co" style="width:100%">Checkout</button><div id="msg"></div></div>
</div><script>
const TOTAL=1500;let left=TOTAL,iv=null,sess=0;
const $=i=>document.getElementById(i);
function draw(){const m=Math.floor(left/60),s=left%60;$('t').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('ring').style.setProperty('--p',((TOTAL-left)/TOTAL*100)+'%');document.title=$('t').textContent+' – Study Timer'}
function stop(){clearInterval(iv);iv=null;$('go').textContent='START'}
$('go').onclick=()=>{if(iv){stop();return}if(left===0)left=TOTAL;$('go').textContent='PAUSE';$('tm').textContent='Focus time! 💪';
iv=setInterval(()=>{left--;draw();if(left<=0){stop();sess++;$('n').textContent=sess;$('tm').textContent='🎉 Session complete! Take a break.'}},1000)};
$('rs').onclick=()=>{stop();left=TOTAL;draw();$('tm').textContent=''};
const items=[['✏️','Pencil Set',3.5],['📓','Notebook',4.99],['🖍️','Highlighters',5.25],['🎧','Headphones',19.9],['🧮','Calculator',12],['🎒','Backpack',29.5],['💡','Desk Lamp',15.75],['☕','Study Mug',8]];
let cart={};
$('grid').innerHTML=items.map((p,i)=>`<div class="p"><div class="e">${p[0]}</div><div>${p[1]}</div><div>$${p[2].toFixed(2)}</div><button onclick="add(${i})">Add to cart</button></div>`).join('');
function add(i){cart[i]=(cart[i]||0)+1;$('msg').textContent='';show()}
function chg(i,d){cart[i]+=d;if(cart[i]<=0)delete cart[i];show()}
function show(){let c=0,t=0,h='';for(const i in cart){const q=cart[i],p=items[i];c+=q;t+=q*p[2];
h+=`<div class="ci"><span>${p[0]}</span><b>${p[1]}</b><button onclick="chg(${i},-1)">−</button>${q}<button onclick="chg(${i},1)">+</button><span>$${(q*p[2]).toFixed(2)}</span><button onclick="chg(${i},-cart[${i}])">✕</button></div>`}
$('cart').innerHTML=h||'<p>Your cart is empty.</p>';$('cnt').textContent=c;$('tot').textContent=t.toFixed(2)}
$('co').onclick=()=>{if(!Object.keys(cart).length){$('msg').textContent='Add something first!';return}cart={};show();$('msg').textContent='🎉 Thank you for your order! Happy studying!'};
draw();show();
</script></body></html>
