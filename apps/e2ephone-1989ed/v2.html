<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#bfe3ff;font-family:"Segoe Print","Comic Sans MS",cursive,sans-serif;color:#1c1c5a}
.card{width:min(94vw,440px);min-height:520px;background:#fff;border:3px solid #222;border-radius:6px;padding:22px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #8fc1e8}
h1{margin:0 0 16px;font-size:28px;letter-spacing:1px;text-align:center}
form{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px;border:3px solid #222;border-radius:4px;color:#1c1c5a}
button.add{font:inherit;font-size:18px;font-weight:bold;padding:10px 16px;border:3px solid #1b6b2f;background:#2ecc57;color:#fff;border-radius:4px;cursor:pointer;min-height:48px}
button.add:hover{background:#28b84e}
button.add:active{background:#1f9a3d}
ul{list-style:none;padding:0;margin:20px 0;flex:1}
li{display:flex;align-items:center;gap:14px;padding:10px 0;font-size:22px}
li .box{width:36px;height:36px;border:3px solid #222;border-radius:4px;background:#fff;cursor:pointer;font-size:24px;line-height:1;padding:0;flex:none;color:#1a8a3a}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;opacity:.5}
li .x{background:none;border:none;font-size:30px;cursor:pointer;color:#222;width:44px;height:44px}
li .x:hover{color:#c0392b}
.foot{font-size:18px}
.empty{text-align:center;opacity:.6;margin-top:40px}
</style>
</head>
<body>
<div class="card">
<h1>MY TO-DO LIST</h1>
<form id="f"><input type="text" id="t" placeholder="add a task..." maxlength="60" autocomplete="off"><button class="add" type="submit">ADD</button></form>
<ul id="l"></ul>
<div class="foot" id="c"></div>
</div>
<script>
let tasks=[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
const l=document.getElementById("l"),c=document.getElementById("c"),t=document.getElementById("t");
function render(){
l.innerHTML="";
if(!tasks.length){l.innerHTML='<div class="empty">All done! 🎉</div>'}
tasks.forEach((k,i)=>{
const li=document.createElement("li");if(k.d)li.className="done";
const b=document.createElement("button");b.className="box";b.textContent=k.d?"✓":"";b.setAttribute("aria-label","toggle");
b.onclick=()=>{k.d=!k.d;render()};
const s=document.createElement("span");s.textContent=k.t;
const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","delete");
x.onclick=()=>{tasks.splice(i,1);render()};
li.append(b,s,x);l.appendChild(li);
});
const n=tasks.filter(k=>!k.d).length;
c.textContent=n+(n===1?" task left":" tasks left");
}
document.getElementById("f").onsubmit=e=>{
e.preventDefault();
const v=t.value.trim();
if(v){tasks.push({t:v,d:false});t.value="";render()}
t.focus();
};
render();
</script>
</body>
</html>
