<title>Beat Pad Rush</title>
<style>
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0;height:100dvh;overflow:hidden}
:root{--a:#ff4d6d;--b:#ffb703;--c:#2ec4b6;--d:#8d5bff;--dk:#120c2b;--lt:#fff8ea;--r:18px}
body{background:radial-gradient(circle at 20% 10%,#2b1b5e,var(--dk) 70%);color:var(--lt);font-family:system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column}

h1{margin:0;font-size:clamp(18px,4vw,28px);letter-spacing:2px;color:var(--b)}
.st{font-size:clamp(13px,3vw,18px);text-align:center}
#cv{flex:1;min-height:0;width:100%;touch-action:none;display:block}
#ctl{display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));align-items:center}
button{min-height:56px;border:0;border-radius:var(--r);font:800 18px system-ui;color:var(--dk);background:var(--b);padding:0 18px;transition:transform .1s;cursor:pointer}
button:active{transform:scale(.93)}
#clr{background:var(--a);color:#fff}#snd{background:var(--c);min-width:56px;padding:0 12px}

#ov{position:fixed;inset:0;background:#120c2bd9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:5}
#ov h2{font-size:clamp(34px,9vw,64px);margin:0;color:var(--b)}#ov p{margin:0;font-size:18px;max-width:420px}

</style></head><body>
<div id="top"><h1>BEAT PAD</h1><div class="st" id="st">Score 0 · Best 0 · ❤️❤️❤️</div><button id="snd" aria-label="sound">🔇</button></div>
<canvas id="cv"></canvas>
<div id="ctl"><label>Tempo <span id="tv">100</span> BPM<input id="tp" type="range" min="60" max="180" value="100"></label><button id="clr">CLEAR</button></div>
<div id="ov"><h2>🥁 BEAT PAD RUSH</h2><p>Pads light up in the rhythm. Tap or press the matching pad right as it glows! Keys: 1 2 3 4 / Q W E R / A S D F. Miss 3 and it's over.</p><button id="go">PLAY</button></div>
<script>

</script></body></html>
