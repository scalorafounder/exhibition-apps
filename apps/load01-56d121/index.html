<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony's Pizza</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS","Segoe Print",cursive,sans-serif;background:#faf7f0;color:#1c1c5a}
header{border-bottom:4px solid #222;padding:18px 24px;background:#fff3d6}
h1{margin:0;font-size:clamp(28px,6vw,48px);letter-spacing:2px}
main{max-width:1000px;margin:0 auto;padding:20px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{border:3px solid #222;border-radius:10px;background:#fff;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.pizza{width:140px;height:140px;border:3px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:80px;background:#ffe3a3}
.name{font-size:20px;font-weight:bold}
.desc{font-size:14px;opacity:.8}
button{font:inherit;font-size:18px;border:3px solid #222;border-radius:8px;background:#ffd45e;color:#1c1c5a;padding:12px 24px;cursor:pointer;min-height:48px}
button:active{transform:scale(.95)}
.cart{margin-top:24px;border:3px solid #222;border-radius:10px;background:#fff;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;font-size:22px}
ul{list-style:none;padding:0;margin:10px 0;font-size:16px}
li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #aab}
#msg{margin-top:10px;font-size:18px;color:#1a7a3a;min-height:24px}
.clear{background:#eee;font-size:14px;padding:6px 12px;min-height:36px}
</style>
</head>
<body>
<header><h1>🍕 TONY'S PIZZA</h1></header>
<main>
<div class="menu" id="menu"></div>
<section class="cart">
<div class="row">
<div>YOUR CART: <b id="count">0 items</b> &nbsp; TOTAL <b id="total">$0</b></div>
<button id="checkout">CHECKOUT</button>
</div>
<ul id="list"></ul>
<button class="clear" id="clear">Empty cart</button>
<div id="msg"></div>
</section>
</main>
<script>
const pizzas=[
{n:"Margherita",p:10,e:"🍅",d:"Tomato, mozzarella, basil"},
{n:"Pepperoni",p:12,e:"🍕",d:"Spicy pepperoni, extra cheese"},
{n:"Veggie",p:11,e:"🫑",d:"Peppers, olives, mushrooms"}];
let cart=[0,0,0];
const $=id=>document.getElementById(id);
$("menu").innerHTML=pizzas.map((x,i)=>`<div class="card"><div class="pizza">${x.e}</div><div class="name">${x.n} $${x.p}</div><div class="desc">${x.d}</div><button onclick="add(${i})">ORDER</button></div>`).join("");
function add(i){cart[i]++;$("msg").textContent="";render()}
function render(){
const c=cart.reduce((a,b)=>a+b,0);
const t=cart.reduce((a,q,i)=>a+q*pizzas[i].p,0);
$("count").textContent=c+(c==1?" item":" items");
$("total").textContent="$"+t;
$("list").innerHTML=cart.map((q,i)=>q?`<li><span>${pizzas[i].n} × ${q}</span><span>$${q*pizzas[i].p}</span></li>`:"").join("");
}
$("clear").onclick=()=>{cart=[0,0,0];$("msg").textContent="";render()};
$("checkout").onclick=()=>{
const c=cart.reduce((a,b)=>a+b,0);
if(!c){$("msg").style.color="#b33";$("msg").textContent="Your cart is empty. Pick a pizza first!";return}
const t=cart.reduce((a,q,i)=>a+q*pizzas[i].p,0);
$("msg").style.color="#1a7a3a";
$("msg").textContent="🎉 Thanks! Your order of "+c+" pizza"+(c>1?"s":"")+" ($"+t+") is being baked!";
cart=[0,0,0];render();
};
render();
</script>
</body>
</html>
