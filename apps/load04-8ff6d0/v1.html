<style>

html,body{touch-action:manipulation;overscroll-behavior:none;margin:0;height:100%;overflow:hidden}
:root{--ink:#1b1b4b;--bg:#faf6ee;--a:#ff6b6b;--b:#ffd166;--c:#4ecdc4;--d:#6c5ce7;--r:20px}

<div class="app">
<header><h1>STUDY TIMER</h1><button class="snd" id="sn">🔇</button></header>
<div class="modes" id="md"><button data-m="25" class="on">Focus 25</button><button data-m="5">Break 5</button><button data-m="15">Long 15</button></div>
<div class="stage"><canvas id="cv"></canvas><div id="t">25:00</div><div id="lb">Tap START to focus</div></div>

<script>
