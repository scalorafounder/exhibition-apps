<style>

</style></head><body>
<header><h1>STICKMAN RUN</h1><div class="hud"><span class="pill">Score <span id="sc">0</span></span><span class="pill">🪙 <span id="co">0</span></span><button id="snd">🔇 Sound off</button></div></header>
<div id="wrap"><canvas id="c"></canvas>
<div class="ov" id="st"><h2>🏃 Stickman Run</h2><p>Jump the blocks, grab the coins!<br>Keys: ← → move, Space/↑ jump</p><button class="big" id="go">Play</button></div>

<div id="ctl"><button class="b" data-k="left">◀ LEFT</button><button class="b" data-k="right">RIGHT ▶</button><div class="sp"></div><button class="b j" data-k="jump">JUMP ▲</button></div>
<script>
