<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony's Pizza</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS","Segoe Print",cursive,sans-serif;background:#faf7f0;color:#1a1a5e;min-height:100vh;display:flex;justify-content:center;padding:12px}
.app{width:100%;max-width:900px;border:4px solid #222;background:#fffdf8;border-radius:6px}
header{border-bottom:4px solid #222;padding:14px 20px}
h1{margin:0;font-size:clamp(28px,6vw,48px);letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;padding:20px}
.card{border:3px solid #222;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;border-radius:4px}
.pizza{width:140px;height:140px;border:3px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:80px;background:#ffe9b0}
.name{font-size:20px;align-self:flex-start}
button{font:inherit;color:#1a1a5e;background:#fff;border:3px solid #222;padding:12px 22px;font-size:18px;cursor:pointer;min-height:48px;border-radius:4px}
button:hover{background:#ffe9b0}
button:active{transform:scale(.96)}
.cart{margin:0 20px 20px;border:3px solid #222;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:20px}
.info b{font-size:22px}
.list{width:100%;font-size:16px;min-height:20px}
.msg{text-align:center;padding:0 20px 16px;min-height:28px;font-size:18px;color:#2a7a2a}
</style>
</head>
<body>
<div class="app">
<header><h1>TONY'S PIZZA</h1></header>
<div class="grid" id="grid"></div>
<div class="cart">
<div class="info">YOUR CART: <b id="count">0 items</b> &nbsp; TOTAL <b id="total">$0</b></div>
<div class="list" id="list">Your cart is empty.</div>
<button id="clear">CLEAR</button>
<button id="checkout">CHECKOUT</button>
</div>
<div class="msg" id="msg"></div>
</div>
<script>
const pizzas=[{n:"Margherita",p:10,e:"🍕"},{n:"Pepperoni",p:12,e:"🍕"},{n:"Veggie",p:11,e:"🥦"}];
const qty=[0,0,0];
const grid=document.getElementById('grid');
pizzas.forEach((z,i)=>{
const d=document.createElement('div');d.className='card';
d.innerHTML=`<div class="pizza">${z.e}</div><div class="name">${z.n} $${z.p}</div><button>ORDER</button>`;
d.querySelector('button').onclick=()=>{qty[i]++;msg('');render()};
grid.appendChild(d);
});
function msg(t){document.getElementById('msg').textContent=t}
function render(){
let c=0,t=0,parts=[];
qty.forEach((q,i)=>{c+=q;t+=q*pizzas[i].p;if(q)parts.push(q+" × "+pizzas[i].n)});
document.getElementById('count').textContent=c+(c==1?" item":" items");
document.getElementById('total').textContent="$"+t;
document.getElementById('list').textContent=parts.length?parts.join(", "):"Your cart is empty.";
}
document.getElementById('clear').onclick=()=>{qty.fill(0);msg('');render()};
document.getElementById('checkout').onclick=()=>{
const c=qty.reduce((a,b)=>a+b,0);
if(!c){msg("Add a pizza first! 🍕");return}
const t=qty.reduce((a,q,i)=>a+q*pizzas[i].p,0);
qty.fill(0);render();
msg("Thanks! Your order of $"+t+" is in the oven! 🔥");
};
render();
</script>
</body>
</html>
