<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tip Calculator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e8ecf5;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#1b1f4b}
.phone{width:100%;max-width:420px;min-height:100vh;background:#fff;display:flex;flex-direction:column}
@media(min-width:500px){.phone{min-height:0;height:800px;border-radius:32px;box-shadow:0 20px 50px #0003;overflow:hidden;border:8px solid #1b1f4b}}
header{background:#3b4cca;color:#fff;padding:18px;font-size:22px;font-weight:700;text-align:center}
main{flex:1;padding:18px;display:flex;flex-direction:column;gap:16px;overflow:auto}
label{font-weight:600;font-size:15px;display:block;margin-bottom:6px}
.bill{display:flex;align-items:center;border:3px solid #1b1f4b;border-radius:14px;padding:10px 14px;font-size:26px}
.bill input{border:0;outline:0;font-size:26px;width:100%;margin-left:6px;background:none;color:inherit}
.tips{display:flex;gap:10px}
.tips button{flex:1;padding:16px 0;font-size:22px;border:3px solid #1b1f4b;border-radius:14px;background:#fff;color:#1b1f4b;font-weight:700;cursor:pointer;transition:.2s}
.tips button.on{background:#3b4cca;color:#fff;transform:scale(1.05)}
.ppl{display:flex;align-items:center;justify-content:space-between;border:3px solid #1b1f4b;border-radius:14px;padding:10px 14px;font-size:20px}
.ppl div{display:flex;align-items:center;gap:18px}
.ppl button{width:48px;height:48px;border-radius:50%;border:0;background:#3b4cca;color:#fff;font-size:28px;cursor:pointer}
.ppl b{font-size:28px;min-width:30px;text-align:center}
.res{border:3px solid #1b1f4b;border-radius:14px;padding:18px;background:#f1f3ff;font-size:20px;line-height:2}
.res span{float:right;font-weight:800}
.big{font-size:24px;color:#2a8a4a}
nav{display:flex;border-top:1px solid #ddd}
nav div{flex:1;text-align:center;padding:12px;font-size:13px;color:#667}
nav .a{color:#3b4cca;font-weight:700}
</style>
</head>
<body>
<div class="phone">
<header>💵 Tip Calculator</header>
<main>
<div><label>Bill</label><div class="bill">$<input id="bill" type="number" inputmode="decimal" min="0" placeholder="0.00"></div></div>
<div><label>Tip</label><div class="tips" id="tips"><button data-t="10">10%</button><button data-t="15" class="on">15%</button><button data-t="20">20%</button></div></div>
<div><label>People</label><div class="ppl"><span>👥 People:</span><div><button id="m">−</button><b id="n">2</b><button id="p">+</button></div></div></div>
<div class="res"><div>Tip: <span id="tip">$0.00</span></div><div>Total: <span id="tot">$0.00</span></div><div class="big">Each pays: <span id="each">$0.00</span></div></div>
</main>
<nav><div class="a">🧮<br>Calculate</div><div>🍽️<br>Dinner</div></nav>
</div>
<script>
let pct=15,n=2;
const $=id=>document.getElementById(id);
function f(x){return "$"+x.toFixed(2)}
function calc(){
const b=parseFloat($("bill").value)||0;
const t=b*pct/100;
$("tip").textContent=f(t);
$("tot").textContent=f(b+t);
$("each").textContent=f((b+t)/n);
$("n").textContent=n;
}
$("tips").onclick=e=>{
const t=e.target.dataset.t;if(!t)return;
pct=+t;
[...$("tips").children].forEach(x=>x.classList.toggle("on",x===e.target));
calc();
};
$("m").onclick=()=>{if(n>1)n--;calc()};
$("p").onclick=()=>{if(n<50)n++;calc()};
$("bill").oninput=calc;
calc();
</script>
</body>
</html>
