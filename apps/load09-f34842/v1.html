<title>Tip Top Diner Shop</title>
<style>
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
input{-webkit-user-select:text;user-select:text}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0}
:root{--ink:#1b1b4b;--paper:#fbf8f1;--a:#ff6b4a;--b:#ffc533;--c:#2fb88a;--d:#5b5bd6;--r:18px}
body{font:16px system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#ffe9c9,transparent 40%),radial-gradient(circle at 100% 30%,#dfe0ff,transparent 40%),var(--paper);min-height:100dvh;overflow-x:hidden}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0;flex:1;letter-spacing:1px}
button{font:inherit;color:inherit;border:0;cursor:pointer;min-height:56px;border-radius:var(--r);transition:transform .12s,background .2s}
button:active{transform:scale(.94)}
.hb{min-height:44px;padding:0 14px;background:#ffffff22;color:#fff;font-weight:700}
main{display:grid;grid-template-columns:1fr;gap:18px;padding:18px;max-width:1100px;margin:auto}
@media(min-width:800px){main{grid-template-columns:1.4fr 1fr;align-items:start}aside{position:sticky;top:84px}}
h2{margin:0 0 12px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:12px;text-align:center;box-shadow:4px 4px 0 var(--ink);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.em{font-size:52px;line-height:1.2}
.nm{font-weight:700}.pr{color:var(--a);font-weight:800;margin:4px 0 8px}
.add{width:100%;background:var(--b);font-weight:800;min-height:56px}
aside{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dashed #d8d8ee}
.row .t{flex:1;font-weight:600}
.q{min-height:44px;width:44px;background:#eceaff;font-weight:900;font-size:20px;border-radius:12px}
.empty{padding:18px;text-align:center;opacity:.7}
label{font-weight:700;display:block;margin:12px 0 6px}
.bill{display:flex;align-items:center;border:3px solid var(--ink);border-radius:14px;padding:0 12px;font-size:22px;font-weight:700;min-height:56px}
.bill input{border:0;outline:0;font:inherit;color:inherit;width:100%;background:none;margin-left:6px}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tips button{border:3px solid var(--ink);background:#fff;font-weight:800;font-size:20px}
.tips button.on{background:var(--d);color:#fff}
.ppl{display:flex;align-items:center;justify-content:space-between;border:3px solid var(--ink);border-radius:14px;padding:4px 8px}
.ppl button{width:56px;background:var(--c);color:#fff;font-size:28px;font-weight:900}
.ppl b{font-size:24px}
.res{margin-top:14px;border:3px solid var(--ink);border-radius:14px;padding:12px;background:#fff7dc;font-weight:800;font-size:18px;line-height:1.8}
.res div{display:flex;justify-content:space-between}
.big{color:var(--a);font-size:22px}
.co{width:100%;margin-top:14px;background:var(--a);color:#fff;font-weight:900;font-size:20px}
.co:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:#1b1b4bcc;display:none;place-items:center;z-index:9;padding:20px}
.ov.s{display:grid}
.ty{background:#fff;border-radius:24px;padding:28px;text-align:center;max-width:380px;animation:pop .4s}
.ty .em{font-size:80px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.bump{animation:bp .3s}@keyframes bp{50%{transform:scale(1.4)}}
</style></head><body>
<header><h1>🍽️ TIP TOP DINER</h1><button class="hb" id="snd">🔇 Sound off</button><button class="hb" id="cc">🛒 <span id="cnt">0</span></button></header>
<main>
<section><h2>Menu</h2><div class="grid" id="grid"></div></section>
<aside id="side">
<h2>Your Order</h2>
<div id="list"></div>
<label>Bill: $</label>
<div class="bill">$<input id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
<label>Tip:</label>
<div class="tips" id="tips"></div>
<label>People:</label>
<div class="ppl"><button id="mi">−</button><b id="pp">2</b><button id="pl">+</button></div>
<div class="res">
<div><span>SUBTOTAL</span><span id="rs">$0.00</span></div>
<div><span>TIP</span><span id="rt">$0.00</span></div>
<div><span>TOTAL</span><span id="rtot">$0.00</span></div>
<div class="big"><span>EACH PAYS</span><span id="re">$0.00</span></div>
</div>
<button class="co" id="co" disabled>Checkout ✅</button>
</aside>
</main>
<div class="ov" id="ov"><div class="ty"><div class="em">🎉</div><h2>Thank you!</h2><p id="tm"></p><button class="co" id="ok">Order more</button></div></div>
<script>
const P=[["🍕","Pizza Slice",4.5],["🍔","Burger",8.25],["🌮","Taco",3.75],["🍜","Ramen",11],["🍩","Donut",2.25],["🧋","Boba Tea",5.5],["🥗","Salad",7.5],["🍰","Cake",6]];
let cart={},tip=15,ppl=2,mute=true,ac;
const $=i=>document.getElementById(i),m=n=>"$"+n.toFixed(2);
document.addEventListener("contextmenu",e=>e.preventDefault());
function beep(f,d=.1){if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="triangle";g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
$("snd").onclick=()=>{mute=!mute;$("snd").textContent=mute?"🔇 Sound off":"🔊 Sound on";beep(660)};
$("grid").innerHTML=P.map((p,i)=>`<div class="card"><div class="em">${p[0]}</div><div class="nm">${p[1]}</div><div class="pr">${m(p[2])}</div><button class="add" data-i="${i}">Add to cart</button></div>`).join("");
$("grid").onclick=e=>{const i=e.target.dataset.i;if(i==null)return;cart[i]=(cart[i]||0)+1;beep(700);setBill();draw();const c=$("cnt");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")};
$("tips").innerHTML=[10,15,20].map(t=>`<button data-t="${t}">${t}%</button>`).join("");
$("tips").onclick=e=>{const t=e.target.dataset.t;if(t){tip=+t;beep(520);calc()}};
$("mi").onclick=()=>{ppl=Math.max(1,ppl-1);beep(400);calc()};
$("pl").onclick=()=>{ppl=Math.min(20,ppl+1);beep(600);calc()};
$("bill").oninput=calc;
$("cc").onclick=()=>$("side").scrollIntoView({behavior:"smooth"});
const sub=()=>Object.keys(cart).reduce((s,i)=>s+P[i][2]*cart[i],0);
function setBill(){const s=sub();$("bill").value=s?s.toFixed(2):""}
$("list").onclick=e=>{const i=e.target.dataset.i,d=e.target.dataset.d;if(i==null)return;cart[i]+=+d;if(cart[i]<=0)delete cart[i];beep(450);setBill();draw()};
function draw(){const k=Object.keys(cart);
$("cnt").textContent=k.reduce((s,i)=>s+cart[i],0);
$("list").innerHTML=k.length?k.map(i=>`<div class="row"><span>${P[i][0]}</span><span class="t">${P[i][1]}<br><small>${m(P[i][2]*cart[i])}</small></span><button class="q" data-i="${i}" data-d="-1">−</button><b>${cart[i]}</b><button class="q" data-i="${i}" data-d="1">+</button><button class="q" data-i="${i}" data-d="-999">🗑️</button></div>`).join(""):'<div class="empty">🍴 Your cart is empty.<br>Add something tasty!</div>';
$("co").disabled=!k.length;calc()}
function calc(){const b=Math.max(0,parseFloat($("bill").value)||0),t=b*tip/100;
$("rs").textContent=m(b);$("rt").textContent=m(t);$("rtot").textContent=m(b+t);$("re").textContent=m((b+t)/ppl);$("pp").textContent=ppl;
[...$("tips").children].forEach(x=>x.classList.toggle("on",+x.dataset.t===tip))}
$("co").onclick=()=>{$("tm").textContent=`Your order of ${$("rtot").textContent} with a ${tip}% tip is on its way. Each of ${ppl} people pays ${$("re").textContent}.`;$("ov").classList.add("s");beep(800,.3);setTimeout(()=>beep(1000,.3),150)};
$("ok").onclick=()=>{cart={};setBill();draw();$("ov").classList.remove("s");beep(500)};
cart={0:1,5:2};setBill();draw();
</script></body></html>
