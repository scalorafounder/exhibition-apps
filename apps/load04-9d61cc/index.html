<title>Study Timer Garden</title>
<style>
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0;height:100dvh;overflow:hidden}
:root{--d:#141a3c;--l:#fbf7ee;--a:#ff7a59;--b:#4fd1c5;--c:#ffd166;--r:22px}
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--l);background:radial-gradient(circle at 20% 10%,#2b3578,transparent 50%),radial-gradient(circle at 90% 90%,#5b2a6e,transparent 50%),var(--d);display:flex;justify-content:center;align-items:center}
.app{width:min(94vw,440px);height:min(100dvh,820px);padding:16px;display:flex;flex-direction:column;gap:10px}

h1{font-size:24px;margin:0;letter-spacing:1px}
button{font:inherit;color:var(--d);border:0;border-radius:var(--r);min-height:56px;font-weight:800;font-size:18px;cursor:pointer;transition:transform .12s,filter .2s}
button:active{transform:scale(.94)}
#snd{min-height:44px;padding:0 14px;background:#ffffff22;color:var(--l);font-size:14px}
.modes{display:flex;gap:6px}
.modes button{flex:1;min-height:44px;background:#ffffff18;color:var(--l);font-size:14px}
.modes button.on{background:var(--c);color:var(--d)}
.stage{flex:1;position:relative;min-height:0;display:flex;justify-content:center;align-items:center}

#t{position:relative;font-size:min(22vw,92px);font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 4px 20px #0008;pointer-events:none;text-align:center}
#t small{display:block;font-size:15px;font-weight:600;opacity:.8;letter-spacing:2px}
.row{display:flex;gap:12px}
.row button{flex:1}
#go{background:var(--a)}#rs{background:var(--b)}

</style></head><body>
<div class="app" id="app">
<header><h1>🌱 STUDY TIMER</h1><button id="snd">🔇 Sound off</button></header>
<div class="modes" id="m"><button class="on" data-m="25">Focus 25</button><button data-m="5">Break 5</button><button data-m="15">Long 15</button></div>
<div class="stage"><canvas id="c"></canvas><div id="t">25:00<small id="st">READY TO GROW</small></div></div>
<div class="row"><button id="go">START</button><button id="rs">RESET</button></div>
<div id="ss">Sessions done: 0</div>
</div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');

function burst(px,py,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*200;ps.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:1,c:['#ff7a59','#4fd1c5','#ffd166','#fff'][i%4]})}}

$('snd').onclick=()=>{snd=!snd;$('snd').textContent=snd?'🔊 Sound on':'🔇 Sound off';beep(880)};
$('m').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('m').children].forEach(k=>k.classList.remove('on'));b.classList.add('on');mins=+b.dataset.m;tot=left=mins*60;run=false;beep(520);ui()};

addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('go').click()}if(e.key==='r')$('rs').click()});

</script></body></html>
