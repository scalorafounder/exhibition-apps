<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tip Calculator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e8ecf6;font-family:system-ui,sans-serif;color:#1d2050}
.phone{width:100%;max-width:420px;min-height:100vh;background:#fff;display:flex;flex-direction:column}
@media(min-width:500px){.phone{min-height:0;height:760px;border-radius:32px;box-shadow:0 20px 50px #1d205044;overflow:hidden;border:8px solid #1d2050}}
header{background:#3a46c4;color:#fff;padding:20px;font-size:22px;font-weight:800;letter-spacing:1px;text-align:center}
main{flex:1;padding:18px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.card{border:2px solid #1d2050;border-radius:16px;padding:14px}
label{font-weight:700;display:block;margin-bottom:6px}
.bill{display:flex;align-items:center;font-size:30px;font-weight:700;gap:6px}
.bill input{flex:1;min-width:0;font-size:30px;border:none;border-bottom:3px solid #3a46c4;outline:none;padding:4px;color:#1d2050;background:transparent}
.tips{display:flex;gap:10px}
.tips button{flex:1;padding:18px 0;font-size:22px;font-weight:700;border:2px solid #1d2050;border-radius:14px;background:#fff;color:#1d2050;transition:.2s}
.tips button.on{background:#3a46c4;color:#fff;transform:scale(1.05)}
.ppl{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:700}
.ppl div{display:flex;align-items:center;gap:18px}
.ppl button{width:54px;height:54px;border-radius:50%;border:none;background:#3a46c4;color:#fff;font-size:28px}
.ppl button:active{transform:scale(.9)}
.ppl span.n{font-size:30px;min-width:34px;text-align:center}
.res{background:#eef0ff;font-size:20px;font-weight:800;line-height:2}
.res b{float:right;color:#3a46c4;font-size:26px}
nav{display:flex;border-top:1px solid #ccd}
nav div{flex:1;text-align:center;padding:12px;font-size:13px;color:#667}
nav div.a{color:#3a46c4;font-weight:800}
</style>
</head>
<body>
<div class="phone">
<header>💸 TIP CALCULATOR</header>
<main>
<div class="card"><label for="bill">Bill</label><div class="bill">$<input id="bill" type="number" inputmode="decimal" min="0" placeholder="0.00" value="48.50"></div></div>
<div><label>Tip:</label><div class="tips"><button data-p="10">10%</button><button data-p="15" class="on">15%</button><button data-p="20">20%</button></div></div>
<div class="card ppl"><span>People:</span><div><button id="m">−</button><span class="n" id="n">2</span><button id="p">+</button></div></div>
<div class="card res">TIP: <b id="tip">$0.00</b><br>TOTAL: <b id="tot">$0.00</b><br>EACH PAYS: <b id="each">$0.00</b></div>
</main>
<nav><div class="a">🧮<br>Calculator</div><div>👥<br>Split</div><div>⚙️<br>Settings</div></nav>
</div>
<script>
let pct=15,ppl=2;
const $=id=>document.getElementById(id);
function calc(){
const b=Math.max(0,parseFloat($('bill').value)||0);
const t=b*pct/100;
$('tip').textContent='$'+t.toFixed(2);
$('tot').textContent='$'+(b+t).toFixed(2);
$('each').textContent='$'+((b+t)/ppl).toFixed(2);
$('n').textContent=ppl;
}
document.querySelectorAll('.tips button').forEach(x=>x.onclick=()=>{
document.querySelectorAll('.tips button').forEach(y=>y.classList.remove('on'));
x.classList.add('on');pct=+x.dataset.p;calc();});
$('m').onclick=()=>{if(ppl>1)ppl--;calc()};
$('p').onclick=()=>{if(ppl<50)ppl++;calc()};
$('bill').oninput=calc;
calc();
</script>
</body>
</html>
