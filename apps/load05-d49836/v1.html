<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#faf7f0 repeating-linear-gradient(#faf7f0 0 33px,#dde2f3 33px 35px);font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;color:#1a1a5e;padding:16px}
.card{width:100%;max-width:460px;min-height:520px;background:#fffdf8;border:3px solid #222;border-radius:6px;padding:22px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #1a1a5e22}
h1{text-align:center;font-size:1.7rem;margin:0 0 18px;letter-spacing:1px}
form{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px;border:3px solid #222;border-radius:4px;background:#fff;color:#1a1a5e}
button{font:inherit;cursor:pointer}
.add{border:3px solid #222;background:#ffe27a;color:#1a1a5e;font-size:1.1rem;padding:0 16px;border-radius:4px;min-height:48px}
.add:active{transform:scale(.95)}
ul{list-style:none;padding:0;margin:20px 0;flex:1}
li{display:flex;align-items:center;gap:14px;padding:10px 0;font-size:1.3rem}
.box{width:40px;height:40px;flex:none;border:3px solid #222;background:#fff;border-radius:4px;font-size:1.5rem;line-height:1;color:#2a9d4a}
.t{flex:1;word-break:break-word}
li.done .t{text-decoration:line-through;opacity:.5}
.x{width:44px;height:44px;border:none;background:none;font-size:1.8rem;color:#222}
.x:hover{color:#d33}
.count{font-size:1.1rem}
.empty{text-align:center;opacity:.6;margin-top:40px}
</style>
</head>
<body>
<div class="card">
<h1>MY TO-DO LIST</h1>
<form id="f"><input type="text" id="in" placeholder="add a task..." maxlength="80" autocomplete="off"><button class="add" type="submit">ADD</button></form>
<ul id="list"></ul>
<div class="count" id="count"></div>
</div>
<script>
let tasks=[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
const list=document.getElementById("list"),cnt=document.getElementById("count"),inp=document.getElementById("in");
function render(){
list.innerHTML="";
if(!tasks.length){list.innerHTML='<div class="empty">🎉 All clear! Add a task above.</div>'}
tasks.forEach((k,i)=>{
const li=document.createElement("li");if(k.d)li.className="done";
const b=document.createElement("button");b.className="box";b.textContent=k.d?"✔":"";b.setAttribute("aria-label","toggle");
b.onclick=()=>{k.d=!k.d;render()};
const s=document.createElement("span");s.className="t";s.textContent=k.t;
const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","delete");
x.onclick=()=>{tasks.splice(i,1);render()};
li.append(b,s,x);list.appendChild(li);
});
const n=tasks.filter(k=>!k.d).length;
cnt.textContent=n+(n===1?" task left":" tasks left");
}
document.getElementById("f").onsubmit=e=>{
e.preventDefault();
const v=inp.value.trim();
if(!v)return;
tasks.push({t:v,d:false});inp.value="";render();inp.focus();
};
render();
</script>
</body>
</html>
