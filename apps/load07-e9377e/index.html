<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tip Calculator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e8ecf5;font-family:system-ui,sans-serif;color:#1c2340}
.phone{width:100%;max-width:420px;min-height:100vh;background:#faf8f3;display:flex;flex-direction:column;box-shadow:0 10px 40px #0003}
@media(min-height:800px) and (min-width:500px){.phone{min-height:780px;height:780px;border-radius:32px;overflow:hidden}}
header{background:#3b4a9c;color:#fff;padding:18px;font-size:22px;font-weight:700;text-align:center;letter-spacing:1px}
main{flex:1;padding:18px;overflow:auto}
.card{background:#fff;border:2px solid #1c2340;border-radius:16px;padding:14px;margin-bottom:16px}
label{font-weight:600;display:block;margin-bottom:8px}
.bill{display:flex;align-items:center;font-size:28px;gap:8px}
.bill input{flex:1;min-width:0;font-size:28px;border:none;border-bottom:3px solid #3b4a9c;background:none;padding:6px;outline:none;color:#1c2340}
.tips{display:flex;gap:10px}
.tips button{flex:1;padding:18px 0;font-size:22px;border:2px solid #1c2340;border-radius:14px;background:#fff;color:#1c2340;font-weight:600;transition:.2s}
.tips button.on{background:#3b4a9c;color:#fff;transform:scale(1.04)}
.ppl{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:600}
.ppl div{display:flex;align-items:center;gap:18px}
.ppl button{width:56px;height:56px;border-radius:50%;border:2px solid #1c2340;background:#fff;font-size:28px;color:#1c2340}
.ppl span.n{font-size:32px;min-width:36px;text-align:center}
.res{background:#3b4a9c;color:#fff}
.res p{margin:8px 0;font-size:20px;display:flex;justify-content:space-between}
.res b{font-size:26px}
nav{display:flex;border-top:1px solid #ccd;background:#fff}
nav div{flex:1;text-align:center;padding:10px;font-size:12px;color:#889}
nav div.a{color:#3b4a9c;font-weight:700}
nav span{display:block;font-size:22px}
</style>
</head>
<body>
<div class="phone">
<header>💸 TIP CALCULATOR</header>
<main>
<div class="card"><label>Bill</label><div class="bill">$<input id="bill" type="number" inputmode="decimal" min="0" placeholder="0.00" value="48.50"></div></div>
<div class="card"><label>Tip:</label><div class="tips" id="tips"><button data-p="10">10%</button><button data-p="15" class="on">15%</button><button data-p="20">20%</button></div></div>
<div class="card ppl"><span>People:</span><div><button id="m">−</button><span class="n" id="n">2</span><button id="p">+</button></div></div>
<div class="card res"><p>TIP: <b id="tip">$0.00</b></p><p>TOTAL: <b id="tot">$0.00</b></p><p>EACH PAYS: <b id="each">$0.00</b></p></div>
</main>
<nav><div class="a"><span>🧮</span>Calculate</div><div><span>🍽️</span>Dinner</div><div><span>😊</span>Enjoy</div></nav>
</div>
<script>
let pct=15,ppl=2;
const $=id=>document.getElementById(id);
const f=x=>"$"+x.toFixed(2);
function up(){
const b=Math.max(0,parseFloat($("bill").value)||0);
const t=b*pct/100;
$("tip").textContent=f(t);$("tot").textContent=f(b+t);$("each").textContent=f((b+t)/ppl);
$("n").textContent=ppl;
}
$("bill").oninput=up;
$("tips").onclick=e=>{const p=e.target.dataset.p;if(!p)return;pct=+p;[...$("tips").children].forEach(x=>x.classList.toggle("on",x===e.target));up()};
$("m").onclick=()=>{if(ppl>1)ppl--;up()};
$("p").onclick=()=>{if(ppl<50)ppl++;up()};
up();
</script>
</body>
</html>
