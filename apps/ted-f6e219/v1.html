<title>Palm Catcher</title>
<style>
:root{--a:#ffb703;--b:#8e5bd6;--c:#ff6b6b;--d:#1b1230;--l:#fff4e6;--r:18px}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0;height:100dvh;overflow:hidden;background:linear-gradient(160deg,#1b1230,#3a1f6b);font-family:system-ui,sans-serif;color:var(--l)}
#app{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:auto}
#hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:700;font-size:18px}
#hud button{min-height:44px;min-width:56px;border-radius:var(--r);border:0;background:var(--b);color:var(--l);font-size:18px}
#wrap{position:relative;flex:1;min-height:0}
canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:var(--r)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(27,18,48,.82);border-radius:var(--r);text-align:center;padding:20px}
.ov h1{font-size:clamp(32px,8vw,56px);margin:0;color:var(--a)}
.ov p{margin:0;font-size:18px}
.big{min-height:64px;padding:0 40px;font-size:24px;font-weight:800;border:0;border-radius:var(--r);background:var(--a);color:var(--d);transition:transform .1s;box-shadow:0 6px 0 #b37d00}
.big:active,#ctl button:active{transform:scale(.93)}
#ctl{display:flex;gap:12px;padding:12px}
#ctl button{flex:1;min-height:72px;font-size:34px;border:0;border-radius:var(--r);background:var(--b);color:var(--l);touch-action:none;transition:transform .1s;box-shadow:0 5px 0 #5a3590}
.hide{display:none}
</style></head><body>
<div id="app">
<div id="hud"><span>⭐ <b id="s">0</b></span><span id="lv">❤️❤️❤️</span><span>Best <b id="bs">0</b></span><button id="snd">🔇</button></div>
<div id="wrap"><canvas id="c"></canvas>
<div class="ov" id="t"><h1>🖐️ Palm Catcher</h1><p>Slide your hand to catch the falling stars ⭐<br>Dodge the 💣 bombs!</p><p>Keys: ← → or A D</p><button class="big" id="p1">Play</button></div>
<div class="ov hide" id="g"><h1>Game Over</h1><p>Score: <b id="fs">0</b></p><p>Best: <b id="fb">0</b></p><button class="big" id="p2">Play again</button></div>
</div>
<div id="ctl"><button id="bl">◀</button><button id="br">▶</button></div>
</div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');

function rs(){D=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;if(px==null)px=W/2}

$('p1').onclick=start;$('p2').onclick=start;
function burst(a,b,col,n=14){for(let i=0;i<n;i++){const an=Math.random()*6.28,sp=60+Math.random()*200;parts.push({x:a,y:b,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,l:.6,c:col})}}

addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k=='arrowleft'||k=='a')held.l=0;if(k=='arrowright'||k=='d')held.r=0});
const clr=()=>{held.l=held.r=0};addEventListener('blur',clr);document.addEventListener('visibilitychange',()=>{if(document.hidden)clr()});

items=items.filter(i=>!i.d);

x.font='40px serif';items.forEach(i=>{x.save();x.translate(i.x,i.y);x.rotate(Math.sin(i.r)*.4);x.fillText(i.b?'💣':'⭐',0,0);x.restore()});

x.font='bold 24px system-ui';x.fillStyle='#fff4e6';pops.forEach(p=>{x.globalAlpha=Math.min(1,p.l*2);x.fillText('+1',p.x,p.y-20)});x.globalAlpha=1;

</script></body></html>
