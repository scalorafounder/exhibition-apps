<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;background-image:repeating-linear-gradient(#faf7f0 0 31px,#d9dff2 32px);font-family:"Comic Sans MS","Segoe Print",cursive;color:#1a1a5e}
.card{width:min(94vw,460px);min-height:560px;background:#fffdf8;border:4px solid #222;border-radius:6px;padding:18px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #1a1a5e55}
h1{margin:4px 0 12px;text-align:center;font-size:28px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px;border:3px solid #222;border-radius:4px;color:#1a1a5e}
button{font:inherit;cursor:pointer}
#add{border:3px solid #222;background:#ffe27a;font-size:18px;padding:0 14px;min-height:48px;border-radius:4px;color:#1a1a5e}
#bar{height:14px;border:2px solid #222;border-radius:8px;margin:12px 0 4px;overflow:hidden;background:#fff}
#fill{height:100%;width:0;background:#4caf50;transition:width .3s}
#score{display:flex;justify-content:space-between;font-size:15px}
ul{list-style:none;padding:0;margin:8px 0;flex:1}
li{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:22px;animation:pop .25s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.box{width:42px;height:42px;border:3px solid #222;background:#fff;border-radius:4px;font-size:26px;line-height:1;flex:none}
.t{flex:1;word-break:break-word}
.done .t{text-decoration:line-through;opacity:.5}
.x{background:none;border:none;font-size:30px;width:44px;height:44px;color:#222}
#left{font-size:20px;margin-top:6px}
#msg{text-align:center;font-size:20px;min-height:28px;margin:4px 0}
#restart{margin-top:8px;padding:10px;border:3px solid #222;background:#cfe8ff;border-radius:4px;font-size:16px;color:#1a1a5e}
</style>
</head>
<body>
<div class="card">
<h1>MY TO-DO LIST</h1>
<form class="row" id="f"><input id="in" placeholder="add a task..." maxlength="40" autocomplete="off"><button id="add" type="submit">ADD</button></form>
<div id="bar"><div id="fill"></div></div>
<div id="score"><span>⭐ Score: <b id="sc">0</b></span><span>🔥 Streak: <b id="st">0</b></span></div>
<ul id="list"></ul>
<div id="msg"></div>
<div id="left"></div>
<button id="restart">🔄 Restart</button>
</div>
<script>
let tasks,id,score,streak,total;
const $=s=>document.getElementById(s);
const praise=["Nice! 🎉","Boom! 💥","Crushed it! 💪","Awesome! 🌟","Yes! 🚀"];
function init(){
 tasks=[{i:1,t:"buy milk",d:false},{i:2,t:"math homework",d:false},{i:3,t:"call grandma",d:false}];
 id=4;score=0;streak=0;total=3;
 $("msg").textContent="Check off all tasks to win!";
 render();
}
function render(){
 const l=$("list");l.innerHTML="";
 tasks.forEach(k=>{
  const li=document.createElement("li");if(k.d)li.className="done";
  const b=document.createElement("button");b.className="box";b.textContent=k.d?"✅":"";
  b.setAttribute("aria-label","toggle "+k.t);
  b.onclick=()=>toggle(k.i);
  const s=document.createElement("span");s.className="t";s.textContent=k.t;
  const x=document.createElement("button");x.className="x";x.textContent="✕";
  x.setAttribute("aria-label","delete "+k.t);
  x.onclick=()=>{tasks=tasks.filter(z=>z.i!==k.i);if(!k.d)streak=0;render()};
  li.append(b,s,x);l.appendChild(li);
 });
 const n=tasks.filter(k=>!k.d).length;
 $("left").textContent=n+(n===1?" task left":" tasks left");
 $("sc").textContent=score;$("st").textContent=streak;
 const dn=tasks.filter(k=>k.d).length;
 $("fill").style.width=(tasks.length?dn/tasks.length*100:0)+"%";
 if(tasks.length&&n===0)$("msg").textContent="🏆 YOU WIN! All done! Bonus +"+(tasks.length*5);
 else if(!tasks.length)$("msg").textContent="Empty list! Add a task 📝";
}
function toggle(i){
 const k=tasks.find(z=>z.i===i);
 const was=tasks.length&&tasks.every(z=>z.d);
 k.d=!k.d;
 if(k.d){streak++;score+=10+streak*2;$("msg").textContent=praise[Math.floor(Math.random()*praise.length)];}
 else{streak=0;score=Math.max(0,score-10);$("msg").textContent="Back on the list 🤔";}
 if(tasks.every(z=>z.d))score+=tasks.length*5;
 render();
}
$("f").onsubmit=e=>{
 e.preventDefault();
 const v=$("in").value.trim();
 if(!v){$("msg").textContent="Type a task first ✍️";return}
 tasks.push({i:id++,t:v,d:false});$("in").value="";
 $("msg").textContent="Added! Now do it 😎";render();
};
$("restart").onclick=init;
init();
</script>
</body>
</html>
