<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tic Tac Toe Game Store</title>
<style>
body{margin:0;font-family:"Comic Sans MS",cursive,sans-serif;background:#faf7f0;color:#1a1a5e;background-image:repeating-linear-gradient(#faf7f0 0 28px,#dfe3f3 29px)}
header{text-align:center;padding:14px}
h1{margin:0;letter-spacing:3px}
.wrap{display:flex;flex-wrap:wrap;gap:16px;max-width:1000px;margin:auto;padding:10px}
.grid{flex:2 1 340px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.card{background:#fff;border:3px solid #222;border-radius:8px;padding:10px;text-align:center}
.pic{font-size:52px}
.card b{display:block}
button{font:inherit;color:#1a1a5e;background:#fff;border:3px solid #222;border-radius:6px;padding:10px 12px;min-height:44px;cursor:pointer}
button:active{background:#dfe3f3}
.cart{flex:1 1 260px;background:#fff;border:3px solid #222;border-radius:8px;padding:12px;align-self:start}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 0;border-bottom:1px dashed #99a}
.row button{padding:2px 10px;min-height:34px}
.total{font-size:20px;font-weight:bold;margin:10px 0}
#msg{color:#1a7a3a;font-weight:bold;margin-top:8px}
</style>
</head>
<body>
<header><h1>TIC TAC TOE STORE</h1><div>Everything for game night ✏️</div></header>
<div class="wrap">
<div class="grid" id="grid"></div>
<div class="cart">
<h2 style="margin-top:0">🛒 Cart (<span id="cnt">0</span>)</h2>
<div id="list"></div>
<div class="total">Total: $<span id="tot">0.00</span></div>
<button id="co" style="width:100%">Checkout</button>
<div id="msg"></div>
</div>
</div>
<script>
const P=[
{n:"Classic X Stamp",e:"❌",p:4.5},
{n:"Round O Stamp",e:"⭕",p:4.5},
{n:"Wooden Game Board",e:"🟫",p:12},
{n:"Marker Pen",e:"🖊️",p:2.25},
{n:"Lined Notebook",e:"📓",p:5},
{n:"Winner Trophy",e:"🏆",p:9.99},
{n:"Gold Star Pack",e:"⭐",p:3},
{n:"Pocket Dice",e:"🎲",p:3.75}];
const cart={};
const $=i=>document.getElementById(i);
$("grid").innerHTML=P.map((x,i)=>`<div class="card"><div class="pic">${x.e}</div><b>${x.n}</b>$${x.p.toFixed(2)}<br><br><button onclick="add(${i})">Add to cart</button></div>`).join("");
function add(i){cart[i]=(cart[i]||0)+1;$("msg").textContent="";draw()}
function chg(i,d){cart[i]+=d;if(cart[i]<=0)delete cart[i];draw()}
function draw(){
let c=0,t=0,h="";
for(const i in cart){const q=cart[i],x=P[i];c+=q;t+=q*x.p;
h+=`<div class="row"><span>${x.e} ${x.n}<br>$${(q*x.p).toFixed(2)}</span><span><button onclick="chg(${i},-1)">−</button> ${q} <button onclick="chg(${i},1)">+</button> <button onclick="chg(${i},-cart[${i}])">🗑️</button></span></div>`}
$("list").innerHTML=h||"<p>Your cart is empty.</p>";
$("cnt").textContent=c;$("tot").textContent=t.toFixed(2)}
$("co").onclick=()=>{
if(!Object.keys(cart).length){$("msg").textContent="Add something first!";return}
for(const k in cart)delete cart[k];draw();
$("msg").textContent="🎉 Thank you for your order!"};
draw();
</script>
</body>
</html>
