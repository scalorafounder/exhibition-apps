<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do List</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef3fb;font-family:"Segoe Print","Comic Sans MS",cursive,sans-serif;color:#1a1a5e}
.card{width:min(94vw,440px);min-height:520px;background:#fff;border:3px solid #222;border-radius:6px;padding:22px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #c9d6ee}
h1{margin:0 0 16px;text-align:center;font-size:1.7rem;letter-spacing:1px}
form{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;padding:12px;font:inherit;font-size:1.05rem;border:3px solid #222;border-radius:4px;color:#1a1a5e}
button.add{padding:0 16px;font:inherit;font-size:1.1rem;border:3px solid #222;background:#dfe8ff;color:#1a1a5e;border-radius:4px;cursor:pointer;min-height:48px}
button.add:active{background:#c3d3ff}
ul{list-style:none;margin:18px 0;padding:0;flex:1}
li{display:flex;align-items:center;gap:14px;padding:10px 0;font-size:1.25rem}
.box{width:34px;height:34px;flex:none;border:3px solid #222;border-radius:4px;background:#fff;cursor:pointer;font-size:1.4rem;line-height:1;color:#2a9d4a;padding:0}
.t{flex:1;word-break:break-word}
li.done .t{text-decoration:line-through;opacity:.5}
.x{flex:none;width:44px;height:44px;border:none;background:none;font-size:1.8rem;cursor:pointer;color:#222}
.x:hover{color:#d33}
.empty{opacity:.6;text-align:center;padding:30px 0}
.foot{font-size:1.1rem}
</style>
</head>
<body>
<div class="card">
<h1>MY TO-DO LIST</h1>
<form id="f"><input type="text" id="in" placeholder="add a task..." maxlength="60" autocomplete="off"><button class="add" type="submit">ADD</button></form>
<ul id="list"></ul>
<div class="foot" id="count"></div>
</div>
<script>
let tasks=[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
const list=document.getElementById("list"),count=document.getElementById("count"),inp=document.getElementById("in");
function render(){
list.innerHTML="";
if(!tasks.length){list.innerHTML='<div class="empty">All done! 🎉</div>'}
tasks.forEach((k,i)=>{
const li=document.createElement("li");if(k.d)li.className="done";
const b=document.createElement("button");b.className="box";b.textContent=k.d?"✓":"";b.setAttribute("aria-label","toggle");
b.onclick=()=>{k.d=!k.d;render()};
const s=document.createElement("span");s.className="t";s.textContent=k.t;
const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","delete");
x.onclick=()=>{tasks.splice(i,1);render()};
li.append(b,s,x);list.append(li);
});
const n=tasks.filter(k=>!k.d).length;
count.textContent=n+" task"+(n==1?"":"s")+" left";
}
document.getElementById("f").onsubmit=e=>{
e.preventDefault();
const v=inp.value.trim();
if(!v)return;
tasks.push({t:v,d:false});inp.value="";render();inp.focus();
};
render();
</script>
</body>
</html>
