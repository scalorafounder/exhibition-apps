<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Timer</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;font-family:"Segoe Print","Comic Sans MS",cursive,sans-serif;color:#1a1a5e}
  .card{width:min(92vw,380px);border:3px solid #222;border-radius:14px;padding:24px 20px;background:#fffdf7;text-align:center;box-shadow:6px 6px 0 #d9dcf0}
  h1{margin:0 0 18px;font-size:1.8rem;letter-spacing:2px}
  .ring{position:relative;width:260px;height:260px;max-width:75vw;max-height:75vw;margin:0 auto 22px}
  svg{width:100%;height:100%;transform:rotate(-90deg)}
  .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.2rem;font-weight:bold}
  .btns{display:flex;gap:12px}
  button{flex:1;padding:16px 8px;font:inherit;font-size:1.2rem;color:#1a1a5e;background:#fff;border:3px solid #222;border-radius:8px;cursor:pointer;min-height:56px}
  button:active{transform:scale(.96)}
  #start.run{background:#ffe9a8}
  p{margin:20px 0 0;font-size:1.2rem}
  #msg{min-height:1.4em;margin-top:8px;color:#2a8a4a;font-size:1rem}
</style>
</head>
<body>
<div class="card">
  <h1>STUDY TIMER</h1>
  <div class="ring">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#e3e5f5" stroke-width="4"/>
      <circle id="prog" cx="50" cy="50" r="46" fill="none" stroke="#1a1a5e" stroke-width="4" stroke-linecap="round" stroke-dasharray="289.03" stroke-dashoffset="0"/>
    </svg>
    <div class="time" id="time">25:00</div>
  </div>
  <div class="btns">
    <button id="start">START</button>
    <button id="reset">RESET</button>
  </div>
  <p>Sessions done: <span id="count">0</span></p>
  <div id="msg"></div>
</div>
<script>
  const TOTAL=25*60;
  let left=TOTAL,timer=null,sessions=0;
  const $=id=>document.getElementById(id);
  function render(){
    const m=String(Math.floor(left/60)).padStart(2,"0"),s=String(left%60).padStart(2,"0");
    $("time").textContent=m+":"+s;
    $("prog").style.strokeDashoffset=289.03*(1-left/TOTAL);
    document.title=m+":"+s+" - Study Timer";
  }
  function stop(){clearInterval(timer);timer=null;$("start").textContent="START";$("start").classList.remove("run")}
  function tick(){
    left--;
    if(left<=0){
      left=0;stop();sessions++;
      $("count").textContent=sessions;
      $("msg").textContent="🎉 Great job! Session complete.";
      render();
      setTimeout(()=>{left=TOTAL;render()},1500);
      return;
    }
    render();
  }
  $("start").onclick=()=>{
    if(timer){stop();$("start").textContent="RESUME";return}
    $("msg").textContent="";
    timer=setInterval(tick,1000);
    $("start").textContent="PAUSE";
    $("start").classList.add("run");
  };
  $("reset").onclick=()=>{stop();left=TOTAL;$("msg").textContent="";render()};
  render();
</script>
</body>
</html>
