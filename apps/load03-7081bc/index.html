<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tic Tac Toe</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#faf7f0;background-image:repeating-linear-gradient(#faf7f0 0 35px,#dde2f3 36px);font-family:"Comic Sans MS",cursive,sans-serif;color:#1a1a5e}
h1{font-size:clamp(28px,7vw,48px);margin:10px}
#board{display:grid;grid-template-columns:repeat(3,1fr);width:min(88vw,380px);aspect-ratio:1}
.c{background:none;border:none;font:inherit;font-size:clamp(48px,16vw,100px);color:#1a1a5e;cursor:pointer;border-right:5px solid #222;border-bottom:5px solid #222;padding:0}
.c:nth-child(3n){border-right:none}
.c:nth-child(n+7){border-bottom:none}
.c.w{background:#ffe99a}
.bar{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.bar div,.bar button{border:3px solid #222;background:none;font:inherit;font-size:20px;padding:12px 18px;color:#1a1a5e}
.bar button{cursor:pointer}
.bar button:active{background:#dde2f3}
</style>
</head>
<body>
<h1>TIC TAC TOE</h1>
<div id="board"></div>
<div class="bar"><div id="st">Your turn: X</div><button id="re">RESTART</button></div>
<script>
const b=document.getElementById('board'),st=document.getElementById('st');
let g,t,over;
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const cells=[];
for(let i=0;i<9;i++){const c=document.createElement('button');c.className='c';c.onclick=()=>play(i);b.appendChild(c);cells.push(c)}
function reset(){g=Array(9).fill('');t='X';over=false;cells.forEach(c=>{c.textContent='';c.classList.remove('w')});st.textContent='Your turn: X'}
function play(i){
if(over||g[i])return;
g[i]=t;cells[i].textContent=t;
const w=L.find(l=>l.every(k=>g[k]===t));
if(w){over=true;w.forEach(k=>cells[k].classList.add('w'));st.textContent='🎉 '+t+' wins!';return}
if(g.every(x=>x)){over=true;st.textContent="It's a tie! 🤝";return}
t=t==='X'?'O':'X';st.textContent='Your turn: '+t;
}
document.getElementById('re').onclick=reset;
reset();
// sample start like the drawing
play(0);play(4);
</script>
</body>
</html>
