<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#add8f7;font-family:"Comic Sans MS","Segoe Print",cursive;color:#1a1a5e}
.app{width:min(420px,94vw);background:#fff;border:3px solid #222;border-radius:6px;padding:18px;box-shadow:6px 6px 0 #1a1a5e33}
h1{margin:0 0 12px;text-align:center;font-size:26px;letter-spacing:1px}
.add{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px;border:3px solid #222;border-radius:4px;color:#1a1a5e}
button{font:inherit;cursor:pointer}
#add{font-size:18px;padding:10px 14px;border:3px solid #222;background:#3fbf5f;color:#fff;font-weight:bold;border-radius:4px}
#add:active{transform:scale(.95)}
.bar{height:14px;border:2px solid #222;border-radius:8px;margin:14px 0 4px;overflow:hidden}
#fill{height:100%;width:0;background:#4cc36b;transition:width .4s}
#msg{text-align:center;min-height:24px;font-size:15px;margin-bottom:4px}
ul{list-style:none;padding:0;margin:8px 0;min-height:150px}
li{display:flex;align-items:center;gap:12px;padding:8px 4px;font-size:21px;animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.box{width:36px;height:36px;border:3px solid #222;background:#fff;border-radius:4px;font-size:24px;line-height:1;flex:none;color:#2a9d4b}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;opacity:.5}
.x{background:none;border:none;font-size:28px;width:44px;height:44px;color:#222}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:18px}
#reset{border:2px solid #222;background:#fff;border-radius:4px;padding:6px 10px;color:#1a1a5e}
.win{animation:bounce .6s 3}
@keyframes bounce{50%{transform:scale(1.05) rotate(-1deg)}}
</style>
</head>
<body>
<div class="app" id="app">
<h1>MY TO-DO LIST</h1>
<form class="add" id="f"><input type="text" id="t" placeholder="add a task..." maxlength="40" autocomplete="off"><button id="add">ADD</button></form>
<div class="bar"><div id="fill"></div></div>
<div id="msg"></div>
<ul id="list"></ul>
<div class="foot"><span id="left"></span><span>⭐ <b id="score">0</b></span><button id="reset">Restart</button></div>
</div>
<script>
const start=()=>[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
let tasks=start(),score=0,combo=0;
const $=id=>document.getElementById(id);
const praise=["Nice! 🎉","Crushed it! 💪","Boom! 💥","Awesome! 🌟","Keep going! 🚀"];
function render(){
  const l=$("list");l.innerHTML="";
  tasks.forEach((k,i)=>{
    const li=document.createElement("li");if(k.d)li.className="done";
    const b=document.createElement("button");b.className="box";b.textContent=k.d?"✔":"";
    b.onclick=()=>{k.d=!k.d;if(k.d){combo++;score+=10*combo;$("msg").textContent=praise[Math.floor(Math.random()*praise.length)]+" x"+combo+" combo";}else{score=Math.max(0,score-10);combo=0;}render();};
    const s=document.createElement("span");s.textContent=k.t;
    const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","delete");
    x.onclick=()=>{tasks.splice(i,1);render();};
    li.append(b,s,x);l.append(li);
  });
  const left=tasks.filter(k=>!k.d).length,done=tasks.length-left;
  $("left").textContent=left+" task"+(left==1?"":"s")+" left";
  $("score").textContent=score;
  $("fill").style.width=tasks.length?done/tasks.length*100+"%":"0";
  $("app").classList.remove("win");
  if(tasks.length&&!left){$("msg").textContent="🏆 YOU WIN! All tasks done! Score "+score;void $("app").offsetWidth;$("app").classList.add("win");}
  else if(!tasks.length)$("msg").textContent="Empty list — add a task to play!";
}
$("f").onsubmit=e=>{e.preventDefault();const v=$("t").value.trim();if(!v)return;tasks.push({t:v,d:false});$("t").value="";$("msg").textContent="New quest added ✨";render();};
$("reset").onclick=()=>{tasks=start();score=0;combo=0;$("msg").textContent="Fresh start! Check off tasks to score.";render();};
$("msg").textContent="Check off tasks to build combos!";
render();
</script>
</body>
</html>
