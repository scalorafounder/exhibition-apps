<style>
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
input{-webkit-user-select:text;user-select:text}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0;height:100%;overflow:hidden}
:root{--ink:#1b1b5e;--bg:#faf6ee;--a:#4f5bd5;--b:#ff7a59;--c:#2bb673;--d:#ffd166;--card:#fff;--r:18px}
body{font:16px/1.4 "Segoe Print","Bradley Hand","Comic Sans MS",system-ui,sans-serif;color:var(--ink);background:repeating-linear-gradient(#faf6ee 0 35px,#dfe3f5 35px 36px);display:flex;align-items:center;justify-content:center}
#ph{width:min(100vw,440px);height:100dvh;max-height:860px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 10px 40px #1b1b5e33;border-radius:0}
@media(min-width:600px){#ph{height:min(100dvh - 30px,820px);border-radius:32px;border:3px solid var(--ink)}}
header{padding:18px 18px 14px;background:linear-gradient(135deg,var(--a),#7b5cd6);color:#fff;display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px;letter-spacing:1px}
#snd{background:#ffffff33;border:0;color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px}
main{flex:1;overflow:hidden;position:relative}
.scr{position:absolute;inset:0;padding:16px;overflow-y:auto;transition:transform .35s,opacity .35s}
.scr.off{transform:translateX(40px);opacity:0;pointer-events:none}
form{display:flex;gap:10px;margin-bottom:14px}
input{flex:1;min-width:0;height:58px;border:3px solid var(--ink);border-radius:var(--r);padding:0 14px;font:inherit;background:#fff;color:var(--ink)}
input:focus{outline:3px solid var(--d)}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s,background .2s}
button:active{transform:scale(.92)}
.add{height:58px;min-width:80px;border:3px solid var(--ink);background:var(--b);color:#fff;font-weight:700;border-radius:var(--r)}
.t{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:6px 8px;margin-bottom:10px;min-height:64px;animation:in .3s}
@keyframes in{from{transform:translateY(-10px) scale(.95);opacity:0}}
.t.rm{transition:.3s;transform:translateX(100%);opacity:0}
.cb{width:56px;height:56px;flex:none;border:0;background:none;display:grid;place-items:center}
.cb i{width:34px;height:34px;border:3px solid var(--ink);border-radius:9px;display:grid;place-items:center;color:#fff;font-style:normal;transition:.2s}
.t.done .cb i{background:var(--c);border-color:var(--c)}
.t.done span{text-decoration:line-through;opacity:.5}
.t span{flex:1;font-size:19px;word-break:break-word}
.x{width:56px;height:56px;border:0;background:none;font-size:26px;color:var(--b)}
.empty{text-align:center;padding:40px 10px;font-size:18px}
.empty b{display:block;font-size:56px}
.foot{padding:10px 18px;text-align:center;font-size:18px;font-weight:700}

<div id="ph">
<header><h1 id="ti">📝 MY TO-DO LIST</h1><button id="snd" aria-label="sound">🔇</button></header>
<main>
<section class="scr" id="s1">
<form id="f"><input id="in" placeholder="add a task..." maxlength="60" autocomplete="off"><button class="add">ADD</button></form>
<div id="L"></div>
</section>
<section class="scr off" id="s2">
<div class="st"><div class="card"><b id="n1">0</b>tasks left</div><div class="card"><b id="n2">0</b>done</div></div>
<div class="bar"><div id="fill"></div></div>
<p id="msg" style="text-align:center;font-size:18px"></p>
<button class="clr" id="clr">🧹 Clear finished tasks</button>
</section>
</main>
<div class="foot" id="ft"></div>
<nav><button class="on" data-s="s1"><span>✅</span>Tasks</button><button data-s="s2"><span>📊</span>Progress</button></nav>
</div>
<script>
let tasks=[{id:1,t:"buy milk",d:0},{id:2,t:"math homework",d:0},{id:3,t:"call grandma",d:0}],nid=4,on=0,ac;
const $=s=>document.querySelector(s);

function draw(){
const L=$("#L");

const left=tasks.filter(k=>!k.d).length,dn=tasks.length-left;

$("#f").onsubmit=e=>{e.preventDefault();const v=$("#in").value.trim();if(!v){$("#in").focus();return}tasks.push({id:nid++,t:v,d:0});$("#in").value="";beep(740);draw();$("#s1").scrollTop=1e5};
$("#L").onclick=e=>{const b=e.target.closest("button");if(!b)return;const el=b.closest(".t"),id=+el.dataset.id,k=tasks.find(q=>q.id==id);
if(b.dataset.a=="c"){k.d=k.d?0:1;beep(k.d?880:440);draw()}
else{beep(300,.15);el.classList.add("rm");setTimeout(()=>{tasks=tasks.filter(q=>q.id!=id);draw()},280)}};
$("#clr").onclick=()=>{tasks=tasks.filter(k=>!k.d);beep(520);draw()};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b));["s1","s2"].forEach(s=>$("#"+s).classList.toggle("off",s!=b.dataset.s));$("#ti").textContent=b.dataset.s=="s1"?"📝 MY TO-DO LIST":"📊 MY PROGRESS";beep(600,.06)});

</script></body></html>
