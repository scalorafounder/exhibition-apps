<title>Tip Shop – Dinner Treats &amp; Tip Calculator</title>
<style>
:root{--a:#ff7a59;--b:#2ec4b6;--c:#ffbf47;--d:#1b1b3a;--l:#fdf8ef;--r:16px}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,Segoe UI,Roboto,sans-serif}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0;color:var(--d);background:linear-gradient(135deg,#fdf8ef,#ffe6d6 60%,#d5f5f0);min-height:100dvh;overflow-x:hidden}
input{-webkit-user-select:text;user-select:text}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--d);color:var(--l);position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0}
button{min-height:56px;border:0;border-radius:var(--r);font-size:16px;font-weight:700;cursor:pointer;transition:transform .1s,background .2s;background:var(--a);color:#fff;padding:0 16px}
button:active{transform:scale(.94)}
.hb{min-height:48px;background:var(--c);color:var(--d)}
nav{display:flex;gap:8px;padding:12px 16px;max-width:1000px;margin:auto}
nav button{flex:1;background:#fff;color:var(--d);box-shadow:0 2px 0 #0002}
nav button.on{background:var(--b);color:#fff}
main{max-width:1000px;margin:auto;padding:0 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#fff;border-radius:var(--r);padding:14px;text-align:center;box-shadow:0 4px 14px #0001;display:flex;flex-direction:column;gap:6px}
.em{font-size:56px}.pr{font-weight:800;color:var(--a);font-size:18px}
.box{background:#fff;border-radius:var(--r);padding:16px;box-shadow:0 4px 14px #0001;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed #0002}
.q{display:flex;align-items:center;gap:8px}.q button{min-height:44px;width:44px;padding:0}
input{width:100%;font-size:22px;padding:14px;border-radius:var(--r);border:2px solid var(--d);background:var(--l)}
.tips{display:flex;gap:8px;margin:8px 0}.tips button{flex:1;background:#fff;color:var(--d);border:2px solid var(--d)}
.tips button.on{background:var(--a);color:#fff;border-color:var(--a)}
.big{font-size:26px;font-weight:800}
.hide{display:none}
.badge{background:var(--a);border-radius:99px;padding:2px 9px;margin-left:4px;font-size:13px}
.ty{text-align:center;padding:30px}.ty .em{font-size:80px}
</style></head><body>
<header><h1>🍽️ Tip Shop</h1><button class="hb" id="snd">🔇 Sound off</button></header>
<nav><button id="n0" class="on">Shop</button><button id="n1">Cart<span class="badge" id="cnt">0</span></button><button id="n2">Tip Calculator</button></nav>
<main>
<section id="s0"><div class="grid" id="grid"></div></section>
<section id="s1" class="hide"><div class="box" id="cart"></div></section>
<section id="s2" class="hide"><div class="box">
<h2 style="margin-top:0">Tip Calculator</h2>
<label>Bill: $</label><input id="bill" type="number" inputmode="decimal" min="0" placeholder="0.00">
<p style="margin:14px 0 0">Tip:</p>
<div class="tips" id="tips"></div>
<div class="row" style="border:0"><b>People:</b><div class="q"><button id="pm">−</button><b id="pp" class="big">2</b><button id="pa">+</button></div></div>
</div>
<div class="box"><div class="big">TIP: <span id="tv">$0.00</span></div><div class="big" style="margin-top:8px">EACH PAYS: <span id="ev">$0.00</span></div>
<button style="margin-top:12px;width:100%;background:var(--b)" id="usecart">Use my cart total as the bill</button></div>
</section>
</main>
<script>
const P=[["🍕","Pizza Slice",4.5],["🍔","Burger",8],["🌮","Taco Trio",7],["🍣","Sushi Set",12],["🍜","Ramen Bowl",10],["🥗","Fresh Salad",6.5],["🍩","Donut",2.25],["🧋","Bubble Tea",5],["🍰","Cake Slice",4.75],["☕","Coffee",3]];
let cart={},tip=15,ppl=2,au=null,mute=true;
const $=i=>document.getElementById(i),m=n=>"$"+n.toFixed(2);
document.addEventListener("contextmenu",e=>e.preventDefault());
function beep(f){if(mute)return;if(!au)return;const o=au.createOscillator(),g=au.createGain();o.frequency.value=f;o.type="triangle";g.gain.value=.08;o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,au.currentTime+.15);o.stop(au.currentTime+.15)}
$("snd").onclick=()=>{au=au||new(window.AudioContext||window.webkitAudioContext)();mute=!mute;$("snd").textContent=mute?"🔇 Sound off":"🔊 Sound on";beep(660)};
function show(i){for(let k=0;k<3;k++){$("s"+k).classList.toggle("hide",k!=i);$("n"+k).classList.toggle("on",k==i)}if(i==1)rc();beep(440)}
[0,1,2].forEach(i=>$("n"+i).onclick=()=>show(i));
$("grid").innerHTML=P.map((p,i)=>`<div class="card"><div class="em">${p[0]}</div><b>${p[1]}</b><div class="pr">${m(p[2])}</div><button data-i="${i}">Add to cart</button></div>`).join("");
$("grid").onclick=e=>{const i=e.target.dataset.i;if(i==null)return;cart[i]=(cart[i]||0)+1;uc();beep(740);e.target.textContent="Added ✓";setTimeout(()=>e.target.textContent="Add to cart",700)};
const tot=()=>Object.keys(cart).reduce((s,i)=>s+cart[i]*P[i][2],0);
function uc(){$("cnt").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function rc(){const k=Object.keys(cart);if(!k.length){$("cart").innerHTML='<div class="ty"><div class="em">🛒</div><h3>Your cart is empty</h3><p>Add some tasty things from the shop!</p></div>';return}
$("cart").innerHTML="<h2 style='margin-top:0'>Your cart</h2>"+k.map(i=>`<div class="row"><span>${P[i][0]} ${P[i][1]}<br><small>${m(P[i][2])} each</small></span><span class="q"><button data-d="${i}">−</button><b>${cart[i]}</b><button data-u="${i}">+</button><button data-r="${i}" style="background:var(--d)">🗑</button></span></div>`).join("")+`<p class="big">Total: ${m(tot())}</p><button style="width:100%;background:var(--b)" id="co">Checkout</button>`;
$("co").onclick=()=>{cart={};uc();beep(880);setTimeout(()=>beep(1100),120);$("cart").innerHTML='<div class="ty"><div class="em">🎉</div><h2>Thank you!</h2><p>Your order is on its way. Don\'t forget to tip!</p><button onclick="show(2)">Open tip calculator</button></div>'}}
$("cart").onclick=e=>{const d=e.target.dataset;if(d.u!=null)cart[d.u]++;else if(d.d!=null){if(--cart[d.d]<=0)delete cart[d.d]}else if(d.r!=null)delete cart[d.r];else return;uc();rc();beep(520)};
function calc(){const b=parseFloat($("bill").value)||0,t=b*tip/100;$("tv").textContent=m(t);$("ev").textContent=m((b+t)/ppl);$("pp").textContent=ppl}
$("tips").innerHTML=[10,15,20].map(t=>`<button data-t="${t}" class="${t==tip?"on":""}">${t}%</button>`).join("");
$("tips").onclick=e=>{const t=e.target.dataset.t;if(!t)return;tip=+t;[...$("tips").children].forEach(b=>b.classList.toggle("on",b.dataset.t==t));calc();beep(600)};
$("pm").onclick=()=>{if(ppl>1)ppl--;calc();beep(400)};$("pa").onclick=()=>{if(ppl<50)ppl++;calc();beep(500)};
$("bill").oninput=calc;
$("usecart").onclick=()=>{$("bill").value=tot().toFixed(2);calc();beep(700)};
calc();
</script></body></html>
