<title>Tic Tac Toe Shop</title>
<style>
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{touch-action:manipulation;overscroll-behavior:none}
:root{--ink:#161a5c;--paper:#faf7f0;--line:#dfe4f5;--a:#e8505b;--b:#2a7de1;--c:#f5b82e;--ok:#2f9e6e;--r:16px}
body{margin:0;font-family:"Comic Sans MS","Segoe Print",system-ui,sans-serif;color:var(--ink);background:repeating-linear-gradient(var(--paper) 0 31px,var(--line) 31px 32px);min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--ink);color:var(--paper);position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0}
button{font:inherit;color:inherit;border:3px solid var(--ink);background:var(--paper);border-radius:var(--r);min-height:56px;padding:0 16px;cursor:pointer;transition:transform .12s,background .2s;font-weight:700}
button:active{transform:scale(.94)}
header button{min-height:56px;border-color:var(--paper)}
.cb{background:var(--c)}
main{max-width:1000px;margin:auto;padding:16px}
h2{font-size:26px;margin:8px 0}
p.s{margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:14px;text-align:center;display:flex;flex-direction:column;gap:8px;box-shadow:4px 4px 0 var(--ink)}
.em{font-size:56px;line-height:1.1}
.pr{font-size:20px;color:var(--a)}
.add{background:var(--b);color:#fff}
aside{position:fixed;top:0;right:0;height:100dvh;width:min(380px,100%);background:var(--paper);border-left:4px solid var(--ink);transform:translateX(105%);transition:transform .3s;z-index:9;display:flex;flex-direction:column;padding:16px}
aside.o{transform:none}
.top{display:flex;justify-content:space-between;align-items:center}
#list{flex:1;overflow:auto;margin:10px 0}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dashed var(--line)}
.row span.n{flex:1}
.q{min-height:44px;width:44px;padding:0}
.empty{text-align:center;padding:30px 0;opacity:.7}
.tot{font-size:22px;display:flex;justify-content:space-between;margin-bottom:10px}
.ty{background:var(--ok);color:#fff;border-radius:var(--r);padding:20px;text-align:center;font-size:20px}
.fly{position:fixed;top:60px;right:70px;font-size:26px;animation:f .6s forwards;z-index:20;pointer-events:none}
@keyframes f{to{transform:translateY(-30px) scale(1.6);opacity:0}}
.badge{background:var(--a);border-radius:20px;padding:2px 9px;margin-left:4px}
</style></head><body>
<header><h1>✏️ Tic Tac Toe Shop</h1><div><button id="snd">🔇 Sound off</button> <button class="cb" id="cartb">🛒 Cart<span class="badge" id="cnt">0</span></button></div></header>
<main><h2>Game night supplies</h2><p class="s">Everything for a perfect round of noughts and crosses.</p><div class="grid" id="g"></div></main>
<aside id="cart"><div class="top"><h2>Your cart</h2><button id="cl">✖ Close</button></div><div id="list"></div><div class="tot"><span>Total</span><b id="tot">$0.00</b></div><button class="cb" id="co">Checkout</button></aside>
<script>
const P=[["❌","X Marker",3.5],["⭕","O Marker",3.5],["✏️","Jumbo Pencil",1.25],["📓","Lined Notebook",4.99],["🧽","Eraser",0.99],["🏆","Winner Trophy",12],["🎲","Dice Set",5.5],["⏱️","Turn Timer",7.25],["🧩","Puzzle Pack",9.99],["🍪","Snack Cookies",2.75]];
let cart={},on=false,ac;
const $=i=>document.getElementById(i);
function beep(f){if(!on)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);o.stop(ac.currentTime+.16)}catch(e){}}
$("g").innerHTML=P.map((p,i)=>`<div class="card"><div class="em">${p[0]}</div><b>${p[1]}</b><div class="pr">$${p[2].toFixed(2)}</div><button class="add" data-i="${i}">Add to cart</button></div>`).join("");
$("g").onclick=e=>{const b=e.target.closest(".add");if(!b)return;const i=b.dataset.i;cart[i]=(cart[i]||0)+1;const f=document.createElement("div");f.className="fly";f.textContent=P[i][0];document.body.appendChild(f);setTimeout(()=>f.remove(),600);beep(660);draw()};
function draw(){const k=Object.keys(cart);let n=0,t=0;k.forEach(i=>{n+=cart[i];t+=cart[i]*P[i][2]});$("cnt").textContent=n;$("tot").textContent="$"+t.toFixed(2);
$("list").innerHTML=k.length?k.map(i=>`<div class="row"><span style="font-size:28px">${P[i][0]}</span><span class="n">${P[i][1]}<br>$${(P[i][2]*cart[i]).toFixed(2)}</span><button class="q" data-a="-" data-i="${i}">−</button><b>${cart[i]}</b><button class="q" data-a="+" data-i="${i}">+</button><button class="q" data-a="x" data-i="${i}">🗑️</button></div>`).join(""):'<div class="empty">🛒<br>Your cart is empty.<br>Add something fun!</div>'}
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=b.dataset.i,a=b.dataset.a;if(a=="+")cart[i]++;else if(a=="-"){if(--cart[i]<1)delete cart[i]}else delete cart[i];beep(440);draw()};
$("cartb").onclick=()=>{$("cart").classList.add("o");beep(520)};
$("cl").onclick=()=>$("cart").classList.remove("o");
$("co").onclick=()=>{if(!Object.keys(cart).length){beep(200);return}cart={};draw();$("list").innerHTML='<div class="ty">🎉 Thank you!<br>Your order is on its way. Have a great game!</div>';beep(880);setTimeout(()=>beep(1100),150)};
$("snd").onclick=()=>{on=!on;$("snd").textContent=on?"🔊 Sound on":"🔇 Sound off";beep(600)};
document.addEventListener("contextmenu",e=>e.preventDefault());
draw();
</script></body></html>
