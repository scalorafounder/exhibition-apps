<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do List</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#cfe8fb;font-family:"Segoe Print","Comic Sans MS",cursive,sans-serif;color:#1c1c5a}
  .card{width:min(94vw,440px);min-height:480px;background:#fff;border:3px solid #222;border-radius:6px;padding:22px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #9cc7ea}
  h1{margin:0 0 16px 14px;font-size:1.7rem;letter-spacing:1px}
  form{display:flex;gap:10px}
  input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:10px;border:3px solid #222;border-radius:4px;color:#1c1c5a}
  button.add{font:inherit;font-size:1.1rem;font-weight:bold;padding:10px 16px;border:3px solid #1b6b33;background:#2eb85c;color:#fff;border-radius:4px;cursor:pointer;min-height:48px}
  button.add:hover{background:#27a653}
  button.add:active{background:#1f8f45}
  ul{list-style:none;padding:0;margin:18px 0;flex:1}
  li{display:flex;align-items:center;gap:14px;padding:10px 4px;font-size:1.25rem}
  .box{width:36px;height:36px;flex:none;border:3px solid #222;border-radius:4px;background:#fff;cursor:pointer;font-size:1.4rem;line-height:1;color:#2a9d4a;padding:0}
  .txt{flex:1;word-break:break-word}
  li.done .txt{text-decoration:line-through;opacity:.5}
  .x{background:none;border:none;font-size:1.8rem;cursor:pointer;color:#222;width:44px;height:44px}
  .x:hover{color:#d33}
  .count{font-size:1.1rem;margin-left:6px}
  .empty{opacity:.6;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="card">
  <h1>MY TO-DO LIST</h1>
  <form id="f">
    <input type="text" id="in" placeholder="add a task..." autocomplete="off" maxlength="80">
    <button class="add" type="submit">ADD</button>
  </form>
  <ul id="list"></ul>
  <div class="count" id="count"></div>
</div>
<script>
  let tasks=[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
  const list=document.getElementById("list"),count=document.getElementById("count"),inp=document.getElementById("in");
  function render(){
    list.innerHTML="";
    if(!tasks.length){list.innerHTML='<div class="empty">All done! 🎉</div>'}
    tasks.forEach((k,i)=>{
      const li=document.createElement("li");
      if(k.d)li.className="done";
      const b=document.createElement("button");
      b.className="box";b.textContent=k.d?"✓":"";
      b.setAttribute("aria-label","toggle task");
      b.onclick=()=>{k.d=!k.d;render()};
      const s=document.createElement("span");
      s.className="txt";s.textContent=k.t;
      const x=document.createElement("button");
      x.className="x";x.textContent="✕";
      x.setAttribute("aria-label","delete task");
      x.onclick=()=>{tasks.splice(i,1);render()};
      li.append(b,s,x);list.append(li);
    });
    const n=tasks.filter(k=>!k.d).length;
    count.textContent=n+(n===1?" task left":" tasks left");
  }
  document.getElementById("f").onsubmit=e=>{
    e.preventDefault();
    const v=inp.value.trim();
    if(!v)return;
    tasks.push({t:v,d:false});
    inp.value="";render();inp.focus();
  };
  render();
</script>
</body>
</html>
