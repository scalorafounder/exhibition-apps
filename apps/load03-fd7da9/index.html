<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tic Tac Toe</title>
<style>
body{margin:0;min-height:100vh;background:#faf7f0;background-image:repeating-linear-gradient(#faf7f0 0 46px,#dde2f3 46px 48px);font-family:"Comic Sans MS","Segoe Print",cursive;color:#1a1a5e;display:flex;flex-direction:column;align-items:center;padding:20px;box-sizing:border-box}
h1{font-size:clamp(28px,7vw,52px);margin:10px 0 20px;letter-spacing:2px}
#board{display:grid;grid-template-columns:repeat(3,1fr);width:min(88vw,420px);aspect-ratio:1;gap:6px;background:#222;padding:0}
.c{background:#faf7f0;border:0;font:inherit;font-size:clamp(48px,16vw,100px);color:#1a1a5e;cursor:pointer;display:flex;align-items:center;justify-content:center}
.c:hover:not(:disabled){background:#eef0fb}
.c.win{background:#ffe9a8}
.c:disabled{cursor:default}
#bar{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;justify-content:center}
#status,button#r{border:3px solid #222;background:#faf7f0;font:inherit;font-size:22px;color:#1a1a5e;padding:14px 20px;min-height:56px}
button#r{cursor:pointer}
button#r:hover{background:#dde2f3}
</style>
</head>
<body>
<h1>TIC TAC TOE</h1>
<div id="board"></div>
<div id="bar"><div id="status"></div><button id="r">RESTART</button></div>
<script>
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let b,t,over;
const bd=document.getElementById('board'),st=document.getElementById('status');
const cells=[];
for(let i=0;i<9;i++){const c=document.createElement('button');c.className='c';c.setAttribute('aria-label','square '+(i+1));c.onclick=()=>play(i);bd.appendChild(c);cells.push(c)}
function reset(){b=Array(9).fill('');t='X';over=false;cells.forEach(c=>{c.textContent='';c.disabled=false;c.classList.remove('win')});st.textContent='Your turn: X'}
function play(i){
if(over||b[i])return;
b[i]=t;cells[i].textContent=t;cells[i].disabled=true;
const w=L.find(l=>l.every(k=>b[k]===t));
if(w){over=true;w.forEach(k=>cells[k].classList.add('win'));st.textContent=t+' wins! 🎉';cells.forEach(c=>c.disabled=true);return}
if(b.every(x=>x)){over=true;st.textContent="It's a tie! 🤝";return}
t=t==='X'?'O':'X';st.textContent='Your turn: '+t}
document.getElementById('r').onclick=reset;
reset();
</script>
</body>
</html>
