<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony's Pizza</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS","Segoe UI",sans-serif;background:#faf7f0;color:#1c1f5c}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.app{border:3px solid #222;border-radius:6px;background:#fffdf8}
header{border-bottom:3px solid #222;padding:16px 20px}
h1{margin:0;font-size:2.2rem;letter-spacing:2px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:20px}
.item{display:flex;flex-direction:column;align-items:center;gap:12px}
.card{border:3px solid #222;border-radius:6px;width:100%;padding:16px;text-align:left;background:#fff}
.pic{width:140px;height:140px;border:3px solid #222;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:4.5rem;background:#ffe9b5}
.name{font-size:1.15rem}
button{font:inherit;cursor:pointer;border:3px solid #222;background:#fff;color:#1c1f5c;padding:12px 22px;min-height:48px;border-radius:4px;text-transform:uppercase;font-size:1.05rem}
button:hover{background:#ffd9a0}
button:active{transform:scale(.95)}
.cart{margin:0 20px 20px;border:3px solid #222;border-radius:6px;padding:16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;background:#fff}
.info{font-size:1.25rem;text-transform:uppercase}
.list{width:100%;font-size:.95rem;min-height:1.2em;color:#444}
#msg{text-align:center;padding:0 20px 16px;min-height:1.5em;font-weight:bold}
</style>
</head>
<body>
<div class="wrap"><div class="app">
<header><h1>TONY'S PIZZA</h1></header>
<div class="menu" id="menu"></div>
<div class="cart">
<div class="info">Your cart: <span id="count">0 items</span> &nbsp; Total $<span id="total">0</span></div>
<button id="checkout">Checkout</button>
<div class="list" id="list">Your cart is empty. Pick a pizza! 🍕</div>
</div>
<div id="msg"></div>
</div></div>
<script>
const pizzas=[{n:"Margherita",p:10,e:"🍅"},{n:"Pepperoni",p:12,e:"🍕"},{n:"Veggie",p:11,e:"🥦"}];
const cart=pizzas.map(()=>0);
const menu=document.getElementById("menu");
pizzas.forEach((z,i)=>{
  const d=document.createElement("div");d.className="item";
  d.innerHTML=`<div class="card"><div class="pic">${z.e}</div><div class="name">${z.n} $${z.p}</div></div><button>Order</button>`;
  d.querySelector("button").onclick=()=>{cart[i]++;document.getElementById("msg").textContent="";render()};
  menu.appendChild(d);
});
function render(){
  let c=0,t=0,parts=[];
  cart.forEach((q,i)=>{c+=q;t+=q*pizzas[i].p;if(q)parts.push(q+" × "+pizzas[i].n)});
  count.textContent=c+(c==1?" item":" items");
  total.textContent=t;
  list.textContent=parts.length?parts.join(", "):"Your cart is empty. Pick a pizza! 🍕";
}
checkout.onclick=()=>{
  const c=cart.reduce((a,b)=>a+b,0);
  const t=cart.reduce((a,q,i)=>a+q*pizzas[i].p,0);
  if(!c){msg.textContent="Add a pizza first! 🍕";return}
  msg.textContent="Thanks! Your order of "+c+(c==1?" pizza":" pizzas")+" ($"+t+") is in the oven! 🔥";
  cart.fill(0);render();
};
</script>
</body>
</html>
