<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do List</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f7fb;font-family:"Segoe Print","Comic Sans MS",cursive,sans-serif;color:#1a1a5e;background-image:repeating-linear-gradient(#f4f7fb 0 29px,#e3e9f3 30px)}
.card{width:100%;max-width:420px;min-height:520px;margin:16px;background:#fff;border:3px solid #222;border-radius:6px;padding:20px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #1a1a5e22}
h1{margin:0 0 16px;font-size:28px;text-align:center;letter-spacing:1px}
form{display:flex;gap:10px;margin-bottom:18px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px;border:3px solid #222;border-radius:4px;color:#1a1a5e}
button.add{font:inherit;font-size:18px;padding:0 16px;min-height:48px;border:3px solid #222;background:#fff;color:#1a1a5e;border-radius:4px;cursor:pointer}
button.add:active{background:#dde4ff}
ul{list-style:none;margin:0;padding:0;flex:1}
li{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:22px}
li .t{flex:1;word-break:break-word}
li.done .t{text-decoration:line-through;opacity:.5}
.box{width:36px;height:36px;border:3px solid #222;border-radius:4px;background:#fff;cursor:pointer;font-size:24px;line-height:1;padding:0;color:#2a9d4a}
.x{width:44px;height:44px;border:none;background:none;font-size:30px;cursor:pointer;color:#222}
.x:hover{color:#d33}
.empty{opacity:.6;text-align:center;margin-top:30px}
.count{font-size:18px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>MY TO-DO LIST</h1>
<form id="f"><input type="text" id="in" placeholder="add a task..." maxlength="60" autocomplete="off"><button class="add" type="submit">ADD</button></form>
<ul id="list"></ul>
<div class="count" id="count"></div>
</div>
<script>
let tasks=[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
const list=document.getElementById("list"),count=document.getElementById("count"),inp=document.getElementById("in");
function render(){
list.innerHTML="";
tasks.forEach((k,i)=>{
const li=document.createElement("li");if(k.d)li.className="done";
const b=document.createElement("button");b.className="box";b.textContent=k.d?"✓":"";b.setAttribute("aria-label","toggle");
b.onclick=()=>{k.d=!k.d;render()};
const s=document.createElement("span");s.className="t";s.textContent=k.t;
const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","delete");
x.onclick=()=>{tasks.splice(i,1);render()};
li.append(b,s,x);list.appendChild(li);
});
if(!tasks.length){list.innerHTML='<div class="empty">All done! 🎉</div>'}
const n=tasks.filter(k=>!k.d).length;
count.textContent=n+" task"+(n==1?"":"s")+" left";
}
document.getElementById("f").onsubmit=e=>{
e.preventDefault();
const v=inp.value.trim();
if(v){tasks.push({t:v,d:false});inp.value="";render()}
inp.focus();
};
render();
</script>
</body>
</html>
