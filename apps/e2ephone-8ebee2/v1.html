<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef3fb;font-family:"Segoe Print","Comic Sans MS",cursive,sans-serif;color:#1a1a5e}
.app{width:min(420px,94vw);min-height:520px;background:#fff;border:3px solid #222;border-radius:6px;padding:22px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #c9d4ea}
h1{margin:0 0 16px;text-align:center;font-size:28px;letter-spacing:1px}
form{display:flex;gap:10px;margin-bottom:18px}
input[type=text]{flex:1;min-width:0;padding:12px;font:inherit;font-size:18px;border:3px solid #222;border-radius:4px;color:#1a1a5e}
.add{font:inherit;font-size:18px;padding:0 16px;background:#fff;border:3px solid #222;border-radius:4px;color:#1a1a5e;cursor:pointer;min-height:48px}
.add:hover{background:#dfe8ff}
ul{list-style:none;margin:0;padding:0;flex:1}
li{display:flex;align-items:center;gap:14px;padding:10px 0;font-size:22px}
li .box{width:36px;height:36px;border:3px solid #222;border-radius:4px;background:#fff;cursor:pointer;font-size:24px;line-height:1;color:#1a9a4a;flex:none;padding:0}
li span{flex:1;word-break:break-word;cursor:pointer}
li.done span{text-decoration:line-through;opacity:.5}
.x{background:none;border:none;font-size:30px;cursor:pointer;color:#222;width:44px;height:44px;flex:none}
.x:hover{color:#d33}
.foot{margin-top:14px;font-size:18px}
.empty{opacity:.6;text-align:center;padding:30px 0;font-size:18px}
</style>
</head>
<body>
<div class="app">
<h1>MY TO-DO LIST</h1>
<form id="f"><input type="text" id="t" placeholder="add a task..." maxlength="60" autocomplete="off"><button class="add" type="submit">ADD</button></form>
<ul id="l"></ul>
<div class="foot" id="c"></div>
</div>
<script>
let tasks=[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
const l=document.getElementById("l"),c=document.getElementById("c"),t=document.getElementById("t");
function render(){
l.innerHTML="";
if(!tasks.length){l.innerHTML='<div class="empty">All done! 🎉</div>'}
tasks.forEach((k,i)=>{
const li=document.createElement("li");if(k.d)li.className="done";
const b=document.createElement("button");b.className="box";b.textContent=k.d?"✓":"";b.setAttribute("aria-label","toggle");
const s=document.createElement("span");s.textContent=k.t;
const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","delete");
b.onclick=s.onclick=()=>{k.d=!k.d;render()};
x.onclick=()=>{tasks.splice(i,1);render()};
li.append(b,s,x);l.append(li);
});
const n=tasks.filter(k=>!k.d).length;
c.textContent=n+(n===1?" task left":" tasks left");
}
document.getElementById("f").onsubmit=e=>{
e.preventDefault();
const v=t.value.trim();
if(v){tasks.push({t:v,d:false});t.value="";render()}
t.focus();
};
render();
</script>
</body>
</html>
