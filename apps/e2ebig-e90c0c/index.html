<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List: Chore Rush</title>
<style>
body{margin:0;background:#bfe3ff;font-family:"Comic Sans MS","Segoe Print",cursive;color:#1a1a5e;display:flex;justify-content:center;padding:12px}
.card{background:#fff;border:3px solid #111;width:100%;max-width:440px;padding:14px;box-sizing:border-box;min-height:560px;position:relative}
h1{margin:4px 0 8px;font-size:26px;letter-spacing:1px}
.row{display:flex;gap:8px}
input{flex:1;border:3px solid #111;padding:10px;font:inherit;font-size:18px;min-width:0}
button{font:inherit;color:#1a1a5e;cursor:pointer}
.add{border:3px solid #111;background:#4caf50;color:#fff;font-size:18px;padding:0 14px;font-weight:bold}
.add:active{background:#388e3c}
.hud{display:flex;justify-content:space-between;margin:10px 0;font-size:16px}
.bar{height:12px;border:2px solid #111;background:#fff}
.bar div{height:100%;background:#4caf50;width:100%}
ul{list-style:none;padding:0;margin:12px 0;min-height:230px}
li{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:20px;animation:pop .3s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.box{width:34px;height:34px;border:3px solid #111;background:#fff;font-size:22px;line-height:1;padding:0;flex:none}
.t{flex:1;word-break:break-word}
.done .t{text-decoration:line-through;opacity:.5}
.x{background:none;border:none;font-size:28px;width:44px;height:44px}
.foot{position:absolute;bottom:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}
.ov{position:absolute;inset:0;background:rgba(255,255,255,.95);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}
.ov.on{display:flex}
.ov button{border:3px solid #111;background:#ffe14d;font-size:22px;padding:10px 24px}
</style>
</head>
<body>
<div class="card">
<h1>MY TO-DO LIST</h1>
<div class="row"><input id="in" placeholder="add a task..." maxlength="30"><button class="add" id="add">ADD</button></div>
<div class="hud"><span>⭐ Score: <b id="sc">0</b></span><span>⏱ <b id="tm">30</b>s</span></div>
<div class="bar"><div id="bar"></div></div>
<ul id="ul"></ul>
<div class="foot"><span id="left"></span><span>Goal: 100 ⭐</span></div>
<div class="ov on" id="ov"><h2 id="ot">Chore Rush! 🧹</h2><p id="om">Check off tasks before time runs out. Tap the box = +10 ⭐. Add tasks to keep going! ✕ deletes (−5). Reach 100 to win!</p><button id="go">Start</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const pool=["buy milk","math homework","call grandma","walk the dog","water plants","tidy desk","read a chapter","practice guitar","wash dishes","text a friend","stretch","pack backpack"];
let tasks,score,time,timer,running=false,id=0;
function addTask(t){tasks.push({id:id++,t:t,d:false})}
function render(){
 const ul=$("ul");ul.innerHTML="";
 tasks.forEach(k=>{
  const li=document.createElement("li");if(k.d)li.className="done";
  const b=document.createElement("button");b.className="box";b.textContent=k.d?"✔":"";
  b.onclick=()=>{if(!running||k.d)return;k.d=true;score+=10;upd();render();
   setTimeout(()=>{tasks=tasks.filter(z=>z!==k);if(tasks.filter(z=>!z.d).length<2)addTask(pool[Math.random()*pool.length|0]);render();upd()},400)};
  const s=document.createElement("span");s.className="t";s.textContent=k.t;
  const x=document.createElement("button");x.className="x";x.textContent="✕";
  x.onclick=()=>{if(!running)return;tasks=tasks.filter(z=>z!==k);score=Math.max(0,score-5);render();upd()};
  li.append(b,s,x);ul.append(li)});
}
function upd(){
 $("sc").textContent=score;$("tm").textContent=time;$("bar").style.width=time/30*100+"%";
 const n=tasks.filter(z=>!z.d).length;$("left").textContent=n+" task"+(n==1?"":"s")+" left";
 if(running&&score>=100)end(true);
}
function end(win){
 running=false;clearInterval(timer);
 $("ot").textContent=win?"You win! 🎉":"Time's up! ⏰";
 $("om").textContent="Final score: "+score+(win?" — Chore champion!":" — Try again to reach 100!");
 $("go").textContent="Play again";$("ov").classList.add("on");
}
function start(){
 tasks=[];score=0;time=30;
 ["buy milk","math homework","call grandma","walk the dog"].forEach(addTask);
 running=true;$("ov").classList.remove("on");render();upd();
 clearInterval(timer);
 timer=setInterval(()=>{time--;upd();if(time<=0)end(false)},1000);
}
function doAdd(){
 const v=$("in").value.trim();if(!v||!running)return;
 addTask(v);score+=2;$("in").value="";render();upd();
}
$("add").onclick=doAdd;
$("in").onkeydown=e=>{if(e.key=="Enter")doAdd()};
$("go").onclick=start;
tasks=[];score=0;time=30;
</script>
</body>
</html>
