<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tony's Pizza Rush</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS",Chalkboard,sans-serif;background:#faf6ee;color:#1b1b5e;display:flex;justify-content:center}
.app{width:100%;max-width:900px;margin:10px;border:3px solid #222;border-radius:6px;background:#fffdf7}
h1{margin:0;padding:12px 16px;border-bottom:3px solid #222;font-size:clamp(24px,5vw,40px)}
.bar{display:flex;justify-content:space-between;padding:8px 16px;font-weight:bold;font-size:18px;background:#fde9c8;border-bottom:3px solid #222}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.card{border:3px solid #222;border-radius:6px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pz{font-size:clamp(50px,12vw,100px);line-height:1;user-select:none}
.nm{font-size:clamp(14px,3vw,20px)}
button{font:inherit;font-weight:bold;border:3px solid #222;background:#ffd166;color:#1b1b5e;border-radius:6px;padding:12px 10px;min-height:48px;cursor:pointer;width:100%}
button:active{transform:scale(.95)}
.cart{margin:0 12px 12px;border:3px solid #222;border-radius:6px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:clamp(16px,3.5vw,24px)}
.cart button{width:auto;padding:12px 24px;background:#7bd88f}
#msg{padding:0 16px 12px;min-height:30px;font-size:18px;text-align:center}
#game{position:relative;margin:0 12px 12px;border:3px solid #222;border-radius:6px;height:150px;overflow:hidden;background:#e8f4ff}
.f{position:absolute;font-size:36px;top:0;user-select:none;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<h1>🍕 TONY'S PIZZA</h1>
<div class="bar"><span>⏱ <span id="t">30</span>s</span><span>Goal: 10 items!</span><span>⭐ <span id="s">0</span></span></div>
<div id="game"></div>
<div id="msg">Tap falling pizzas or press 1/2/3 to order. Fill your cart before time runs out!</div>
<div class="menu" id="menu"></div>
<div class="cart"><span>YOUR CART: <b id="n">0</b> items &nbsp; TOTAL $<b id="tot">0</b></span><button id="co">CHECKOUT</button></div>
</div>
<script>
const P=[{n:"Margherita",p:10,e:"🍕"},{n:"Pepperoni",p:12,e:"🍖"},{n:"Veggie",p:11,e:"🥦"}];
let items,total,score,time,over,timer,spawn,drops;
const $=id=>document.getElementById(id);
$("menu").innerHTML=P.map((x,i)=>`<div class="card"><div class="pz">${x.e==="🍕"?"🍕":"🍕"}</div><div class="nm">${x.n} $${x.p}</div><button onclick="add(${i})">ORDER</button></div>`).join("");
function ui(){$("n").textContent=items;$("tot").textContent=total;$("s").textContent=score;$("t").textContent=time}
function add(i){if(over)return;items++;total+=P[i].p;score+=P[i].p;ui();if(items>=10)end(true)}
function end(w){over=true;clearInterval(timer);clearInterval(spawn);
$("msg").innerHTML=(w?"🎉 You win! Order complete: $"+total+"! Score "+score:"⏰ Time's up! Only "+items+" items.")+' <button style="width:auto" onclick="start()">Restart</button>'}
function start(){items=0;total=0;score=0;time=30;over=false;drops=[];$("game").innerHTML="";
$("msg").textContent="Tap falling pizzas or press 1/2/3 to order!";ui();
clearInterval(timer);clearInterval(spawn);
timer=setInterval(()=>{time--;ui();if(time<=0)end(false)},1000);
spawn=setInterval(drop,600);drop()}
function drop(){if(over)return;const i=Math.floor(Math.random()*3),d=document.createElement("div");
d.className="f";d.textContent=["🍕","🍕","🥬"][i]==="🥬"?"🥗":"🍕";d.dataset.i=i;
d.style.left=Math.random()*85+"%";let y=-40;d.style.top=y+"px";
d.onpointerdown=()=>{if(over)return;add(i);d.remove()};
$("game").appendChild(d);
const m=setInterval(()=>{y+=4;d.style.top=y+"px";if(y>160||over){clearInterval(m);d.remove()}},30)}
document.addEventListener("keydown",e=>{if("123".includes(e.key)&&e.key)add(+e.key-1)});
$("co").onclick=()=>{if(!over){$("msg").textContent=items?"Keep going! Need 10 items to finish — you have "+items+".":"Your cart is empty!"}};
start();
</script>
</body>
</html>
