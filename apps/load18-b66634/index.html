<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    background:#faf7f0 repeating-linear-gradient(#faf7f0 0 31px,#dde2f3 31px 32px);
    font-family:"Comic Sans MS","Segoe Print",cursive;color:#1a1a5e}
  h1{margin:0;font-size:clamp(28px,8vw,52px);letter-spacing:2px}
  #board{display:grid;grid-template-columns:repeat(3,1fr);width:min(88vw,420px);aspect-ratio:1}
  .cell{background:none;border:0;font:inherit;color:#1a1a5e;font-size:min(20vw,96px);cursor:pointer;
    border-right:6px solid #222;border-bottom:6px solid #222;padding:0}
  .cell:nth-child(3n){border-right:0}
  .cell:nth-child(n+7){border-bottom:0}
  .cell:hover:not(:disabled){background:rgba(26,26,94,.07)}
  .cell.win{background:#ffe9a8}
  .bar{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .box,button.r{font:inherit;font-size:20px;color:#1a1a5e;background:#fff;border:3px solid #222;padding:12px 18px;min-height:52px}
  button.r{cursor:pointer}
  button.r:active{transform:scale(.96)}
</style>
</head>
<body>
<h1>TIC TAC TOE</h1>
<div id="board"></div>
<div class="bar">
  <div class="box" id="status">Your turn: X</div>
  <button class="r" id="restart">RESTART</button>
</div>
<script>
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const bd=document.getElementById('board'),st=document.getElementById('status');
let b,turn,over,cells=[];
for(let i=0;i<9;i++){
  const c=document.createElement('button');
  c.className='cell';c.setAttribute('aria-label','Square '+(i+1));
  c.onclick=()=>play(i);bd.appendChild(c);cells.push(c);
}
function play(i){
  if(over||b[i])return;
  b[i]=turn;cells[i].textContent=turn;
  const w=L.find(l=>l.every(k=>b[k]===turn));
  if(w){
    over=true;w.forEach(k=>cells[k].classList.add('win'));
    st.textContent='🎉 '+turn+' wins!';return;
  }
  if(b.every(Boolean)){over=true;st.textContent="It's a tie! 🤝";return;}
  turn=turn==='X'?'O':'X';
  st.textContent='Your turn: '+turn;
}
function reset(){
  b=Array(9).fill('');turn='X';over=false;
  cells.forEach(c=>{c.textContent='';c.classList.remove('win')});
  st.textContent='Your turn: X';
}
document.getElementById('restart').onclick=reset;
reset();
</script>
</body>
</html>
