<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do List</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#faf7f0;
    background-image:repeating-linear-gradient(transparent 0 38px,#dde3f3 38px 40px);
    font-family:"Segoe Print","Comic Sans MS","Bradley Hand",cursive;color:#1a1a5e;padding:16px}
  .card{width:100%;max-width:440px;min-height:560px;background:#fffdf8;border:3px solid #222;border-radius:6px;padding:22px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #1a1a5e22}
  h1{margin:0 0 18px;text-align:center;font-size:1.7rem;letter-spacing:1px}
  form{display:flex;gap:10px}
  input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px;border:3px solid #222;border-radius:4px;background:#fff;color:#1a1a5e}
  button{font:inherit;cursor:pointer}
  .add{border:3px solid #222;background:#ffe9a8;padding:0 16px;font-size:1.1rem;border-radius:4px;color:#1a1a5e;min-height:48px}
  .add:active{transform:scale(.95)}
  ul{list-style:none;margin:18px 0;padding:0;flex:1}
  li{display:flex;align-items:center;gap:14px;padding:10px 0;font-size:1.3rem}
  .box{width:42px;height:42px;flex:none;border:3px solid #222;background:#fff;border-radius:4px;font-size:1.6rem;line-height:1;color:#2a9d4a}
  .txt{flex:1;word-break:break-word}
  li.done .txt{text-decoration:line-through;opacity:.5}
  .x{width:44px;height:44px;border:none;background:none;font-size:1.8rem;color:#222}
  .x:hover{color:#d33}
  .count{font-size:1.1rem}
  .empty{text-align:center;opacity:.6;margin-top:30px}
</style>
</head>
<body>
<div class="card">
  <h1>MY TO-DO LIST</h1>
  <form id="f">
    <input type="text" id="t" placeholder="add a task..." maxlength="60" autocomplete="off">
    <button class="add" type="submit">ADD</button>
  </form>
  <ul id="list"></ul>
  <div class="count" id="count"></div>
</div>
<script>
let tasks=[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
const list=document.getElementById('list'),count=document.getElementById('count'),inp=document.getElementById('t');
function render(){
  list.innerHTML='';
  tasks.forEach((k,i)=>{
    const li=document.createElement('li');
    if(k.d)li.className='done';
    const b=document.createElement('button');
    b.className='box';b.textContent=k.d?'✓':'';
    b.setAttribute('aria-label','toggle task');
    b.onclick=()=>{k.d=!k.d;render()};
    const s=document.createElement('span');
    s.className='txt';s.textContent=k.t;
    const x=document.createElement('button');
    x.className='x';x.textContent='✕';
    x.setAttribute('aria-label','delete task');
    x.onclick=()=>{tasks.splice(i,1);render()};
    li.append(b,s,x);list.appendChild(li);
  });
  if(!tasks.length){const e=document.createElement('div');e.className='empty';e.textContent='🎉 Nothing to do!';list.appendChild(e)}
  const n=tasks.filter(k=>!k.d).length;
  count.textContent=n+(n===1?' task left':' tasks left');
}
document.getElementById('f').onsubmit=e=>{
  e.preventDefault();
  const v=inp.value.trim();
  if(!v)return;
  tasks.push({t:v,d:false});
  inp.value='';render();inp.focus();
};
render();
</script>
</body>
</html>
