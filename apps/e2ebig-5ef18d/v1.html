<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List Quest</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f1e8;background-image:repeating-linear-gradient(#f4f1e8 0 29px,#dde6f0 30px);font-family:"Comic Sans MS","Segoe Print",cursive;color:#1a1a5e}
.app{width:min(94vw,440px);min-height:560px;background:#fff;border:4px solid #222;border-radius:6px;padding:18px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #1a1a5e55}
h1{margin:4px 0 12px;text-align:center;font-size:28px;letter-spacing:1px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px;border:3px solid #222;border-radius:4px;color:#1a1a5e}
button{font:inherit;cursor:pointer}
#add{font-size:18px;padding:10px 14px;border:3px solid #222;background:#ffe36e;color:#1a1a5e;border-radius:4px;min-height:48px}
#add:active{transform:scale(.94)}
.bar{height:14px;border:2px solid #222;border-radius:8px;margin:12px 0 4px;overflow:hidden;background:#eee}
#fill{height:100%;width:0;background:linear-gradient(90deg,#5ad17a,#2bb673);transition:width .3s}
.info{display:flex;justify-content:space-between;font-size:15px}
ul{list-style:none;margin:8px 0;padding:0;flex:1}
li{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:21px;animation:pop .25s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.box{width:38px;height:38px;border:3px solid #222;border-radius:5px;background:#fff;font-size:24px;line-height:1;flex:none;color:#2bb673}
.t{flex:1;word-break:break-word}
li.done .t{text-decoration:line-through;opacity:.5}
.x{background:none;border:none;font-size:28px;width:44px;height:44px;color:#222}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:18px}
#reset{border:2px solid #222;background:#fff;border-radius:6px;padding:8px 12px;color:#1a1a5e}
#msg{text-align:center;min-height:28px;font-size:18px;color:#c0392b}
.win{color:#2bb673!important;font-weight:bold}
</style>
</head>
<body>
<div class="app">
<h1>MY TO-DO LIST</h1>
<form class="row" id="f">
<input type="text" id="in" placeholder="add a task..." maxlength="40" autocomplete="off">
<button id="add" type="submit">ADD</button>
</form>
<div class="bar"><div id="fill"></div></div>
<div class="info"><span>⭐ Score: <b id="sc">0</b></span><span>🔥 Combo: <b id="cb">0</b></span></div>
<ul id="list"></ul>
<div id="msg"></div>
<div class="foot"><span id="left"></span><button id="reset">🔄 Restart</button></div>
</div>
<script>
const start=()=>[{t:"buy milk",d:0},{t:"math homework",d:0},{t:"call grandma",d:0}];
let tasks=start(),score=0,combo=0,msg="",won=false;
const $=id=>document.getElementById(id);
function render(){
  const l=$("list");l.innerHTML="";
  tasks.forEach((k,i)=>{
    const li=document.createElement("li");if(k.d)li.className="done";
    const b=document.createElement("button");b.className="box";b.textContent=k.d?"✔":"";
    b.onclick=()=>{
      if(k.d){k.d=0;score=Math.max(0,score-10);combo=0;msg="Oops, back on the list!";}
      else{k.d=1;combo++;score+=10*combo;msg=combo>1?"Combo x"+combo+"! 🔥":"Nice one! ✨";}
      render();
    };
    const s=document.createElement("span");s.className="t";s.textContent=k.t;
    const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","delete");
    x.onclick=()=>{tasks.splice(i,1);msg="Task removed";combo=0;render();};
    li.append(b,s,x);l.appendChild(li);
  });
  const n=tasks.filter(k=>!k.d).length,dn=tasks.length-n;
  $("left").textContent=n+" task"+(n==1?"":"s")+" left";
  $("sc").textContent=score;$("cb").textContent=combo;
  $("fill").style.width=tasks.length?dn/tasks.length*100+"%":"0";
  const m=$("msg");
  if(tasks.length&&n==0){m.textContent="🎉 YOU WIN! All done! Final score "+score;m.className="win";}
  else if(tasks.length==0){m.textContent="Empty list! Add a task to play.";m.className="";}
  else{m.textContent=msg;m.className="";}
}
$("f").onsubmit=e=>{
  e.preventDefault();
  const v=$("in").value.trim();
  if(!v){msg="Type a task first!";render();return;}
  tasks.push({t:v,d:0});$("in").value="";msg="Added! Now finish it 💪";render();
};
$("reset").onclick=()=>{tasks=start();score=0;combo=0;msg="Fresh start!";render();};
render();
</script>
</body>
</html>
