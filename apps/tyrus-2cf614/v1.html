</style></head><body>
<div id="app"><canvas id="cv"></canvas>
<div id="hud"></div>
<button class="b" id="snd">🔇</button>
<div id="ov"><h1 id="t">🌸 Flower Fight 🌼</h1><p id="m">Two stick figures. One silly petal duel.<br>Whack your rival with your flower and dodge their swing!</p><p id="s"></p><button class="b" id="go">Play</button><p>Keys: ← → / A D to move · Space to whack</p></div>
<div id="bar"><div class="mv"><button class="b" id="L">◀</button><button class="b" id="R">▶</button></div><button class="b" id="hit">🌸 WHACK</button></div></div>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),$=i=>document.getElementById(i);

addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a'||k=='A')held.l=1;if(k=='ArrowRight'||k=='d'||k=='D')held.r=1;if(k==' '||k=='ArrowUp'||k=='w'){e.preventDefault();if(!e.repeat){if(mode!='play')start();else swing()}}});

rs();P={x:W*.25,vx:0,at:0,did:0,inv:0,kb:0};mkE();E.x=W*.25+90;E.st='stag';E.t=99;
