<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Timer</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;font-family:"Comic Sans MS","Segoe Print",cursive,sans-serif;color:#1a1a5e}
  .card{width:min(92vw,380px);border:3px solid #222;border-radius:8px;padding:22px 20px;background:#fffdf8;text-align:center;box-shadow:6px 6px 0 #d9dcf0}
  h1{margin:0 0 18px;font-size:1.7rem;letter-spacing:1px}
  .ring{position:relative;width:250px;height:250px;margin:0 auto 22px}
  svg{width:100%;height:100%;transform:rotate(-90deg)}
  circle{fill:none;stroke-width:7}
  .bg{stroke:#222}
  .fg{stroke:#5b6bd6;stroke-linecap:round;transition:stroke-dashoffset .4s linear}
  .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.4rem;font-weight:bold}
  .btns{display:flex;gap:12px}
  button{flex:1;min-height:56px;font:inherit;font-size:1.3rem;color:#1a1a5e;background:#fff;border:3px solid #222;border-radius:6px;cursor:pointer}
  button:active{transform:scale(.96);background:#e8eaff}
  #msg{min-height:1.4em;margin:14px 0 0;color:#2a7a4b}
  .s{margin-top:8px;font-size:1.2rem}
</style>
</head>
<body>
<div class="card">
  <h1>STUDY TIMER</h1>
  <div class="ring">
    <svg viewBox="0 0 100 100">
      <circle class="bg" cx="50" cy="50" r="45" style="stroke-width:2"/>
      <circle class="fg" id="fg" cx="50" cy="50" r="45" style="stroke-width:3" stroke-dasharray="282.74" stroke-dashoffset="0"/>
    </svg>
    <div class="time" id="time">25:00</div>
  </div>
  <div class="btns">
    <button id="start">START</button>
    <button id="reset">RESET</button>
  </div>
  <p id="msg"></p>
  <div class="s">Sessions done: <span id="count">0</span></div>
</div>
<script>
  const TOTAL=25*60;
  let left=TOTAL,timer=null,count=0;
  const $=id=>document.getElementById(id);
  function render(){
    const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');
    $('time').textContent=m+':'+s;
    $('fg').style.strokeDashoffset=282.74*(1-left/TOTAL);
    document.title=(timer?m+':'+s+' - ':'')+'Study Timer';
  }
  function stop(){clearInterval(timer);timer=null;$('start').textContent='START'}
  function tick(){
    left--;
    if(left<=0){
      left=0;stop();count++;
      $('count').textContent=count;
      $('msg').textContent='🎉 Session complete! Take a break.';
      render();
      left=TOTAL;
      return;
    }
    render();
  }
  $('start').onclick=()=>{
    if(timer){stop();$('start').textContent='RESUME';return}
    if(left===TOTAL||left<=0){left=TOTAL}
    $('msg').textContent='Focus time! 📚';
    $('start').textContent='PAUSE';
    timer=setInterval(tick,1000);
  };
  $('reset').onclick=()=>{
    stop();left=TOTAL;$('msg').textContent='';render();
  };
  render();
</script>
</body>
</html>
