<style>
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0;height:100%;overflow:hidden}
:root{--bg:#faf6ee;--ink:#1c1b5e;--a:#2f6fed;--b:#ff7a59;--c:#2fbf8f;--d:#ffd23f;--r:16px}
body{font-family:"Segoe Print","Comic Sans MS",system-ui,sans-serif;color:var(--ink);background:repeating-linear-gradient(var(--bg) 0 38px,#d8dcf0 38px 40px);display:flex;flex-direction:column;height:100dvh}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:18px;font-weight:700}
#top h1{margin:0;font-size:20px;flex:1}
#top button{min-height:44px;min-width:44px;border:2px solid var(--ink);background:#fff;border-radius:12px;font-size:20px}
#w{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(250,246,238,.9);text-align:center;padding:20px}
#ov h2{font-size:clamp(28px,7vw,48px);margin:0}
#ov p{margin:0;font-size:18px}
.big{min-height:64px;padding:0 40px;font-size:26px;border:3px solid var(--ink);background:var(--b);color:#fff;border-radius:var(--r);font-family:inherit;font-weight:700;transition:transform .1s;box-shadow:0 5px 0 var(--ink)}
.big:active,#ct button:active{transform:scale(.93)}
#ct{display:flex;gap:12px;padding:10px 12px}
#ct button{flex:1;min-height:64px;font-size:30px;border:3px solid var(--ink);background:var(--a);color:#fff;border-radius:var(--r);touch-action:none;transition:transform .1s}

</style></head><body>
<div id="top"><h1>📝 Task Catcher</h1><span id="hud">0 ❤️3</span><button id="snd">🔇</button></div>
<div id="w"><canvas id="c"></canvas>
<div id="ov"><h2>MY TO-DO LIST</h2><p>Catch the ✅ tasks, dodge the ❌ ones!<br>Use ◀ ▶ buttons or arrow keys / A D</p><p id="bs">Best: 0</p><button class="big" id="go">Play</button></div></div>
<div id="ct"><button id="L">◀</button><button id="R">▶</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),ov=document.getElementById('ov'),hud=document.getElementById('hud');
let W,H,dpr,held={l:0,r:0},run=0,score=0,lives=3,best=0,px,items=[],ps=[],shake=0,flash=0,t=0,sp=1,spawn=0,snd=0,ac;
const tasks=['buy milk','math homework','call grandma','walk dog','read book','clean room'];
function rs(){dpr=devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}

addEventListener('blur',clr);document.addEventListener('visibilitychange',()=>{if(document.hidden)clr()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k=='arrowleft'||k=='a')held.l=1;if(k=='arrowright'||k=='d')held.r=1;if(k==' '&&!run)start();if(k.startsWith('arrow')||k==' ')e.preventDefault()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k=='arrowleft'||k=='a')held.l=0;if(k=='arrowright'||k=='d')held.r=0});

document.getElementById('go').onclick=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();start()};
function upd(){hud.textContent=score+' ❤️'.repeat(0)+' '+'❤️'.repeat(Math.max(lives,0))}
function burst(X,Y,col){for(let i=0;i<14;i++){const a=Math.random()*6.28,s=60+Math.random()*160;ps.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6,col})}}
function end(){run=0;best=Math.max(best,score);ov.classList.remove('hid');ov.querySelector('h2').textContent='Game Over';ov.querySelector('p').innerHTML='You finished <b>'+score+'</b> tasks!';document.getElementById('bs').textContent='Best: '+best;document.getElementById('go').textContent='Play again';beep(150,.5,'sawtooth')}
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min((n-last)/1e3,.05);last=n;t+=dt;

items.forEach(i=>i.y+=i.v*dt);
const py=H-50;
items=items.filter(i=>{if(Math.abs(i.x-px)<60&&Math.abs(i.y-py)<30){if(i.bad){lives--;shake=.3;flash=.25;burst(i.x,i.y,'#ff7a59');beep(120,.25,'sawtooth');if(lives<=0)end()}else{score++;burst(i.x,i.y,'#2fbf8f');beep(600+score%8*60,.08)}upd();return 0}
if(i.y>H+30){return 0}return 1})}
ps.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});ps=ps.filter(p=>p.l>0);shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);
x.save();x.clearRect(0,0,W,H);if(shake>0)x.translate((Math.random()-.5)*14,(Math.random()-.5)*14);

items.forEach(i=>{x.font='30px serif';x.fillText(i.bad?'❌':'✅',i.x,i.y);x.font='bold 14px "Segoe Print",system-ui';x.fillStyle=i.bad?'#ff7a59':'#1c1b5e';x.fillText(i.t,i.x,i.y+22)});
const py=H-50;x.fillStyle='#fff';x.strokeStyle='#1c1b5e';x.lineWidth=3;x.beginPath();x.roundRect(px-48,py-6,96,34,10);x.fill();x.stroke();x.fillStyle='#1c1b5e';x.font='bold 15px system-ui';x.fillText('📋 LIST',px,py+17);
ps.forEach(p=>{x.globalAlpha=p.l/.6;x.fillStyle=p.col;x.fillRect(p.x,p.y,6,6)});x.globalAlpha=1;

</script></body></html>
