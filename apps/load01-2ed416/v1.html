<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony's Pizza</title>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}
body{background:#fbe9d0;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:480px;height:100vh;background:#fffaf2;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 30px #0003}
header{background:#c62828;color:#fff;padding:16px;font-size:24px;font-weight:800;letter-spacing:1px}
main{flex:1;overflow:auto;padding:14px;position:relative}
.screen{display:none;animation:in .3s}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.card{background:#fff;border:2px solid #222;border-radius:16px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.pic{width:76px;height:76px;border-radius:50%;border:3px solid #222;display:flex;align-items:center;justify-content:center;font-size:42px;background:#ffe9a8}
.info{flex:1}
.info b{font-size:19px;display:block}
.info span{color:#555}
button{border:0;border-radius:12px;background:#2e7d32;color:#fff;font-weight:700;font-size:16px;padding:12px 16px;min-height:48px;cursor:pointer}
button:active{transform:scale(.95)}
.cart{background:#fff;border-top:3px solid #222;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cart div{font-weight:700}
.cart button{background:#c62828}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd;font-size:18px;align-items:center}
.row button{padding:6px 12px;min-height:36px;background:#888;margin-left:6px}
.big{font-size:22px;font-weight:800;margin:16px 0}
.msg{text-align:center;padding:30px 10px;font-size:20px}
</style>
</head>
<body>
<div id="app">
<header>🍕 TONY'S PIZZA</header>
<main>
<div class="screen on" id="menu"></div>
<div class="screen" id="checkout"></div>
</main>
<div class="cart">
<div id="sum">Your cart: 0 items<br>Total $0</div>
<button id="go">CHECKOUT</button>
</div>
</div>
<script>
const pizzas=[{n:"Margherita",p:10,e:"🍅"},{n:"Pepperoni",p:12,e:"🍕"},{n:"Veggie",p:11,e:"🥦"}];
const cart=[0,0,0];
let view="menu";
const $=id=>document.getElementById(id);
function count(){return cart.reduce((a,b)=>a+b,0)}
function total(){return cart.reduce((a,q,i)=>a+q*pizzas[i].p,0)}
function show(v){view=v;$("menu").classList.toggle("on",v=="menu");$("checkout").classList.toggle("on",v!="menu");$("go").textContent=v=="menu"?"CHECKOUT":"← MENU";render()}
function add(i,d){cart[i]=Math.max(0,cart[i]+d);render()}
function render(){
$("sum").innerHTML="Your cart: "+count()+" item"+(count()==1?"":"s")+"<br>Total $"+total();
$("menu").innerHTML=pizzas.map((z,i)=>`<div class="card"><div class="pic">${z.e}</div><div class="info"><b>${z.n}</b><span>$${z.p}${cart[i]?" · in cart: "+cart[i]:""}</span></div><button onclick="add(${i},1)">ORDER</button></div>`).join("");
if(view=="done")$("checkout").innerHTML='<div class="msg">🎉 Thank you!<br>Your pizza is in the oven. 🔥</div>';
else if(!count())$("checkout").innerHTML='<div class="msg">Your cart is empty 🛒<br>Go order a pizza!</div>';
else $("checkout").innerHTML=pizzas.map((z,i)=>cart[i]?`<div class="row"><span>${z.e} ${z.n} × ${cart[i]}</span><span>$${z.p*cart[i]}<button onclick="add(${i},-1)">−</button><button style="background:#2e7d32" onclick="add(${i},1)">+</button></span></div>`:"").join("")+`<div class="big">Total: $${total()}</div><button style="width:100%" onclick="pay()">PLACE ORDER</button>`;
}
function pay(){cart.fill(0);view="done";render()}
$("go").onclick=()=>show(view=="menu"?"checkout":"menu");
render();
</script>
</body>
</html>
