<title>Tony's Pizza</title>
<style>
:root{--r:#d6342c;--o:#f59f2b;--g:#3f9b4a;--d:#2a1a16;--l:#fff7ea;--c:#fff;--rad:20px}
*{box-sizing:border-box;margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:manipulation;overscroll-behavior:none;overflow:hidden}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 20% 0,#ffd9a0,transparent 50%),linear-gradient(#ffe9c7,#ffc9a0);color:var(--d);display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:var(--l);position:relative;overflow:hidden;box-shadow:0 0 60px #0003}
header{background:var(--r);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font-size:22px;font-weight:800;letter-spacing:.5px}
header button{background:#fff3;border:0;color:#fff;font-size:22px;width:56px;height:56px;border-radius:50%;cursor:pointer}
main{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;padding:16px;transition:transform .35s,opacity .35s;display:flex;flex-direction:column;gap:14px}
.scr.off{transform:translateX(40px);opacity:0;pointer-events:none}
.card{background:var(--c);border-radius:var(--rad);padding:14px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px #0001}
.pz{font-size:60px;width:84px;height:84px;display:grid;place-items:center;background:#ffe3b8;border-radius:50%;flex:none}
.inf{flex:1}.inf b{font-size:19px;display:block}.inf small{color:#7a5a50}.pr{font-size:20px;font-weight:800;color:var(--r);margin-top:4px}
.btn{min-height:56px;border:0;border-radius:16px;background:var(--o);color:var(--d);font-weight:800;font-size:16px;padding:0 18px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.93)}.btn.g{background:var(--g);color:#fff}
.bar{background:var(--d);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar div{font-size:15px}.bar b{font-size:20px;color:var(--o)}
nav{display:flex;background:#fff;border-top:1px solid #0002}
nav button{flex:1;min-height:60px;border:0;background:none;font-size:13px;font-weight:700;color:#8a6a60;cursor:pointer}
nav button.on{color:var(--r)}nav span{display:block;font-size:22px}
.row{display:flex;align-items:center;gap:10px}.row .inf{flex:1}
.q{width:56px;height:56px;border-radius:50%;border:0;background:#ffe3b8;font-size:22px;font-weight:800;cursor:pointer}.q:active{transform:scale(.9)}

</style></head><body>
<div id="app">
<header><span>🍕 TONY'S PIZZA</span><button id="snd" aria-label="sound">🔇</button></header>
<main>
<section class="scr" id="menu"></section>
<section class="scr off" id="cart"></section>
</main>
<div class="bar"><div>🛒 <b id="cnt">0</b> items<br>Total <b id="tot">$0</b></div><button class="btn g" id="co">CHECKOUT</button></div>
<nav><button id="t1" class="on"><span>🍕</span>Menu</button><button id="t2"><span>🛒</span>Cart</button></nav>
</div>
<script>
const P=[{n:"Margherita",p:10,e:"🍕",d:"Tomato, mozzarella, basil"},{n:"Pepperoni",p:12,e:"🌶️",d:"Spicy pepperoni, extra cheese"},{n:"Veggie",p:11,e:"🥦",d:"Peppers, olives, mushrooms"}];

const $=i=>document.getElementById(i);
document.addEventListener("contextmenu",e=>e.preventDefault());
function beep(f,t=.1){if(mute||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="triangle";g.gain.value=.12;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+t)}

function count(){return q.reduce((a,b)=>a+b,0)}
function total(){return q.reduce((a,b,i)=>a+b*P[i].p,0)}
function add(i,d){q[i]=Math.max(0,q[i]+d);beep(d>0?700:400);draw();const c=$("cnt");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}
function draw(){
$("cnt").textContent=count();$("tot").textContent="$"+total();
$("menu").innerHTML=P.map((x,i)=>`<div class="card"><div class="pz">${x.e}</div><div class="inf"><b>${x.n}</b><small>${x.d}</small><div class="pr">$${x.p}</div></div><button class="btn" data-a="${i}">ORDER${q[i]?" ("+q[i]+")":""}</button></div>`).join("");
const items=P.map((x,i)=>q[i]?`<div class="card row"><div class="pz" style="width:56px;height:56px;font-size:32px">${x.e}</div><div class="inf"><b>${x.n}</b><div class="pr">$${x.p*q[i]}</div></div><button class="q" data-m="${i}">−</button><b>${q[i]}</b><button class="q" data-p="${i}">+</button></div>`:"").join("");
$("cart").innerHTML=count()?items:`<div class="empty"><div class="big">🛒</div>Your cart is empty.<br>Pick a pizza from the menu!</div>`}
function go(n){tab=n;$("menu").classList.toggle("off",n!=1);$("cart").classList.toggle("off",n!=2);$("t1").className=n==1?"on":"";$("t2").className=n==2?"on":"";beep(520,.05)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.a!==undefined)add(+d.a,1);else if(d.p!==undefined)add(+d.p,1);else if(d.m!==undefined)add(+d.m,-1);else if(d.again!==undefined){q.fill(0);draw();go(1)}});
$("t1").onclick=()=>go(1);$("t2").onclick=()=>go(2);
$("co").onclick=()=>{if(!count()){go(2);beep(200,.2);return}
const n=count(),t=total();q.fill(0);draw();go(2);beep(880,.2);setTimeout(()=>beep(1100,.25),150);
$("cart").innerHTML=`<div class="done"><div class="big">🎉</div><h2>Thank you!</h2><p style="margin:10px 0 20px">Your ${n} pizza${n>1?"s are":" is"} in the oven.<br>Paid $${t}. Ready in 20 minutes.</p><button class="btn g" data-again="1">Order more</button></div>`};
draw();
</script></body></html>
