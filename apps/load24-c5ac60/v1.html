<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Timer</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;font-family:"Segoe UI",system-ui,sans-serif;color:#1a1a5e}
  .card{width:min(92vw,380px);background:#fff;border:3px solid #222;border-radius:18px;padding:24px 20px;text-align:center;box-shadow:6px 6px 0 #d9ddf0}
  h1{margin:0 0 18px;font-size:1.7rem;letter-spacing:2px}
  .ring{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:0 auto}
  svg{width:100%;height:100%;transform:rotate(-90deg)}
  circle{fill:none;stroke-width:8}
  .bg{stroke:#e3e6f5}
  .fg{stroke:#3b4cca;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
  .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.2rem;font-weight:700;font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:12px;margin:24px 0 16px}
  button{flex:1;padding:16px 0;font-size:1.2rem;font-weight:700;border:3px solid #222;border-radius:10px;background:#fff;color:#1a1a5e;cursor:pointer}
  button:active{transform:scale(.96)}
  #start{background:#3b4cca;color:#fff}
  #msg{min-height:1.4em;color:#2a8a4a;font-weight:600}
  .s{font-size:1.15rem}
</style>
</head>
<body>
<div class="card">
  <h1>STUDY TIMER</h1>
  <div class="ring">
    <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" id="fg" cx="50" cy="50" r="45" stroke-dasharray="282.74" stroke-dashoffset="0"/></svg>
    <div class="time" id="time">25:00</div>
  </div>
  <div class="btns">
    <button id="start">START</button>
    <button id="reset">RESET</button>
  </div>
  <div id="msg"></div>
  <div class="s">Sessions done: <b id="count">0</b></div>
</div>
<script>
  const TOTAL=25*60;
  let left=TOTAL,timer=null,sessions=0;
  const $=id=>document.getElementById(id);
  function draw(){
    const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');
    $('time').textContent=m+':'+s;
    $('fg').style.strokeDashoffset=282.74*(1-left/TOTAL);
    document.title=(timer?m+':'+s+' - ':'')+'Study Timer';
  }
  function stop(){clearInterval(timer);timer=null;$('start').textContent='START'}
  $('start').onclick=()=>{
    if(timer){stop();$('msg').textContent='Paused';draw();return}
    if(left===0)left=TOTAL;
    $('msg').textContent='Focus time! 📚';
    $('start').textContent='PAUSE';
    timer=setInterval(()=>{
      left--;
      if(left<=0){
        left=0;stop();sessions++;
        $('count').textContent=sessions;
        $('msg').textContent='🎉 Session complete! Take a break.';
      }
      draw();
    },1000);
  };
  $('reset').onclick=()=>{stop();left=TOTAL;$('msg').textContent='';draw()};
  draw();
</script>
</body>
</html>
