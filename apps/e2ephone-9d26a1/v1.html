<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do List</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef3fb;font-family:"Segoe Print","Comic Sans MS",cursive,sans-serif;color:#1a1a5c}
.app{width:min(92vw,440px);min-height:520px;background:#fff;border:3px solid #222;border-radius:6px;padding:22px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #c9d4ea}
h1{margin:0 0 16px;font-size:28px;text-align:center;letter-spacing:1px}
form{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px;border:3px solid #222;border-radius:4px;color:#1a1a5c}
button.add{font:inherit;font-size:18px;padding:0 16px;border:3px solid #222;background:#dfe8ff;color:#1a1a5c;border-radius:4px;cursor:pointer;min-height:48px}
button.add:active{background:#b9ccff}
ul{list-style:none;padding:0;margin:18px 0;flex:1}
li{display:flex;align-items:center;gap:14px;padding:10px 0;font-size:22px}
li .box{width:36px;height:36px;border:3px solid #222;border-radius:4px;background:#fff;cursor:pointer;font-size:24px;line-height:1;color:#2a9d4a;padding:0;flex:none}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;opacity:.5}
li .x{background:none;border:none;font-size:32px;cursor:pointer;color:#222;width:44px;height:44px;flex:none}
li .x:hover{color:#d33}
.foot{font-size:18px;border-top:2px dashed #b9c4dd;padding-top:12px}
.empty{text-align:center;opacity:.6;margin-top:30px}
</style>
</head>
<body>
<div class="app">
<h1>MY TO-DO LIST</h1>
<form id="f"><input type="text" id="t" placeholder="add a task..." maxlength="60" autocomplete="off"><button class="add" type="submit">ADD</button></form>
<ul id="list"></ul>
<div class="foot" id="foot"></div>
</div>
<script>
var tasks=[{t:"buy milk",d:false},{t:"math homework",d:false},{t:"call grandma",d:false}];
var list=document.getElementById("list"),foot=document.getElementById("foot"),inp=document.getElementById("t");
function render(){
list.innerHTML="";
if(!tasks.length){list.innerHTML='<div class="empty">All done! 🎉</div>'}
tasks.forEach(function(k,i){
var li=document.createElement("li");if(k.d)li.className="done";
var b=document.createElement("button");b.className="box";b.textContent=k.d?"✓":"";b.setAttribute("aria-label","check");
b.onclick=function(){k.d=!k.d;render()};
var s=document.createElement("span");s.textContent=k.t;
var x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","delete");
x.onclick=function(){tasks.splice(i,1);render()};
li.append(b,s,x);list.appendChild(li);
});
var n=tasks.filter(function(k){return !k.d}).length;
foot.textContent=n+(n==1?" task left":" tasks left");
}
document.getElementById("f").onsubmit=function(e){
e.preventDefault();
var v=inp.value.trim();
if(v){tasks.push({t:v,d:false});inp.value="";render()}
inp.focus();
};
render();
</script>
</body>
</html>
