<title>Pure Radiance</title>
<style>

*{box-sizing:border-box;margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

.ic{background:var(--pl);color:var(--pd);min-width:56px;padding:0 14px}
#cb{position:relative}
#cnt{position:absolute;top:2px;right:2px;background:var(--p);color:#fff;border-radius:99px;font-size:.75rem;min-width:22px;height:22px;display:grid;place-items:center}
.hero{text-align:center;padding:28px 16px 8px}

.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 8px 24px #f06a9b30;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;transition:transform .2s}
.card:hover{transform:translateY(-4px)}

.add{background:var(--p);color:#fff;width:100%}

<header><h1>Pure Radiance</h1><button class="ic" id="snd">🔇</button><button class="ic" id="cb">🛍️<span id="cnt">0</span></button></header>
<div class="hero"><h2 style="font-family:Georgia,serif;font-style:italic;color:var(--pd)">Glow from the inside out ✨</h2><p>Gentle skin care, made simple.</p></div>
<div class="grid" id="grid"></div>
<div id="ov"><aside><div class="top"><h2>Your cart</h2><button class="ic" id="cl">✕</button></div><div id="list"></div><div class="tot"><span>Total</span><span id="tt">$0.00</span></div><button class="co" id="co">Checkout</button></aside></div>
<script>

</script></body></html>
