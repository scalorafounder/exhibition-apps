<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf7f0;background-image:repeating-linear-gradient(#faf7f0 0 31px,#d9dff0 32px);font-family:"Comic Sans MS","Segoe Print",cursive;color:#1a1a5e}
.card{width:min(94vw,460px);min-height:80vh;background:#fffdf7;border:4px solid #222;border-radius:6px;padding:18px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #2224}
h1{text-align:center;margin:6px 0 14px;font-size:28px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px;border:3px solid #222;border-radius:4px;color:#1a1a5e}
button{font:inherit;cursor:pointer}
#add{border:3px solid #222;background:#ffe27a;font-size:18px;padding:0 16px;border-radius:4px;color:#1a1a5e}
#bar{height:14px;border:2px solid #222;border-radius:8px;margin:12px 0;overflow:hidden;background:#fff}
#fill{height:100%;width:0;background:#4cc36b;transition:.3s}
ul{list-style:none;padding:0;margin:0;flex:1;overflow:auto}
li{display:flex;align-items:center;gap:12px;padding:10px 4px;font-size:21px;animation:pop .25s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.box{width:36px;height:36px;border:3px solid #222;background:#fff;border-radius:4px;font-size:24px;line-height:1;flex:none}
.t{flex:1;word-break:break-word}
.done .t{text-decoration:line-through;opacity:.5}
.x{background:none;border:none;font-size:28px;width:44px;height:44px;color:#222}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-top:10px}
#msg{text-align:center;font-size:20px;min-height:28px;margin-top:6px}
#reset{border:2px solid #222;background:#fff;border-radius:6px;padding:6px 12px;color:#1a1a5e}
</style>
</head>
<body>
<div class="card">
<h1>MY TO-DO LIST</h1>
<form class="row" id="f"><input type="text" id="in" placeholder="add a task..." maxlength="40" autocomplete="off"><button id="add" type="submit">ADD</button></form>
<div id="bar"><div id="fill"></div></div>
<ul id="list"></ul>
<div id="msg"></div>
<div class="foot"><span id="left"></span><span>⭐ <b id="score">0</b> <button id="reset">Restart</button></span></div>
</div>
<script>
let tasks,score,id;
const $=s=>document.getElementById(s);
function init(){tasks=[{id:1,t:"buy milk",d:0},{id:2,t:"math homework",d:0},{id:3,t:"call grandma",d:0}];id=4;score=0;render()}
function render(){
const l=$("list");l.innerHTML="";
tasks.forEach(k=>{
const li=document.createElement("li");if(k.d)li.className="done";
const b=document.createElement("button");b.className="box";b.textContent=k.d?"✔":"";
b.onclick=()=>{k.d=!k.d;score+=k.d?10:-10;if(score<0)score=0;
msgSet(k.d?["Nice!","Great job!","Boom! +10","You rock!"][Math.floor(Math.random()*4)]:"Back on the list");render()};
const s=document.createElement("span");s.className="t";s.textContent=k.t;
const x=document.createElement("button");x.className="x";x.textContent="✕";
x.onclick=()=>{tasks=tasks.filter(z=>z!==k);msgSet("Deleted");render()};
li.append(b,s,x);l.appendChild(li)});
const n=tasks.filter(k=>!k.d).length,dn=tasks.length-n;
$("left").textContent=n+(n==1?" task left":" tasks left");
$("score").textContent=score;
$("fill").style.width=tasks.length?dn/tasks.length*100+"%":"0";
if(tasks.length&&n==0)msgSet("🏆 YOU WIN! All done! Press Restart to play again.");
else if(!tasks.length)msgSet("Empty list! Add a task.");
}
function msgSet(m){$("msg").textContent=m}
$("f").onsubmit=e=>{e.preventDefault();const v=$("in").value.trim();if(!v)return;
tasks.push({id:id++,t:v,d:0});$("in").value="";msgSet("Added! Finish it for +10");render()};
$("reset").onclick=()=>{init();msgSet("New game! Check off all tasks to win.")};
init();msgSet("Check off all tasks to win!");
</script>
</body>
</html>
