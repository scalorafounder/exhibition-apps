<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List Quest</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef2fb;font-family:"Comic Sans MS","Segoe Print",cursive;color:#1a1a5e}
.app{width:min(94vw,440px);min-height:560px;background:#fff;border:4px solid #111;border-radius:6px;padding:18px;display:flex;flex-direction:column;box-shadow:8px 8px 0 #c9d3f5}
h1{margin:4px 0 12px;text-align:center;letter-spacing:2px;font-size:26px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px;border:3px solid #111;border-radius:4px;color:#1a1a5e}
button{font:inherit;cursor:pointer}
.add{font-size:18px;padding:0 16px;border:3px solid #111;background:#ffe066;color:#1a1a5e;border-radius:4px;min-height:48px}
.add:active{transform:scale(.95)}
.stats{display:flex;justify-content:space-between;margin:12px 0 4px;font-size:15px}
.bar{height:14px;border:2px solid #111;border-radius:8px;overflow:hidden;background:#eee}
.bar div{height:100%;width:0;background:#4cd37b;transition:width .4s}
ul{list-style:none;padding:0;margin:12px 0;flex:1}
li{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:21px;animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.box{width:40px;height:40px;border:3px solid #111;border-radius:5px;background:#fff;font-size:24px;line-height:1;flex:none;color:#1a9e4a}
.t{flex:1;word-break:break-word}
.done .t{text-decoration:line-through;opacity:.5}
.x{background:none;border:none;font-size:30px;width:44px;height:44px;color:#111}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.reset{border:2px solid #111;background:#fff;border-radius:6px;padding:8px 12px;color:#1a1a5e}
.msg{text-align:center;font-size:20px;min-height:28px;color:#c0392b}
.win{color:#1a9e4a}
.star{position:fixed;pointer-events:none;font-size:28px;animation:fly 1s forwards}
@keyframes fly{to{transform:translateY(-120px) rotate(60deg);opacity:0}}
</style>
</head>
<body>
<div class="app">
<h1>MY TO-DO LIST</h1>
<form class="row" id="f"><input id="in" placeholder="add a task..." maxlength="40" autocomplete="off"><button class="add">ADD</button></form>
<div class="stats"><span>⭐ Score: <b id="sc">0</b></span><span>Level: <b id="lv">1</b></span></div>
<div class="bar"><div id="pb"></div></div>
<ul id="ul"></ul>
<div class="msg" id="msg"></div>
<div class="foot"><span id="left"></span><button class="reset" id="rs">↻ Restart</button></div>
</div>
<script>
let tasks,score,id,ul=document.getElementById('ul');
const $=i=>document.getElementById(i);
function init(){tasks=[{id:1,t:"buy milk",d:0},{id:2,t:"math homework",d:0},{id:3,t:"call grandma",d:0}];id=4;score=0;$('msg').textContent="Check off every task to win!";$('msg').className="msg win";render()}
function burst(e){for(let i=0;i<5;i++){const s=document.createElement('div');s.className='star';s.textContent='⭐';s.style.left=(e.clientX-14+Math.random()*50-25)+'px';s.style.top=(e.clientY-14)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
function render(){
ul.innerHTML='';
tasks.forEach(k=>{
const li=document.createElement('li');if(k.d)li.className='done';
const b=document.createElement('button');b.className='box';b.textContent=k.d?'✔':'';
b.onclick=e=>{k.d=!k.d;if(k.d){score+=10;burst(e)}else score=Math.max(0,score-10);render()};
const s=document.createElement('span');s.className='t';s.textContent=k.t;
const x=document.createElement('button');x.className='x';x.textContent='✕';
x.onclick=()=>{if(k.d)score=Math.max(0,score-10);tasks=tasks.filter(z=>z!==k);score+=0;render()};
li.append(b,s,x);ul.appendChild(li)});
const n=tasks.filter(k=>!k.d).length,dn=tasks.length-n;
$('left').textContent=n+(n==1?' task left':' tasks left');
$('sc').textContent=score;$('lv').textContent=1+Math.floor(score/50);
$('pb').style.width=(tasks.length?dn/tasks.length*100:0)+'%';
if(tasks.length&&n==0){$('msg').textContent="🎉 You win! All tasks done! Add more or restart.";$('msg').className="msg win"}
else if(!tasks.length){$('msg').textContent="Empty list! Add a task to play.";$('msg').className="msg"}
else{$('msg').textContent="Tap a box to score +10!";$('msg').className="msg win"}
}
$('f').onsubmit=e=>{e.preventDefault();const v=$('in').value.trim();if(!v)return;tasks.push({id:id++,t:v,d:0});$('in').value='';render()};
$('rs').onclick=init;
init();
</script>
</body>
</html>
