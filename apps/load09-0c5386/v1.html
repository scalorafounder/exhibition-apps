<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Timer</title>
<style>
body{margin:0;min-height:100vh;background:#faf7f0;font-family:"Comic Sans MS",cursive,sans-serif;color:#1a1a5e;display:flex;justify-content:center;align-items:center}
.app{width:min(92vw,380px);border:3px solid #222;border-radius:12px;padding:20px;text-align:center;background:#fffdf8}
h1{font-size:1.8rem;margin:0 0 16px;letter-spacing:2px}
.circle{width:240px;height:240px;border-radius:50%;border:5px solid #222;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:3.4rem;font-weight:bold;background:conic-gradient(#b9c4ff var(--p,0%),#fff 0)}
.circle span{background:#fffdf8;border-radius:50%;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:12px}
button{flex:1;font:inherit;font-size:1.3rem;padding:16px;border:3px solid #222;background:#fff;color:#1a1a5e;cursor:pointer;border-radius:4px}
button:active{background:#dde3ff}
p{font-size:1.2rem;margin:18px 0 4px}
#msg{min-height:1.4em;font-size:1rem}
</style>
</head>
<body>
<div class="app">
<h1>STUDY TIMER</h1>
<div class="circle" id="c"><span id="t">25:00</span></div>
<div class="row"><button id="s">START</button><button id="r">RESET</button></div>
<p>Sessions done: <b id="n">0</b></p>
<div id="msg">Ready to focus? 📚</div>
</div>
<script>
const T=25*60;let left=T,run=false,id=null,n=0;
const t=document.getElementById('t'),s=document.getElementById('s'),c=document.getElementById('c'),m=document.getElementById('msg');
function draw(){
const mm=String(Math.floor(left/60)).padStart(2,'0'),ss=String(left%60).padStart(2,'0');
t.textContent=mm+':'+ss;document.title=mm+':'+ss+' Study Timer';
c.style.setProperty('--p',((T-left)/T*100)+'%');}
function stop(){clearInterval(id);run=false;s.textContent='START';}
s.onclick=()=>{
if(run){stop();s.textContent='RESUME';m.textContent='Paused ⏸️';return;}
if(left===0)left=T;
run=true;s.textContent='PAUSE';m.textContent='Stay focused! 💪';
id=setInterval(()=>{
left--;draw();
if(left<=0){stop();n++;document.getElementById('n').textContent=n;m.textContent='Session complete! 🎉 Take a break.';left=0;draw();}
},1000);};
document.getElementById('r').onclick=()=>{stop();left=T;draw();m.textContent='Timer reset. Ready to focus? 📚';};
draw();
</script>
</body>
</html>
