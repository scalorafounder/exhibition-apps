<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Timer Shop</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS","Segoe Print",cursive,sans-serif;background:#faf7f0;color:#1a1a5e}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:3px solid #222;background:#fff}
h1{margin:0;font-size:1.5rem}
.cartbtn{font:inherit;font-size:1rem;border:3px solid #222;background:#fff;padding:10px 14px;border-radius:8px;cursor:pointer;min-height:44px}
main{max-width:1000px;margin:auto;padding:16px;display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:800px){main{grid-template-columns:2fr 1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:3px solid #222;border-radius:12px;padding:12px;text-align:center}
.pic{width:90px;height:90px;border:3px solid #222;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.card b{display:block}
button.add,button.q,button.co{font:inherit;border:3px solid #222;background:#fff;border-radius:6px;cursor:pointer;min-height:44px;padding:6px 12px;color:#1a1a5e}
button.add{margin-top:8px;width:100%}
button.add:active,button.co:hover{background:#dfe3ff}
aside{background:#fff;border:3px solid #222;border-radius:12px;padding:14px;align-self:start}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 0;border-bottom:1px dashed #99a}
.row span{flex:1}
button.q{min-width:44px;padding:4px 8px}
.total{font-size:1.4rem;margin:12px 0;text-align:right}
button.co{width:100%;background:#1a1a5e;color:#fff}
#thanks{display:none;margin-top:10px;padding:10px;background:#e3ffe6;border:2px solid #2a2;border-radius:8px}
</style>
</head>
<body>
<header><h1>⏱️ Study Timer Shop</h1><button class="cartbtn" onclick="document.querySelector('aside').scrollIntoView({behavior:'smooth'})">🛒 Cart (<span id="cnt">0</span>)</button></header>
<main>
<section><div class="grid" id="grid"></div></section>
<aside>
<h2 style="margin-top:0">Your cart</h2>
<div id="list"></div>
<div class="total">Total: $<span id="tot">0.00</span></div>
<button class="co" onclick="checkout()">Checkout</button>
<div id="thanks">🎉 Thank you for your order! Happy studying!</div>
</aside>
</main>
<script>
var products=[
{n:"Pomodoro Timer",e:"⏲️",p:12.5},
{n:"Sticky Notes",e:"🗒️",p:3.99},
{n:"Gel Pens",e:"🖊️",p:6.25},
{n:"Notebook",e:"📓",p:4.5},
{n:"Highlighters",e:"🖍️",p:5.75},
{n:"Backpack",e:"🎒",p:29.99},
{n:"Desk Lamp",e:"💡",p:18},
{n:"Study Snacks",e:"🍎",p:7.2}
];
var cart={};
var grid=document.getElementById("grid");
products.forEach(function(x,i){
var d=document.createElement("div");d.className="card";
d.innerHTML='<div class="pic">'+x.e+'</div><b>'+x.n+'</b>$'+x.p.toFixed(2)+'<button class="add">Add to cart</button>';
d.querySelector("button").onclick=function(){cart[i]=(cart[i]||0)+1;document.getElementById("thanks").style.display="none";render()};
grid.appendChild(d)});
function chg(i,n){cart[i]+=n;if(cart[i]<=0)delete cart[i];render()}
function render(){
var l=document.getElementById("list"),c=0,t=0;l.innerHTML="";
Object.keys(cart).forEach(function(i){
var x=products[i],q=cart[i];c+=q;t+=q*x.p;
var r=document.createElement("div");r.className="row";
r.innerHTML='<span>'+x.e+' '+x.n+'<br>$'+(q*x.p).toFixed(2)+'</span><button class="q">−</button><b>'+q+'</b><button class="q">+</button><button class="q">🗑️</button>';
var b=r.querySelectorAll("button");
b[0].onclick=function(){chg(i,-1)};
b[1].onclick=function(){chg(i,1)};
b[2].onclick=function(){delete cart[i];render()};
l.appendChild(r)});
if(!c)l.innerHTML="<p>Your cart is empty.</p>";
document.getElementById("cnt").textContent=c;
document.getElementById("tot").textContent=t.toFixed(2)}
function checkout(){
if(!Object.keys(cart).length){alert("Add something first!");return}
cart={};render();document.getElementById("thanks").style.display="block"}
render();
</script>
</body>
</html>
