<title>Brick Blast</title>
<style>
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0;height:100dvh;overflow:hidden;font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#2b1b5e,#0d0a1f);color:#fff}
:root{--a:#ff4d8d;--b:#ffb938;--c:#3ee0c5;--d:#6c5cff;--r:16px}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;padding:8px;gap:8px}
#top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px}
#top span{background:#ffffff18;padding:8px 12px;border-radius:12px}
#snd{background:#ffffff22;color:#fff;border:0;border-radius:12px;padding:8px 12px;font-size:16px;min-height:40px}
#wrap{position:relative;flex:1;min-height:0}
canvas{width:100%;height:100%;display:block;border-radius:var(--r);background:#120d2b;border:2px solid #ffffff33;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0d0a1fcc;border-radius:var(--r);text-align:center;padding:20px}
#ov h1{font-size:44px;margin:0;color:var(--b);text-shadow:0 4px 0 var(--a)}
#ov p{margin:0;font-size:17px;line-height:1.4}
.big{min-height:64px;padding:0 40px;font-size:24px;font-weight:800;border:0;border-radius:var(--r);background:linear-gradient(var(--c),#1bb59c);color:#062;transition:transform .1s;box-shadow:0 5px 0 #0a7}
.big:active,.k:active{transform:scale(.93)}
#ctl{display:flex;gap:10px}
.k{flex:1;min-height:64px;font-size:30px;border:0;border-radius:var(--r);background:var(--d);color:#fff;touch-action:none;box-shadow:0 4px 0 #4435c0;transition:transform .1s}
</style></head><body>
<div id="app">
<div id="top"><span>Score <b id="sc">0</b></span><span>♥ <b id="lv">3</b></span><span>Best <b id="bs">0</b></span><button id="snd">🔇 Off</button></div>
<div id="wrap"><canvas id="cv"></canvas>
<div id="ov"><h1>🧱 Brick Blast</h1><p>Bounce the ball, smash every brick!<br>Keys: ← → or A D · Touch: drag or use buttons</p><button class="big" id="go">Play</button></div></div>
<div id="ctl"><button class="k" id="bl">◀</button><button class="k" id="br">▶</button></div>
</div>
<script>
const cv=document.getElementById('cv'),g=cv.getContext('2d'),$=i=>document.getElementById(i);
const W=360,H=600,cols=['#ff4d8d','#ffb938','#3ee0c5','#6c5cff'];
let bricks,ball,pad,score,best=0,lives,state='title',parts=[],pops=[],shake=0,flash=0,held={l:0,r:0},snd=false,ac,last=0,lvl=1;
document.addEventListener('contextmenu',e=>e.preventDefault());
function rs(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d}
addEventListener('resize',rs);
function beep(f,t=.08){if(!snd||!ac)return;const o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;o.type='square';v.gain.value=.06;v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+t)}
$('snd').onclick=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();snd=!snd;$('snd').textContent=snd?'🔊 On':'🔇 Off';beep(600)};
function build(){bricks=[];const rows=4+Math.min(lvl,3);for(let r=0;r<rows;r++)for(let c=0;c<7;c++)bricks.push({x:14+c*48,y:50+r*26,w:44,h:20,col:cols[r%4],hp:1})}
function serve(){ball={x:W/2,y:520,vx:(Math.random()<.5?-1:1)*120,vy:-280-lvl*20,r:7}}
function start(){score=0;lives=3;lvl=1;pad={x:W/2-40,w:80,h:12,y:560};build();serve();state='play';$('ov').style.display='none';upd();beep(500)}
function upd(){$('sc').textContent=score;$('lv').textContent=lives;$('bs').textContent=best}
$('go').onclick=start;
function hold(id,k){const b=$(id);b.addEventListener('pointerdown',e=>{held[k]=1;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(n=>b.addEventListener(n,()=>held[k]=0))}

function clr(){held.l=held.r=0}
addEventListener('blur',clr);document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='hidden')clr()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k=='arrowleft'||k=='a')held.l=1;if(k=='arrowright'||k=='d')held.r=1;if((k==' '||k=='enter')&&state!='play'){start();e.preventDefault()}});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k=='arrowleft'||k=='a')held.l=0;if(k=='arrowright'||k=='d')held.r=0});

cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);mv(e)});cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType=='mouse')mv(e)});

function over(){state='over';best=Math.max(best,score);upd();$('ov').innerHTML='<h1>Game Over</h1><p>Score: <b>'+score+'</b><br>Best: <b>'+best+'</b></p><button class="big" id="go">Play again</button>';$('ov').style.display='flex';$('go').onclick=start;beep(120,.4)}
function step(dt){

if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-1;beep(300,.04)}
if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-1;beep(300,.04)}
if(ball.vy>0&&ball.y+ball.r>pad.y&&ball.y<pad.y+pad.h&&ball.x>pad.x-4&&ball.x<pad.x+pad.w+4){const p=(ball.x-pad.x)/pad.w-.5,s=Math.hypot(ball.vx,ball.vy)*1.01;ball.vx=p*s*1.6;ball.vy=-Math.sqrt(Math.max(s*s-ball.vx*ball.vx,s*s*.3));ball.y=pad.y-ball.r;beep(440,.06)}

const ox=Math.min(ball.x+ball.r-b.x,b.x+b.w-ball.x+ball.r),oy=Math.min(ball.y+ball.r-b.y,b.y+b.h-ball.y+ball.r);
if(ox<oy)ball.vx*=-1;else ball.vy*=-1;b.dead=1;score+=10;shake=5;burst(b.x+b.w/2,b.y+b.h/2,b.col);pops.push({x:b.x+b.w/2,y:b.y,l:.7});beep(700+Math.random()*300,.07);upd();break}
bricks=bricks.filter(b=>!b.dead);
if(!bricks.length){lvl++;build();serve();score+=50;upd();beep(900,.3)}

function draw(){
const d=cv.width/W,sy=cv.height/H,s=Math.min(d,sy);g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
const ox=(cv.width-W*s)/2,oy=(cv.height-H*s)/2;g.translate(ox+(shake?(Math.random()-.5)*shake:0),oy+(shake?(Math.random()-.5)*shake:0));g.scale(s,s);

if(!bricks)return;

g.fillStyle='#fff';g.beginPath();g.roundRect(pad.x,pad.y,pad.w,pad.h,6);g.fill();
g.shadowColor='#ffb938';g.shadowBlur=14;g.fillStyle='#ffb938';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,7);g.fill();g.shadowBlur=0;
for(const p of parts){g.globalAlpha=Math.max(p.l/.6,0);g.fillStyle=p.c;g.fillRect(p.x,p.y,5,5)}g.globalAlpha=1;
g.fillStyle='#fff';g.font='bold 16px system-ui';g.textAlign='center';for(const p of pops){g.globalAlpha=p.l;g.fillText('+10',p.x,p.y-(.7-p.l)*40)}g.globalAlpha=1;

function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;
if(state=='play')step(dt);

pops.forEach(p=>p.l-=dt);pops=pops.filter(p=>p.l>0);

rs();build();pad={x:W/2-40,w:80,h:12,y:560};serve();ball.vx=0;ball.vy=0;requestAnimationFrame(loop);
</script></body></html>
