<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><script>(function(){var n=function(){throw new Error("network is blocked in this app")};try{window.fetch=n;window.XMLHttpRequest=n;window.WebSocket=n;window.EventSource=n;window.open=function(){return null};if(navigator.sendBeacon)navigator.sendBeacon=function(){return false}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony's Pizza</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS","Segoe Print",cursive,sans-serif;background:#faf7f0;color:#1b1f5e}
.wrap{max-width:900px;margin:0 auto;min-height:100vh;border:3px solid #222;background:#fffdf8;display:flex;flex-direction:column}
header{border-bottom:3px solid #222;padding:16px 20px}
h1{margin:0;font-size:2.2rem;letter-spacing:2px}
main{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;padding:20px}
.card{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.box{border:3px solid #222;padding:16px;text-align:center;border-radius:6px;background:#fff}
.pizza{font-size:5.5rem;line-height:1;width:140px;height:140px;margin:0 auto 10px;border:3px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff3d6}
.name{font-size:1.15rem;text-align:left}
button{font:inherit;color:#1b1f5e;background:#fff;border:3px solid #222;padding:12px 16px;font-size:1.1rem;cursor:pointer;min-height:48px;border-radius:4px}
button:hover{background:#ffe9a8}
button:active{transform:scale(.96)}
.cart{margin:0 20px 20px;border:3px solid #222;padding:16px;border-radius:6px;background:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:1.3rem;text-transform:uppercase}
#list{font-size:1rem;margin:10px 0;min-height:1.4em;text-transform:none}
.btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#msg{text-align:center;padding:0 20px 14px;min-height:1.5em;font-size:1.1rem}
</style>
</head>
<body>
<div class="wrap">
<header><h1>TONY'S PIZZA</h1></header>
<main id="menu"></main>
<div class="cart">
<div class="row"><span>Your cart: <b id="count">0 items</b></span><span>Total <b id="total">$0</b></span></div>
<div id="list">Your cart is empty. Pick a pizza! 🍕</div>
<div class="btns"><button id="clear">CLEAR</button><button id="checkout">CHECKOUT</button></div>
</div>
<div id="msg"></div>
</div>
<script>
const pizzas=[{n:"Margherita",p:10,e:"🍅"},{n:"Pepperoni",p:12,e:"🍕"},{n:"Veggie",p:11,e:"🥦"}];
const cart=[0,0,0];
const menu=document.getElementById("menu");
pizzas.forEach((z,i)=>{
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<div class="box"><div class="pizza">${z.e}</div><div class="name">${z.n} $${z.p}</div></div><button>ORDER</button>`;
  d.querySelector("button").onclick=()=>{cart[i]++;document.getElementById("msg").textContent="";render()};
  menu.appendChild(d);
});
function render(){
  let c=0,t=0,parts=[];
  cart.forEach((q,i)=>{c+=q;t+=q*pizzas[i].p;if(q)parts.push(`${q} × ${pizzas[i].n}`)});
  document.getElementById("count").textContent=c+(c==1?" item":" items");
  document.getElementById("total").textContent="$"+t;
  document.getElementById("list").textContent=parts.length?parts.join(", "):"Your cart is empty. Pick a pizza! 🍕";
}
document.getElementById("clear").onclick=()=>{cart.fill(0);document.getElementById("msg").textContent="";render()};
document.getElementById("checkout").onclick=()=>{
  const c=cart.reduce((a,b)=>a+b,0);
  const t=cart.reduce((a,q,i)=>a+q*pizzas[i].p,0);
  document.getElementById("msg").textContent=c?`🎉 Thanks! Your ${c} pizza${c>1?"s":""} ($${t}) will be ready soon!`:"Your cart is empty — add a pizza first!";
  if(c){cart.fill(0);render()}
};
render();
</script>
</body>
</html>
