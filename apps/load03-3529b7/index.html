<title>Tic Tac Toe Shop</title>
<style>
:root{--bg:#faf7f0;--ink:#1a1a5e;--x:#e4572e;--o:#17a398;--gold:#f3a712;--card:#fff;--r:16px}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{touch-action:manipulation;overscroll-behavior:none;margin:0}
body{font-family:system-ui,sans-serif;color:var(--ink);min-height:100dvh;background:repeating-linear-gradient(var(--bg) 0 31px,#dde2f3 31px 32px);overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:var(--r);min-height:56px;padding:0 16px;background:var(--gold);color:var(--ink);font-weight:700;transition:transform .1s}
button:active{transform:scale(.94)}
header button{min-height:56px}
main{max-width:1000px;margin:auto;padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
section{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 4px 14px #1a1a5e22}
h2{margin:0 0 12px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.p{border:2px solid #dde2f3;border-radius:var(--r);padding:10px;text-align:center}
.p .e{font-size:44px}.p b{display:block}.p button{width:100%;margin-top:6px;min-height:56px}
.b{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:auto}
.b button{aspect-ratio:1;font-size:48px;background:#f1f3fb;padding:0}
.b button.w{background:#ffe9a8}
.s{text-align:center;font-weight:700;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
.row button{min-height:40px;padding:0 12px}
.q{display:flex;gap:6px;align-items:center}
.empty{opacity:.6;text-align:center;padding:16px}
#ty{display:none;text-align:center;font-size:20px;padding:12px;background:#d8f5ef;border-radius:var(--r);margin-top:10px}

</style></head><body>
<header><h1>❌⭕ Tic Tac Toe Shop</h1><button id="snd">🔇 Sound off</button><button id="cb">🛒 <span id="cc">0</span></button></header>
<main>
<section><h2>Play a game</h2><div class="b" id="bd"></div><div class="s" id="st">Your turn: X</div><button id="rs" style="width:100%">RESTART</button></section>
<section><h2>Shop</h2><div class="grid" id="pg"></div></section>
<section id="cs"><h2>Your cart</h2><div id="cl"></div><div class="s" id="tt"></div><button id="co" style="width:100%">Checkout</button><div id="ty">🎉 Thank you for your order!</div></section>
</main>
<script>
const P=[["✏️","Golden Pencil",3],["📓","Notebook",5],["🧩","Puzzle Cube",9],["🎲","Dice Set",6],["🏆","Mini Trophy",12],["🎨","Paint Kit",15]];

$("pg").onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;cart[i]=(cart[i]||0)+1;$("ty").style.display="none";beep(700);rc();$("cc").parentNode.classList.remove("pop");void $("cc").offsetWidth;$("cc").parentNode.classList.add("pop")};

$("rs").onclick=()=>{bd=Array(9).fill("");t="X";over=0;rb();$("st").textContent="Your turn: X";beep(500)};

rb();rc();
</script></body></html>
